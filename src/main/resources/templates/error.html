<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Portal Sarinah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container { text-align: center; max-width: 400px; padding: 20px; }
        .error-code { font-size: 72px; font-weight: 700; color: #ef4444; margin-bottom: 8px; }
        .error-msg { font-size: 16px; color: #94a3b8; margin-bottom: 32px; }
        .btn-home {
            background: rgba(26, 86, 219, 0.2);
            border: 1px solid rgba(26, 86, 219, 0.3);
            color: #60a5fa;
            border-radius: 12px;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-home:hover { background: rgba(26, 86, 219, 0.3); color: #60a5fa; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code" th:text="${statusCode ?: 'Error'}">500</div>
    <p class="error-msg" th:text="${errorMessage}">Terjadi kesalahan.</p>
    <a href="/portal" class="btn-home">
        <i class="bi bi-house me-2"></i>Kembali ke Portal
    </a>
</div>
</body>
</html>
