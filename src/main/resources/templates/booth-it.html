<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#06070a" />
    <title>IT Booth - Sarinah</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload critical resources -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.mjs">
    <link rel="preload" as="fetch" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.worker.mjs">

    <!-- Distinctive type pairing: Sora (display) + Plus Jakarta Sans (body) -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
          /* Refined deep-space palette with electric teal + violet accents */
          --bg:#06070a;
          --bg-2:#0a0c12;
          --panel:#0d1018;
          --ring:#1c2230;
          --ring-soft:rgba(255,255,255,.07);
          --acc:#2ee6a0;        /* electric mint */
          --acc-2:#36c5ff;      /* cyan */
          --acc-3:#8b6cff;      /* violet, ties to the PDF artwork */
          --glow:rgba(46,230,160,.35);
          --text:#eef2fb;
          --sub:#8d97ab;
          --sub-2:#5f697d;
          --safe-top: env(safe-area-inset-top, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --app-height: 100dvh;
          --ease-out: cubic-bezier(.16,1,.3,1);
          --ease-spring: cubic-bezier(.34,1.56,.64,1);
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{
          width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden;
        }
        body{
          background:var(--bg);color:var(--text);
          font:14px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
          -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
          touch-action:pan-x pan-y;overscroll-behavior:none;
          min-height:var(--app-height);
        }

        /* Ambient animated aurora behind everything for atmosphere */
        body::before{
          content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
          background:
            radial-gradient(40% 50% at 18% 22%, rgba(54,197,255,.10), transparent 60%),
            radial-gradient(45% 55% at 82% 18%, rgba(139,108,255,.12), transparent 60%),
            radial-gradient(50% 60% at 50% 110%, rgba(46,230,160,.08), transparent 60%);
          filter:blur(20px);
          animation:auroraDrift 22s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift{
          0%{transform:translate3d(0,0,0) scale(1)}
          50%{transform:translate3d(2%,-1.5%,0) scale(1.05)}
          100%{transform:translate3d(-2%,1.5%,0) scale(1.02)}
        }

        /* ===== Enhanced Loading ===== */
        .loading-overlay {
          position: fixed;inset: 0;background: rgba(6,7,10,.98);
          display: flex;flex-direction: column;align-items: center;justify-content: center;
          z-index: 9999;transition: opacity .45s var(--ease-out), visibility .45s var(--ease-out);
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
        }
        .loading-overlay.hide {opacity: 0;visibility: hidden;pointer-events:none}

        .spinner-container{position:relative;width:88px;height:88px}
        .spinner {
          position:absolute;inset:0;
          border: 2.5px solid rgba(46,230,160,.12);
          border-top-color: var(--acc);border-radius: 50%;
          animation: spin .9s var(--ease-out) infinite;
          box-shadow:0 0 24px rgba(46,230,160,.18)
        }
        .spinner-inner{
          position:absolute;inset:11px;
          border: 2.5px solid rgba(54,197,255,.12);
          border-bottom-color: var(--acc-2);border-radius: 50%;
          animation: spin 1.3s var(--ease-out) infinite reverse;
        }
        .spinner-core{
          position:absolute;inset:0;display:grid;place-items:center;
          font:800 13px/1 "Sora",sans-serif;letter-spacing:1px;
          color:var(--acc);text-shadow:0 0 16px var(--glow)
        }
        @keyframes spin {to { transform: rotate(360deg); }}

        .loading-text {margin-top: 30px;color: var(--sub);font-size: 13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
        .loading-progress {
          margin-top: 10px;color: var(--text);font-size: 30px;font-weight: 800;
          font-family:"Sora",sans-serif;
          font-variant-numeric: tabular-nums;
          background:linear-gradient(90deg,var(--acc),var(--acc-2));
          -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
        }
        .loading-details{margin-top:6px;color:var(--sub-2);font-size:12px;font-variant-numeric:tabular-nums}
        .loading-track{
          margin-top:18px;width:200px;height:4px;border-radius:99px;overflow:hidden;
          background:rgba(255,255,255,.06)
        }
        .loading-track>i{
          display:block;height:100%;width:0%;border-radius:99px;
          background:linear-gradient(90deg,var(--acc),var(--acc-2));
          transition:width .25s var(--ease-out);
          box-shadow:0 0 12px var(--glow)
        }

        /* ===== Viewer shell ===== */
        #viewer{
          width:min(100vw,1480px);
          height:min(var(--app-height),940px);
          max-height:var(--app-height);
          margin:auto;
          display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
          position:relative;z-index:1;min-height:0;
          background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
          border:1px solid var(--ring);
          box-shadow:
            0 40px 120px rgba(0,0,0,.6),
            0 0 0 1px rgba(255,255,255,.02),
            inset 0 1px 0 rgba(255,255,255,.07);
          will-change:transform
        }
        /* Subtle gradient hairline at top edge of shell */
        #viewer::before{
          content:"";position:absolute;top:0;left:0;right:0;height:1px;z-index:60;
          background:linear-gradient(90deg,transparent,var(--acc-2),var(--acc-3),transparent);
          opacity:.5
        }

        /* ===== Top bar ===== */
        #top{
          position:relative;flex:0 0 auto;
          display:flex;align-items:center;justify-content:space-between;
          padding:calc(11px + var(--safe-top)) 14px 11px;z-index:50;
          background:rgba(8,9,13,.72);
          border-bottom:1px solid var(--ring-soft);
          backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
          pointer-events:none
        }
        .brand{
          display:flex;align-items:center;gap:12px;pointer-events:auto;
          padding-left:2px;min-width:0
        }
        .back-btn{
          height:42px;width:42px;border-radius:13px;flex:0 0 auto;
          background:rgba(255,255,255,.04);
          border:1px solid var(--ring-soft);
          display:grid;place-items:center;color:var(--text);cursor:pointer;
          font:700 24px/0 system-ui;
          transition:all .25s var(--ease-out);
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
        }
        .back-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);transform:translateX(-2px)}
        .back-btn:active{transform:scale(.94)}
        /* Brand mark: little gradient badge */
        .brand-badge{
          height:42px;width:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
          background:linear-gradient(135deg,var(--acc-3),var(--acc-2));
          font:800 16px/1 "Sora",sans-serif;color:#06070a;
          box-shadow:0 6px 20px rgba(54,197,255,.3), inset 0 1px 0 rgba(255,255,255,.4)
        }
        .brand-text{min-width:0}
        .brand-text b{
          display:block;font-family:"Sora",sans-serif;font-size:16px;font-weight:800;color:var(--text);line-height:1.1;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px
        }
        .brand-text span{
          display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);line-height:1.3;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px
        }
        .brand-text span::before{
          content:"";width:6px;height:6px;border-radius:50%;flex:0 0 auto;
          background:var(--acc);box-shadow:0 0 8px var(--glow);
          animation:livePulse 2s ease-in-out infinite
        }
        @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}

        .iconbtn{
          height:42px;width:42px;border-radius:13px;
          background:rgba(255,255,255,.04);
          border:1px solid var(--ring-soft);
          display:grid;place-items:center;color:var(--text);cursor:pointer;
          transition:all .25s var(--ease-out);
          pointer-events:auto;
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
        }
        .iconbtn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);transform:scale(1.06)}
        .iconbtn:active{transform:scale(.94)}
        .kebab{font:700 22px/0 system-ui;letter-spacing:2px}

        .popover{
          position:absolute;top:calc(100% + 10px);right:0;width:min(248px, calc(100vw - 24px));z-index:60;
          display:none;background:rgba(13,16,24,.92);
          border:1px solid var(--ring);border-radius:16px;
          box-shadow:0 24px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
          padding:8px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
          animation:popIn .26s var(--ease-spring)
        }
        @keyframes popIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .popover.show{display:block}

        #top .popover, #top .popover * { pointer-events:auto; }

        .popitem{
          width:100%;text-align:left;background:transparent;border:0;color:#c5cee0;
          cursor:pointer;display:flex;align-items:center;gap:11px;
          padding:11px 12px;border-radius:11px;font-size:14px;font-weight:600;
          transition:background .16s ease, color .16s ease, transform .12s ease;
        }
        .popitem:hover{background:rgba(255,255,255,.06);color:var(--text)}
        .popitem:active{background:rgba(255,255,255,.1);transform:scale(.98)}
        .popitem[aria-disabled="true"]{opacity:.35;pointer-events:none}
        .popitem .ic{
          width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center;
          border-radius:8px;background:rgba(255,255,255,.05);font-size:14px
        }
        .sep{height:1px;background:var(--ring);margin:7px 4px;border:0;opacity:.7}

        /* ===== Stage ===== */
        #stage{
          position:relative;flex:1 1 auto;min-height:0;
          background:
            radial-gradient(ellipse 70% 55% at 50% 32%, rgba(54,197,255,.05), transparent 70%),
            radial-gradient(ellipse at 50% 38%,#0c0f16,#07090e 72%);
          overflow:hidden;display:grid;place-items:center;contain:layout style paint
        }
        /* faint grid texture for depth */
        #stage::after{
          content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
          background-image:
            linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
          background-size:44px 44px;
          mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 75%);
          -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 75%)
        }
        .deck{
          position:absolute;inset:clamp(10px,1.8vmin,20px);display:grid;place-items:center;isolation:isolate;
          perspective:1400px
        }
        .layer{
          position:absolute;inset:0;display:grid;place-items:center;
          will-change:opacity,transform
        }
        .layer.hide{opacity:0;pointer-events:none}

        /* Slide transition states (directional) */
        .layer.slide-enter-right{animation:enterRight .42s var(--ease-out) both}
        .layer.slide-enter-left{animation:enterLeft .42s var(--ease-out) both}
        .layer.slide-exit-left{animation:exitLeft .42s var(--ease-out) both}
        .layer.slide-exit-right{animation:exitRight .42s var(--ease-out) both}
        @keyframes enterRight{from{opacity:0;transform:translateX(8%) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
        @keyframes enterLeft{from{opacity:0;transform:translateX(-8%) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
        @keyframes exitLeft{from{opacity:1;transform:translateX(0) scale(1)}to{opacity:0;transform:translateX(-8%) scale(.97)}}
        @keyframes exitRight{from{opacity:1;transform:translateX(0) scale(1)}to{opacity:0;transform:translateX(8%) scale(.97)}}

        .pageWrap{
          position:relative;will-change:transform;touch-action:none;
          transform-origin:center center;transition:transform .12s ease-out;
          max-width:100%;max-height:100%;
        }
        canvas{
          max-width:100%;max-height:100%;background:#fff;
          border-radius:16px;
          box-shadow:
            0 40px 90px rgba(0,0,0,.7),
            0 0 0 1px rgba(0,0,0,.3),
            0 0 60px rgba(54,197,255,.06);
          display:block;
          image-rendering:auto;image-rendering:-webkit-optimize-contrast;
          transform:translateZ(0);backface-visibility:hidden
        }
        canvas.rendering{opacity:.65;transition:opacity .2s ease}

        .linkLayer{position:absolute;inset:0;pointer-events:auto;z-index:10}
        .pageWrap canvas{ pointer-events:none; }
        .linkLayer .pdf-link{
          position:absolute;display:block;pointer-events:auto;
          text-decoration:none;transition:outline .15s ease, background .15s ease;
          border-radius:4px
        }
        .linkLayer .pdf-link:hover{
          outline:2px solid var(--acc);outline-offset:2px;
          cursor:pointer;background:rgba(46,230,160,.1)
        }
        @media (hover:none) and (pointer:coarse){
          .linkLayer .pdf-link{ outline-offset:3px; }
        }

        /* Swipe feedback affordance: glowing edge hint */
        .swipe-hint{
          position:absolute;top:0;bottom:0;width:90px;z-index:15;pointer-events:none;
          opacity:0;transition:opacity .2s ease
        }
        .swipe-hint.left{left:0;background:linear-gradient(90deg, var(--glow), transparent)}
        .swipe-hint.right{right:0;background:linear-gradient(270deg, var(--glow), transparent)}
        .swipe-hint.show{opacity:.55}

        #read{
          flex:1 1 auto;min-height:0;overflow:auto;background:#080b10;display:none;
          overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
          scroll-behavior:smooth
        }
        #doc{margin:0 auto;padding:24px 18px;width:min(100%,1140px)}
        #doc canvas{
          margin-bottom:18px;width:100%;height:auto;
          box-shadow:0 6px 28px rgba(0,0,0,.45);
          border-radius:10px
        }

        /* ===== Nav arrows ===== */
        .nav{
          position:absolute;top:50%;transform:translateY(-50%);z-index:20;
          width:52px;height:52px;display:grid;place-items:center;
          border-radius:999px;
          background:rgba(13,16,24,.78);
          border:1px solid rgba(255,255,255,.1);
          backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
          color:#cfd7e6;
          box-shadow:0 8px 28px rgba(0,0,0,.45);
          cursor:pointer;
          transition:all .28s var(--ease-spring);
          user-select:none
        }
        .nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
        .nav:hover{background:rgba(46,230,160,.14);border-color:var(--acc);color:#fff;transform:translateY(-50%) scale(1.1);box-shadow:0 8px 32px var(--glow)}
        .nav:active{transform:translateY(-50%) scale(.92)}
        .nav:disabled{opacity:.2;pointer-events:none}
        #prev{left:18px}
        #next{right:18px}

        /* ===== Footer ===== */
        #footer{
          flex:0 0 auto;
          display:flex;align-items:center;justify-content:space-between;gap:16px;
          padding:12px 18px calc(12px + var(--safe-bottom));
          border-top:1px solid var(--ring-soft);
          background:rgba(8,9,13,.78);
          backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)
        }
        #indicator{
          font-family:"Sora",sans-serif;
          font-variant-numeric:tabular-nums;color:var(--text);font-size:13px;
          font-weight:700;white-space:nowrap;min-width:96px;letter-spacing:.3px
        }
        #indicator b{color:var(--acc)}
        #indicator span{color:var(--sub-2);font-weight:600}
        .bar{
          --p:0%;position:relative;height:8px;border-radius:999px;
          background:rgba(255,255,255,.05);flex:1;overflow:hidden;
          border:1px solid var(--ring-soft);cursor:pointer;
          transition:height .2s ease
        }
        .bar:hover{height:11px}
        .bar>i{
          position:absolute;inset:0 calc(100% - var(--p)) 0 0;
          background:linear-gradient(90deg, var(--acc), var(--acc-2));
          transition:inset .35s var(--ease-out);
          box-shadow:0 0 14px var(--glow)
        }
        /* tiny dot markers showing pages on the bar */
        .bar .tick{
          position:absolute;top:50%;transform:translate(-50%,-50%);
          width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);
          pointer-events:none
        }

        /* ===== Mobile optimizations ===== */
        @media (max-width: 768px) {
          #viewer{border-radius:0;border:0}
          .nav{width:46px;height:46px}
          #prev{left:12px}
          #next{right:12px}
          .popover{width:212px}
          .popitem{padding:11px;font-size:13.5px}
          #footer{padding:10px 13px calc(10px + var(--safe-bottom))}
          .iconbtn{height:40px;width:40px}
          .back-btn{height:40px;width:40px}
          .brand-badge{height:40px;width:40px}
          .brand-text b{font-size:15px}
        }
        @media (hover: none) and (pointer: coarse) {
          .iconbtn, .nav, .back-btn{min-width:44px;min-height:44px}
        }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after{
            animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;
          }
        }
        @supports (height: 100dvh){ html, body { min-height: 100dvh; } }

        @media (max-width: 768px) {
          #viewer{width:100vw;height:var(--app-height);max-height:var(--app-height);margin:0;border-radius:0;border:0}
          .deck{ inset: 10px; }
          canvas{ border-radius: 13px; }
        }
        @media (max-width: 1024px) and (orientation: landscape) {
          #top{ padding:calc(7px + var(--safe-top)) 12px 7px; }
          .iconbtn, .back-btn, .brand-badge{height:38px;width:38px;border-radius:11px}
          .popover{width:min(220px, calc(100vw - 24px))}
          .deck{ inset: 9px; }
          canvas{ border-radius: 11px; }
          .nav{ width:42px;height:42px }
          #prev{ left:11px }
          #next{ right:11px }
          #footer{ padding:8px 12px calc(8px + var(--safe-bottom));gap:12px }
          #indicator{ font-size:12px;min-width:88px }
          .bar{ height:7px }
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-container">
        <div class="spinner"></div>
        <div class="spinner-inner"></div>
        <div class="spinner-core">PDF</div>
    </div>
    <div class="loading-text">Memuat Dokumen</div>
    <div class="loading-progress" id="loadingProgress">0%</div>
    <div class="loading-details" id="loadingDetails"></div>
    <div class="loading-track"><i id="loadingTrack"></i></div>
</div>

<div id="viewer" aria-label="PDF Viewer">
    <div id="top">
        <div class="brand">
            <button class="back-btn" id="backBtn" aria-label="Kembali" title="Kembali">‹</button>
            <div class="brand-badge" aria-hidden="true">IT</div>
            <div class="brand-text">
                <b>IT Booth</b>
                <span>Informasi Booth IT</span>
            </div>
        </div>

        <div style="position:relative;pointer-events:auto">
            <button id="kebabBtn" class="iconbtn kebab" aria-label="Menu" aria-haspopup="true">⋮</button>
            <div id="pop" class="popover" role="menu" aria-label="Menu">
                <button class="popitem" id="miFullscreen"><span class="ic">⤢</span> Fullscreen</button>
                <button class="popitem" id="miMode"><span class="ic">📖</span> Mode Read</button>
                <hr class="sep">
                <button class="popitem" id="miZoomIn"><span class="ic">＋</span> Zoom In</button>
                <button class="popitem" id="miZoomOut"><span class="ic">－</span> Zoom Out</button>
                <button class="popitem" id="miZoomReset"><span class="ic">⤾</span> Reset 100%</button>
                <button class="popitem" id="miFitWidth"><span class="ic">⇔</span> Fit Width</button>
                <hr class="sep">
                <button class="popitem" id="miPlay"><span class="ic">▶</span> Play</button>
            </div>
        </div>
    </div>

    <div id="stage" aria-live="polite">
        <div class="swipe-hint left" id="hintLeft"></div>
        <div class="swipe-hint right" id="hintRight"></div>

        <button class="nav" id="prev" aria-label="Previous Page">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="deck">
            <div id="L1" class="layer">
                <div class="pageWrap" id="wrap1">
                    <canvas id="c1"></canvas>
                    <div class="linkLayer" id="links1"></div>
                </div>
            </div>
            <div id="L2" class="layer hide">
                <div class="pageWrap" id="wrap2">
                    <canvas id="c2"></canvas>
                    <div class="linkLayer" id="links2"></div>
                </div>
            </div>
        </div>
        <button class="nav" id="next" aria-label="Next Page">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <div id="read" aria-label="Read Mode"><div id="doc"></div></div>

    <div id="footer">
        <div id="indicator">Page <b>1</b> <span>/ 1</span></div>
        <div class="bar" id="progress" role="progressbar" aria-label="Progress"><i id="prog"></i></div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.DEFAULT_PDF = /*[[ ${pdfUrl} != null ? ${pdfUrl} : '/boothIT.pdf' ]]*/ '/boothIT.pdf';
    window.BACK_URL = /*[[ ${backUrl} != null ? ${backUrl} : '/townhall' ]]*/ '/townhall';
    /*]]>*/
</script>

<script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.worker.mjs";
    if ("disableCreateObjectURL" in pdfjsLib) pdfjsLib.disableCreateObjectURL = true;

    function setAppHeight(){
      const h = Math.max(320, Math.round(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 0));
      document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight, {passive:true});
    window.visualViewport?.addEventListener('resize', setAppHeight, {passive:true});

    const params = new URLSearchParams(location.search);
    let PDF_URL = params.get('pdf') || window.DEFAULT_PDF;
    const pdfId = params.get('id');
    if (pdfId) PDF_URL = `/api/admin/users/pdf/${pdfId}`;
    const catalogueId = params.get('catalogue');
    if (catalogueId) PDF_URL = `/api/pdf/catalogue/${catalogueId}`;

    let pdfBytesCache = null;

    const isMobile = (() => {
      if ('maxTouchPoints' in navigator) return navigator.maxTouchPoints > 0;
      if ('msMaxTouchPoints' in navigator) return navigator.msMaxTouchPoints > 0;
      const mQ = window.matchMedia?.('(pointer:coarse)');
      if (mQ?.media === '(pointer:coarse)') return !!mQ.matches;
      if ('orientation' in window) return true;
      return /Android|webOS|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);
    })();

    const isLowEndDevice = (() => {
      if (navigator.deviceMemory && navigator.deviceMemory < 4) return true;
      if (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) return true;
      return false;
    })();

    const prefersReducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;

    const PERF = {
      MAX_DPR_SLIDE: isMobile ? (isLowEndDevice ? 2 : 2.5) : 3,
      MAX_DPR_READ:  isMobile ? (isLowEndDevice ? 2.5 : 3) : 3.5,
      DEBOUNCE_ZOOM: isMobile ? 150 : 80,
      DEBOUNCE_LIVE: isMobile ? 220 : 100,
      OBSERVER_MARGIN: isMobile ? '150px' : '200px',
      USE_OFFSCREEN: !isMobile && 'OffscreenCanvas' in window
    };

    let pdfDoc=null, pageNum=1, numPages=0;
    let active=1, animating=false, fitMode='page', zoomPct=100, readZoomPct=100;
    const ZMIN=25, ZMAX=600, ZSTEP=12;

    let viewMode='slide';
    let auto=false, timer=null, SLIDE_MS=8000;

    const $ = id => document.getElementById(id);
    const loadingOverlay = $('loadingOverlay');
    const loadingProgress = $('loadingProgress');
    const loadingDetails = $('loadingDetails');
    const loadingTrack = $('loadingTrack');

    const viewer=$('viewer'), stage=$('stage'), read=$('read'), docEl=$('doc');
    const L1=$('L1'), L2=$('L2');
    const c1=$('c1'), c2=$('c2');
    const ctx1=c1.getContext('2d',{alpha:false,desynchronized:true,willReadFrequently:false});
    const ctx2=c2.getContext('2d',{alpha:false,desynchronized:true,willReadFrequently:false});
    const wrap1=$('wrap1'), wrap2=$('wrap2');
    const links1=$('links1'), links2=$('links2');

    const prevBtn=$('prev'), nextBtn=$('next');
    const indicator=$('indicator');
    const progressBar=$('progress'), prog=$('prog');
    const hintLeft=$('hintLeft'), hintRight=$('hintRight');

    const kebab=$('kebabBtn'), pop=$('pop');

    $('backBtn').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else window.location.href = window.BACK_URL || '/townhall';
    });

    pop.addEventListener('click', (e) => e.stopPropagation());
    const closePop=()=>pop.classList.remove('show');
    const stopThen=(fn)=>(e)=>{e.stopPropagation(); fn(); closePop();};

    const wrapOf = ()=> active===1?wrap1:wrap2;
    const canvasOf = ()=> active===1?c1:c2;
    const ctxOf = ()=> active===1?ctx1:ctx2;
    const linksOf  = ()=> active===1?links1:links2;

    kebab.addEventListener('click',(e)=>{e.stopPropagation();pop.classList.toggle('show')});
    document.addEventListener('click',closePop);

    $('miFullscreen').addEventListener('click', stopThen(()=> {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
      if (isFs) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      } else {
        const elem = viewer;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      }
    }));

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange'].forEach(event => {
      document.addEventListener(event, () => {
        const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
        $('miFullscreen').innerHTML = isFullscreen
          ? '<span class="ic">⤓</span> Exit Fullscreen'
          : '<span class="ic">⤢</span> Fullscreen';
      });
    });

    $('miFitWidth').addEventListener('click', stopThen(async ()=> {
      if(viewMode !== 'slide') return;
      fitMode='width'; zoomPct = 100; gesture.scaleTmp = 1; gesture.tx = 0; gesture.ty = 0;
      setTransform();
      await renderFit(pageNum, canvasOf(), ctxOf(), linksOf());
    }));

    $('miZoomIn').addEventListener('click', stopThen(()=> setZoom(zoomPct+ZSTEP)));
    $('miZoomOut').addEventListener('click', stopThen(()=> setZoom(zoomPct-ZSTEP)));
    $('miZoomReset').addEventListener('click', stopThen(()=> resetZoomToFit()));

    function setPlayEnabled(on){ $('miPlay').setAttribute('aria-disabled', on? 'false':'true'); }

    function updateModeLabel(){
      $('miMode').innerHTML = (viewMode==='slide') ? '<span class="ic">📖</span> Mode Read' : '<span class="ic">🖼️</span> Mode Slide';
      setPlayEnabled(viewMode==='slide');
    }
    function updatePlayLabel(){
      $('miPlay').innerHTML = auto ? '<span class="ic">⏸</span> Pause' : '<span class="ic">▶</span> Play';
    }

    function startAuto(){
      if(viewMode!=='slide' || auto || !numPages || numPages <= 1) return;
      auto=true; updatePlayLabel();
      timer=setInterval(()=> {
        if(pageNum >= numPages) show(1, 'left');
        else show(pageNum + 1, 'right');
      }, SLIDE_MS);
    }
    function stopAuto(){
      if(timer){clearInterval(timer); timer=null;}
      if(auto){auto=false; updatePlayLabel();}
    }
    const stopAutoOnInteraction = ()=>{ if(auto) stopAuto(); };

    $('miPlay').addEventListener('click', stopThen(()=> {
      if(viewMode!=='slide') return;
      auto?stopAuto():startAuto();
    }));
    $('miMode').addEventListener('click', stopThen(()=> {
      viewMode==='slide' ? enterReadMode() : exitReadMode();
    }));

    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

    const renderIntentFor = (pct, dpr) => (pct >= 150 || dpr >= 2.5) ? 'print' : 'display';

    function updateIndicator(){
      indicator.innerHTML = `Page <b>${pageNum}</b> <span>/ ${numPages}</span>`;
      const pct=Math.round(((pageNum-1)/(numPages-1||1))*100);
      progressBar.style.setProperty('--p', pct+'%');
      prog.style.inset=`0 ${100-pct}% 0 0`;
    }

    function buildProgressTicks(){
      progressBar.querySelectorAll('.tick').forEach(t=>t.remove());
      if(numPages<=1 || numPages>40) return; // skip if too many
      const frag=document.createDocumentFragment();
      for(let i=1;i<=numPages;i++){
        const tk=document.createElement('span');
        tk.className='tick';
        tk.style.left=((i-1)/(numPages-1)*100)+'%';
        frag.appendChild(tk);
      }
      progressBar.appendChild(frag);
    }

    async function calcViewportSlide(page){
      const base = page.getViewport({scale:1});
      const pad = isMobile ? 16 : 30;
      const W = Math.max(80, stage.clientWidth - pad);
      const H = Math.max(80, stage.clientHeight - pad);
      const pageFitScale = Math.min(W / base.width, H / base.height);
      let fitScale = (fitMode === 'width') ? (W / base.width) : pageFitScale;
      if (base.height * fitScale > H) fitScale = pageFitScale;
      const dprBase = Math.min(PERF.MAX_DPR_SLIDE, Math.max(1, devicePixelRatio || 1));
      const effectiveZoom = zoomPct / 100;
      const rasterScale = fitScale * dprBase * effectiveZoom;
      return {
        viewport: page.getViewport({scale:rasterScale}),
        dpr: dprBase,
        cssWidth: base.width * fitScale,
        cssHeight: base.height * fitScale
      };
    }

    async function calcViewportRead(page){
      const base=page.getViewport({scale:1});
      const cw=docEl.clientWidth-2;
      const dpr=Math.min(PERF.MAX_DPR_READ,Math.max(1,devicePixelRatio||1));
      const fitScale=(cw/base.width);
      const rasterScale = fitScale * dpr * (readZoomPct/100);
      return { viewport: page.getViewport({scale:rasterScale}), dpr };
    }

    async function buildLinks(page, viewport, layer, dpr){
      if (!layer) return;
      const fragment = document.createDocumentFragment();
      const annotations = await page.getAnnotations({ intent: 'display' });
      const factor = 1 / (dpr * (zoomPct / 100));
      for (const ann of annotations){
        if (ann.subtype !== 'Link') continue;
        const url = ann.url || ann.unsafeUrl || ann?.a?.URI || ann?.action?.URI || null;
        const hasInternalDest = !!ann.dest;
        if (!url && !hasInternalDest) continue;
        const rect = viewport.convertToViewportRectangle(ann.rect);
        const x1 = Math.min(rect[0], rect[2]);
        const x2 = Math.max(rect[0], rect[2]);
        const y1 = Math.min(rect[1], rect[3]);
        const y2 = Math.max(rect[1], rect[3]);
        const a = document.createElement('a');
        a.className = 'pdf-link';
        a.style.cssText = `left:${x1*factor}px;top:${y1*factor}px;width:${(x2-x1)*factor}px;height:${(y2-y1)*factor}px`;
        if (url) {
          a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        } else if (hasInternalDest) {
          a.href = '#';
          a.addEventListener('click', async (e) => {
            e.preventDefault(); e.stopPropagation();
            try {
              const dest = await pdfDoc.getDestination(ann.dest);
              const ref = dest?.[0];
              if (!ref) return;
              const targetPage = await pdfDoc.getPageIndex(ref) + 1;
              if (targetPage) show(targetPage, targetPage>pageNum?'right':'left');
            } catch(err) { console.warn('dest jump failed', err); }
          });
        }
        a.addEventListener('pointerdown', (e)=>e.stopPropagation());
        a.addEventListener('pointerup', (e)=>e.stopPropagation());
        a.addEventListener('click', (e)=>e.stopPropagation());
        fragment.appendChild(a);
      }
      layer.innerHTML = '';
      layer.appendChild(fragment);
    }

    let renderToken = 0;
    async function renderFit(p,canvas,ctx,linkLayer){
      const token = ++renderToken;
      if(!pdfDoc) return;
      canvas.classList.add('rendering');
      try {
        const page=await pdfDoc.getPage(p);
        if (token !== renderToken) return;
        const {viewport, dpr, cssWidth, cssHeight}=await calcViewportSlide(page);
        if (token !== renderToken) return;
        const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
        if (canvas.width !== w || canvas.height !== h) { canvas.width=w; canvas.height=h; }
        canvas.style.width=Math.max(1, Math.floor(cssWidth))+'px';
        canvas.style.height=Math.max(1, Math.floor(cssHeight))+'px';
        ctx.imageSmoothingEnabled=false;
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,w,h);
        await page.render({ canvasContext:ctx, viewport, intent:renderIntentFor(zoomPct,devicePixelRatio||1) }).promise;
        if (token !== renderToken) return;
        await buildLinks(page, viewport, linkLayer, dpr);
      } finally {
        canvas.classList.remove('rendering');
      }
    }

    const gesture = {
      pointers:new Map(), mode:'idle',
      dist0:1, scaleTmp:1, tx:0, ty:0,
      anchor:{x:0,y:0}, mid0:{x:0,y:0},
      startZoom:100, startTx:0, startTy:0,
      livePct:100, _tap:{t:0,x:0,y:0},
      rafId:null
    };

    function setTransform(){
      if(gesture.rafId) return;
      gesture.rafId = requestAnimationFrame(()=> {
        const w=wrapOf();
        const totalScale = (zoomPct/100) * gesture.scaleTmp;
        w.style.transform = `translate(${gesture.tx}px, ${gesture.ty}px) scale(${totalScale})`;
        gesture.rafId = null;
      });
    }

    function clampPan(limit=120){
      const cnv=canvasOf();
      const w=cnv.clientWidth, h=cnv.clientHeight;
      const totalScale = (zoomPct/100) * gesture.scaleTmp;
      const maxX=(w*(totalScale)-w)/2 + limit;
      const maxY=(h*(totalScale)-h)/2 + limit;
      gesture.tx = clamp(gesture.tx,-maxX,maxX);
      gesture.ty = clamp(gesture.ty,-maxY,maxY);
    }

    async function resetZoomToFit() {
      if(viewMode !== 'slide') return;
      zoomPct = 100; gesture.scaleTmp = 1; gesture.tx = 0; gesture.ty = 0; fitMode = 'page';
      setTransform();
      await renderFit(pageNum, canvasOf(), ctxOf(), linksOf());
    }

    /* ===== Page transition with directional slide animation ===== */
    async function show(p, dir){
      if(viewMode!=='slide' || animating || !pdfDoc || p === pageNum) return;
      // auto direction if not given
      if(!dir) dir = p > pageNum ? 'right' : 'left';
      animating=true;
      prevBtn.disabled=nextBtn.disabled=true;

      const nxtL=(active===1)?L2:L1;
      const curL=(active===1)?L1:L2;
      const nxtC=(active===1)?c2:c1;
      const nxtCtx=(active===1)?ctx2:ctx1;
      const nxtLinks=(active===1)?links2:links1;

      // render incoming page off-screen
      nxtL.classList.add('hide');
      await renderFit(p,nxtC,nxtCtx,nxtLinks);

      if(prefersReducedMotion){
        curL.classList.add('hide');
        nxtL.classList.remove('hide');
      } else {
        // clear any prior anim classes
        ['slide-enter-right','slide-enter-left','slide-exit-left','slide-exit-right']
          .forEach(c=>{curL.classList.remove(c);nxtL.classList.remove(c);});

        // 'right' = moving forward (next): new slides in from right, old exits left
        const enterCls = dir==='right' ? 'slide-enter-right' : 'slide-enter-left';
        const exitCls  = dir==='right' ? 'slide-exit-left'   : 'slide-exit-right';

        nxtL.classList.remove('hide');
        nxtL.classList.add(enterCls);
        curL.classList.add(exitCls);

        await new Promise(res=>{
          let done=0;
          const onEnd=()=>{ if(++done>=1) res(); };
          nxtL.addEventListener('animationend', onEnd, {once:true});
          setTimeout(res, 480); // safety
        });

        curL.classList.add('hide');
        curL.classList.remove(exitCls);
        nxtL.classList.remove(enterCls);
      }

      active=(active===1)?2:1;
      pageNum=p;
      updateIndicator();

      gesture.tx = 0; gesture.ty = 0; gesture.scaleTmp = 1;
      clampPan(); setTransform();

      prevBtn.disabled=nextBtn.disabled=false;
      animating=false;
    }

    prevBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum>1) show(pageNum-1,'left'); };
    nextBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum<numPages) show(pageNum+1,'right'); };

    progressBar.addEventListener('click',(e)=> {
      if(zoomPct>100) return;
      const r=progressBar.getBoundingClientRect();
      const pct=clamp((e.clientX-r.left)/r.width,0,1);
      const target=Math.max(1,Math.round(1+pct*(numPages-1)));
      if(target!==pageNum){ stopAutoOnInteraction(); show(target, target>pageNum?'right':'left'); }
    });

    let zoomTimer=null;
    function setZoom(pct){
      if(viewMode==='read'){
        readZoomPct=clamp(pct,ZMIN,ZMAX);
        destroyReadPages(); buildReadPages(); return;
      }
      zoomPct=clamp(pct,ZMIN,ZMAX);
      clearTimeout(zoomTimer); clampPan(); setTransform();
      zoomTimer=setTimeout(()=> { renderFit(pageNum, canvasOf(), ctxOf(), linksOf()); }, PERF.DEBOUNCE_ZOOM);
    }

    const live = { target: 100, rendering:false, scheduled:false };
    function requestLiveRender(pct){
      live.target = clamp(Math.round(pct), ZMIN, ZMAX);
      if(live.scheduled || live.rendering) return;
      live.scheduled = true;
      setTimeout(async ()=> {
        live.scheduled = false;
        if(live.rendering) return;
        live.rendering = true;
        zoomPct = live.target; gesture.scaleTmp = 1;
        clampPan(); setTransform();
        await renderFit(pageNum, canvasOf(), ctxOf(), linksOf());
        live.rendering = false;
      }, PERF.DEBOUNCE_LIVE);
    }

    const getMid=()=>{ const v=[...gesture.pointers.values()]; return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; }
    const dist=()=>{ const v=[...gesture.pointers.values()]; const dx=v[0].x-v[1].x, dy=v[0].y-v[1].y; return Math.hypot(dx,dy); }
    function clientToWrapLocal(mid){
      const w=wrapOf(); const r=w.getBoundingClientRect();
      return { x: mid.x - (r.left + r.width/2), y: mid.y - (r.top + r.height/2) };
    }

    function onPointerDown(e){
      if (e.target.closest('.pdf-link')) return;
      if(viewMode!=='slide') return;
      stopAutoOnInteraction();
      const w=wrapOf();
      w.setPointerCapture?.(e.pointerId);
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.pointers.size===2){
        gesture.mode='pinch';
        gesture.dist0=dist(); gesture.scaleTmp=1; gesture.mid0=getMid();
        gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
        gesture.startZoom = zoomPct; gesture.livePct = zoomPct;
        gesture.anchor = clientToWrapLocal(gesture.mid0);
      }else if(gesture.pointers.size===1 && zoomPct>100){
        gesture.mode='pan';
        gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
        gesture._anchor = {x:e.clientX,y:e.clientY};
      }
    }
    function onPointerMove(e){
      if(!gesture.pointers.has(e.pointerId)) return;
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.mode==='pinch'){
        const mid=getMid();
        const factor = clamp(dist()/gesture.dist0, 0.5, 3);
        const newPct = clamp(gesture.startZoom * factor, ZMIN, ZMAX);
        gesture.scaleTmp = newPct / gesture.startZoom;
        const w=wrapOf(); const r=w.getBoundingClientRect();
        const centerX = r.left + r.width/2, centerY = r.top + r.height/2;
        const totalScale = (gesture.startZoom/100) * gesture.scaleTmp;
        gesture.tx = (mid.x - centerX) - gesture.anchor.x * totalScale;
        gesture.ty = (mid.y - centerY) - gesture.anchor.y * totalScale;
        clampPan(); setTransform();
        gesture.livePct = newPct;
        if(!isMobile) requestLiveRender(newPct);
        return;
      }
      if(gesture.mode==='pan'){
        const p=[...gesture.pointers.values()][0];
        gesture.tx = gesture.startTx + (p.x - gesture._anchor.x);
        gesture.ty = gesture.startTy + (p.y - gesture._anchor.y);
        clampPan(); setTransform();
      }
    }
    function onPointerUp(e){
      if(gesture.pointers.has(e.pointerId)) gesture.pointers.delete(e.pointerId);
      if(gesture.mode==='pinch' && gesture.pointers.size<2){
        gesture.mode='idle'; gesture._anchor=null;
        if(isMobile){ requestLiveRender(gesture.livePct || zoomPct); }
        else{ gesture.scaleTmp = 1; clampPan(); setTransform(); }
        return;
      }
      if(gesture.mode==='pan' && gesture.pointers.size===0){
        gesture.mode='idle'; gesture._anchor=null;
      }
    }

    [wrap1,wrap2].forEach(w=> {
      w.addEventListener('pointerdown',onPointerDown,{passive:true});
      w.addEventListener('pointermove',onPointerMove,{passive:true});
      w.addEventListener('pointerup',onPointerUp,{passive:true});
      w.addEventListener('pointercancel',onPointerUp,{passive:true});
    });

    stage.addEventListener('wheel', (e) => {
      if (viewMode !== 'slide' || !pdfDoc) return;
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault(); stopAutoOnInteraction();
        const delta = e.deltaY; const step = (Math.abs(delta) > 40 ? 8 : 4);
        const dir = delta > 0 ? -step : step;
        requestLiveRender(zoomPct + dir); return;
      }
      if (zoomPct <= 100) {
        const dy = e.deltaY || 0;
        if (Math.abs(dy) < 1) return;
        stopAutoOnInteraction();
        if (dy > 0 && pageNum < numPages) { e.preventDefault(); show(pageNum + 1,'right'); }
        else if (dy < 0 && pageNum > 1) { e.preventDefault(); show(pageNum - 1,'left'); }
        return;
      }
      e.preventDefault(); stopAutoOnInteraction();
      gesture.tx += -e.deltaX; gesture.ty += -e.deltaY;
      clampPan(); setTransform();
    }, { passive: false });

    /* ===== Improved SWIPE: live tracking + edge-glow feedback + threshold ===== */
    const swipe = { active:false, startX:0, startY:0, lastX:0, dx:0, id:null, locked:null };
    const SWIPE_THRESHOLD = isMobile ? 55 : 70;   // px to trigger page change
    const SWIPE_MAX_PEEK = 60;                     // how far current page can shift while dragging

    function setHint(dir, strength){
      const el = dir==='right' ? hintRight : hintLeft;
      const other = dir==='right' ? hintLeft : hintRight;
      other.classList.remove('show');
      if(strength>0.25){ el.classList.add('show'); el.style.opacity = (0.25 + strength*0.4); }
      else el.classList.remove('show');
    }
    function clearHints(){ hintLeft.classList.remove('show'); hintRight.classList.remove('show'); }

    stage.addEventListener('pointerdown', (e)=> {
      if (e.target.closest('.pdf-link')) return;
      if(viewMode!=='slide' || zoomPct>100 || animating) return;
      swipe.active=true; swipe.id=e.pointerId;
      swipe.startX=swipe.lastX=e.clientX; swipe.startY=e.clientY;
      swipe.dx=0; swipe.locked=null;
    });

    stage.addEventListener('pointermove', (e)=> {
      if(!swipe.active || e.pointerId!==swipe.id) return;
      if(gesture.mode==='pinch' || zoomPct>100){ swipe.active=false; clearHints(); return; }
      const dx = e.clientX - swipe.startX;
      const dy = e.clientY - swipe.startY;
      // lock axis once intent is clear
      if(swipe.locked===null && (Math.abs(dx)>8 || Math.abs(dy)>8)){
        swipe.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(swipe.locked!=='x') return;
      swipe.dx = dx; swipe.lastX=e.clientX;
      // live peek: shift the current page slightly, with resistance at the ends
      const atStart = pageNum<=1 && dx>0;
      const atEnd = pageNum>=numPages && dx<0;
      const resist = (atStart||atEnd) ? 0.25 : 1;
      const peek = clamp(dx*0.35*resist, -SWIPE_MAX_PEEK, SWIPE_MAX_PEEK);
      const w=wrapOf();
      w.style.transition='none';
      w.style.transform = `translate(${peek}px,0) scale(${zoomPct/100})`;
      // edge glow feedback
      const strength = clamp(Math.abs(dx)/(SWIPE_THRESHOLD*1.6),0,1);
      if(dx<0 && !atEnd) setHint('right', strength);
      else if(dx>0 && !atStart) setHint('left', strength);
      else clearHints();
    });

    function endSwipe(){
      if(!swipe.active) return;
      const dx = swipe.dx;
      swipe.active=false; swipe.id=null;
      clearHints();
      const w=wrapOf();
      w.style.transition='';
      // snap back first
      w.style.transform = `translate(0,0) scale(${zoomPct/100})`;
      if(swipe.locked==='x' && Math.abs(dx)>SWIPE_THRESHOLD){
        stopAutoOnInteraction();
        if(dx<0 && pageNum<numPages) show(pageNum+1,'right');
        else if(dx>0 && pageNum>1) show(pageNum-1,'left');
      }
      swipe.locked=null;
    }
    stage.addEventListener('pointerup', endSwipe);
    stage.addEventListener('pointercancel', endSwipe);
    stage.addEventListener('pointerleave', (e)=>{ if(swipe.active) endSwipe(); });

    /* double-tap to zoom (kept, but separated from swipe) */
    stage.addEventListener('pointerup', (e)=> {
      if (e.target.closest('.pdf-link')) return;
      if(viewMode!=='slide') return;
      // ignore if this was a swipe gesture
      if(Math.abs(swipe.dx)>15) return;
      const now=Date.now();
      const pos={x:e.clientX,y:e.clientY};
      const gap = now - gesture._tap.t;
      const moved = Math.hypot(pos.x-(gesture._tap.x||0), pos.y-(gesture._tap.y||0));
      if(gap<280 && moved<20){
        stopAutoOnInteraction();
        gesture.anchor = clientToWrapLocal(pos);
        requestLiveRender(zoomPct<=100 ? 180 : 100);
      }
      gesture._tap={t:now,x:pos.x,y:pos.y};
    });

    /* ===== Read mode ===== */
    let io=null;
    const renderedPages = new Set();
    const ensureObserver=()=> io ?? (io=new IntersectionObserver(async (ents)=> {
      for(const ent of ents){
        if(!ent.isIntersecting) continue;
        const cnv=ent.target;
        const pageKey = cnv.dataset.page;
        if(renderedPages.has(pageKey)) continue;
        renderedPages.add(pageKey);
        const i=+pageKey;
        try {
          const page=await pdfDoc.getPage(i);
          const {viewport,dpr}=await calcViewportRead(page);
          const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
          cnv.width=w; cnv.height=h;
          cnv.style.width=Math.floor(w/dpr)+'px';
          cnv.style.height=Math.floor(h/dpr)+'px';
          const cctx=cnv.getContext('2d',{alpha:false});
          cctx.fillStyle='#fff'; cctx.fillRect(0,0,w,h);
          await page.render({ canvasContext:cctx, viewport, intent:renderIntentFor(readZoomPct,devicePixelRatio||1) }).promise;
        } catch(err) {
          console.error('Error rendering page', i, err);
          renderedPages.delete(pageKey);
        }
      }
    },{root:read,rootMargin:PERF.OBSERVER_MARGIN,threshold:0.01}));

    function buildReadPages(){
      const obs=ensureObserver();
      renderedPages.clear(); docEl.innerHTML='';
      const fragment = document.createDocumentFragment();
      for(let i=1;i<=numPages;i++){
        const cnv=document.createElement('canvas');
        cnv.className='page'; cnv.dataset.page=i; cnv.width=100; cnv.height=100;
        cnv.style.width='100%'; cnv.style.background='#f3f4f6';
        fragment.appendChild(cnv);
      }
      docEl.appendChild(fragment);
      docEl.querySelectorAll('canvas').forEach(cnv => obs.observe(cnv));
      read.scrollTop=0;
    }
    function destroyReadPages(){
      if(io){ io.disconnect(); io=null; }
      renderedPages.clear(); docEl.innerHTML='';
    }
    function enterReadMode(){
      if(viewMode==='read') return;
      stopAuto(); viewMode='read'; updateModeLabel();
      stage.style.display='none'; read.style.display='block';
      buildReadPages();
    }
    function exitReadMode(){
      if(viewMode==='slide') return;
      stopAuto(); viewMode='slide'; updateModeLabel();
      destroyReadPages(); read.style.display='none'; stage.style.display='grid';
      fitMode='page'; gesture.tx = 0; gesture.ty = 0; gesture.scaleTmp = 1;
      setTransform();
      renderFit(pageNum, canvasOf(), ctxOf(), linksOf());
    }

    let resizeRefreshTimer = null;
    function refreshSlideLayout(){
      if(viewMode !== 'slide' || !pdfDoc) return;
      fitMode = 'page'; zoomPct = 100; gesture.scaleTmp = 1; gesture.tx = 0; gesture.ty = 0;
      setTransform();
      renderFit(pageNum, canvasOf(), ctxOf(), linksOf());
    }
    function scheduleSlideRefresh(delay=120){
      clearTimeout(resizeRefreshTimer);
      resizeRefreshTimer = setTimeout(refreshSlideLayout, delay);
    }
    window.addEventListener('orientationchange', () => scheduleSlideRefresh(260), {passive:true});
    window.addEventListener('resize', () => scheduleSlideRefresh(140), {passive:true});
    window.visualViewport?.addEventListener('resize', () => scheduleSlideRefresh(140), {passive:true});

    document.addEventListener('keydown',(e)=> {
      if(e.key==='0'){ stopAutoOnInteraction(); e.preventDefault(); resetZoomToFit(); }
      if(e.key==='+'||e.key==='='){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct+ZSTEP); }
      if(e.key==='-'||e.key==='_'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct-ZSTEP); }
      if(e.key===' '){ e.preventDefault(); auto?stopAuto():startAuto(); }
      if(e.key==='ArrowRight' && pageNum<numPages){ stopAutoOnInteraction(); show(pageNum+1,'right'); }
      if(e.key==='ArrowLeft' && pageNum>1){ stopAutoOnInteraction(); show(pageNum-1,'left'); }
      if(e.key==='f' || e.key==='F'){
        e.preventDefault();
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if(isFs){
          if(document.exitFullscreen) document.exitFullscreen();
          else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          const elem = viewer;
          if(elem.requestFullscreen) elem.requestFullscreen();
          else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }
      }
    });

    // ===== Loading with streaming progress =====
    (async function(){
      const startedAt = performance.now();
      try {
        const resp = await fetch(PDF_URL, {
          method: 'GET',
          headers: { 'Accept': 'application/pdf', 'Cache-Control': 'no-cache' },
          credentials: 'same-origin'
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        const contentLength = resp.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength, 10) : 0;
        let loaded = 0;
        const chunks = [];
        const reader = resp.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value); loaded += value.length;
          if (total > 0) {
            const pct = Math.round((loaded / total) * 100);
            loadingProgress.textContent = pct + '%';
            loadingTrack.style.width = pct + '%';
            loadingDetails.textContent = `${(loaded/1024/1024).toFixed(2)} MB / ${(total/1024/1024).toFixed(2)} MB`;
          } else {
            const mb = (loaded/1024/1024).toFixed(2);
            loadingProgress.textContent = mb + ' MB';
            loadingTrack.style.width = '60%';
            loadingDetails.textContent = 'Mengunduh...';
          }
        }
        const pdfBytes = new Uint8Array(loaded);
        let position = 0;
        for (const chunk of chunks) { pdfBytes.set(chunk, position); position += chunk.length; }
        pdfBytesCache = pdfBytes;

        loadingProgress.textContent = 'Memproses';
        loadingTrack.style.width = '100%';
        loadingDetails.textContent = 'Membaca struktur PDF';

        const task = pdfjsLib.getDocument({
          data: pdfBytes,
          cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/cmaps/",
          cMapPacked: true,
          standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/standard_fonts/",
          useSystemFonts: false, disableAutoFetch: false, disableStream: false,
          isEvalSupported: true, enableXfa: false, verbosity: 0
        });
        pdfDoc = await task.promise;
        numPages = pdfDoc.numPages;

        loadingProgress.textContent = 'Render';
        loadingDetails.textContent = `Halaman 1 dari ${numPages}`;

        pageNum = 1;
        updateIndicator();
        buildProgressTicks();

        fitMode = 'page'; zoomPct = 100; gesture.scaleTmp = 1; gesture.tx = 0; gesture.ty = 0;

        await renderFit(pageNum,c1,ctx1,links1);
        L1.classList.remove('hide'); L2.classList.add('hide');

        updatePlayLabel(); updateModeLabel(); clampPan(); setTransform();

        setTimeout(() => loadingOverlay.classList.add('hide'), 300);
        console.log('✓ Loaded in', Math.round(performance.now() - startedAt), 'ms');

      } catch (error) {
        console.error('Failed to load PDF:', error);
        loadingProgress.textContent = 'Error';
        loadingProgress.style.background = 'none';
        loadingProgress.style.webkitTextFillColor = '#ef4444';
        loadingProgress.style.color = '#ef4444';
        loadingTrack.style.width='100%';
        loadingTrack.style.background='#ef4444';
        let errorMsg = 'Gagal memuat PDF';
        if (error.message.includes('HTTP 404')) errorMsg = 'PDF tidak ditemukan (404)';
        else if (error.message.includes('HTTP 403')) errorMsg = 'Akses ditolak (403)';
        else if (error.message.includes('HTTP 500')) errorMsg = 'Kesalahan server (500)';
        else if (error.message) errorMsg = error.message;
        loadingDetails.textContent = errorMsg;
        setTimeout(() => {
          const retryBtn = document.createElement('button');
          retryBtn.textContent = '🔄 Coba Lagi';
          retryBtn.style.cssText = 'margin-top:22px;padding:11px 26px;background:linear-gradient(135deg,#2ee6a0,#36c5ff);color:#06070a;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-family:Sora,sans-serif';
          retryBtn.onclick = () => location.reload();
          loadingOverlay.appendChild(retryBtn);
        }, 500);
      }
    })();
</script>

</body>
</html>
