<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mengalihkan...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        font-family: Inter, sans-serif;
        background: #0f172a; color: #f1f5f9;
        display: flex; align-items: center;
        justify-content: center; min-height: 100vh;
    }
  </style>
</head>
<body>

<form id="relayForm" th:action="${targetUrl}" method="POST">
  <th:block th:each="entry : ${fields}">
    <!-- Skip __CSRFToken__ dulu, akan diisi JS -->
    <input th:if="${entry.key != '__CSRFToken__'}"
           type="hidden"
           th:name="${entry.key}"
           th:value="${entry.value}">
  </th:block>
  <!-- Placeholder untuk CSRF -->
  <input type="hidden" name="__CSRFToken__" id="csrfField" value="">
</form>

<div class="text-center">
  <div class="spinner-border text-primary mb-3" role="status"></div>
  <p>Mengalihkan ke <strong th:text="${appName}">App</strong>...</p>
</div>

<script th:inline="javascript">
  const loginUrl = [[${targetUrl}]];

  // Fetch login page dari browser untuk dapat CSRF token yang valid
  fetch(loginUrl, { credentials: 'include' })
      .then(r => r.text())
      .then(html => {
          const match = html.match(/name="csrf_token"\s+content="([a-f0-9]+)"/);
          if (match) {
              document.getElementById('csrfField').value = match[1];
          }
          document.getElementById('relayForm').submit();
      })
      .catch(() => {
          // Fallback: submit tanpa CSRF (mungkin tetap works)
          document.getElementById('relayForm').submit();
      });
</script>

</body>
</html>
