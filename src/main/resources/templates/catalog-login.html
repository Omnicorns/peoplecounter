<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(99,102,241,.18), transparent 30%),
                linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .login-wrapper{
            width:100%;
            max-width:430px;
        }

        .login-card{
            background:rgba(255,255,255,.97);
            backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,.2);
            border-radius:24px;
            overflow:hidden;
            box-shadow:0 24px 60px rgba(0,0,0,.25);
        }

        .login-header{
            padding:32px 30px 22px;
            text-align:center;
            background:linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
            border-bottom:1px solid #e2e8f0;
        }

        .logo{
            width:72px;
            height:72px;
            margin:0 auto 16px;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            font-weight:800;
            color:#fff;
            background:linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow:0 14px 30px rgba(37,99,235,.28);
        }

        .login-header h2{
            font-size:24px;
            font-weight:800;
            color:#0f172a;
            margin-bottom:6px;
        }

        .login-header p{
            font-size:14px;
            color:#64748b;
            line-height:1.6;
        }

        .login-body{
            padding:28px 30px 30px;
        }

        .alert{
            margin-bottom:18px;
            padding:12px 14px;
            border-radius:14px;
            font-size:13px;
            font-weight:500;
            line-height:1.5;
            border:1px solid #fecaca;
            background:#fef2f2;
            color:#b91c1c;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:13px;
            font-weight:700;
            color:#334155;
        }

        .input-wrap{
            position:relative;
        }

        .form-control{
            width:100%;
            height:48px;
            border:1px solid #cbd5e1;
            border-radius:14px;
            padding:0 14px;
            font-size:14px;
            color:#0f172a;
            background:#fff;
            outline:none;
            transition:.2s ease;
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.12);
        }

        .password-toggle{
            position:absolute;
            top:50%;
            right:12px;
            transform:translateY(-50%);
            border:none;
            background:none;
            cursor:pointer;
            font-size:12px;
            font-weight:700;
            color:#2563eb;
        }

        .login-btn{
            width:100%;
            height:50px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg, #2563eb, #1d4ed8);
            color:#fff;
            font-size:15px;
            font-weight:800;
            cursor:pointer;
            transition:.2s ease;
            box-shadow:0 14px 28px rgba(37,99,235,.22);
        }

        .login-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 18px 34px rgba(37,99,235,.28);
        }

        .login-btn:active{
            transform:translateY(0);
        }

        .helper-text{
            margin-top:16px;
            text-align:center;
            font-size:12px;
            color:#64748b;
            line-height:1.6;
        }

        .footer-note{
            margin-top:18px;
            text-align:center;
            font-size:12px;
            color:#94a3b8;
        }

        @media (max-width:480px){
            .login-header,
            .login-body{
                padding-left:20px;
                padding-right:20px;
            }

            .login-header h2{
                font-size:21px;
            }
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">C</div>
            <h2>Catalog Login</h2>
            <p>Masuk ke sistem manajemen catalog untuk mengakses dashboard dan fitur QR.</p>
        </div>

        <div class="login-body">
            <div th:if="${error != null}" class="alert">
                <span th:text="${error}">Username atau password salah.</span>
            </div>

            <form th:action="@{/middleware/catalog/login}" method="post">
                <div class="form-group">
                    <label for="usernameOrEmail">Username atau Email</label>
                    <div class="input-wrap">
                        <input
                                id="usernameOrEmail"
                                type="text"
                                name="usernameOrEmail"
                                class="form-control"
                                placeholder="Masukkan username atau email"
                                required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input
                                id="password"
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Masukkan password"
                                required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">Lihat</button>
                    </div>
                </div>

                <input type="hidden"
                       th:if="${_csrf} != null"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit" class="login-btn">Masuk</button>
            </form>

            <div class="helper-text">
                Gunakan akun yang sudah terdaftar dan aktif untuk login ke halaman catalog.
            </div>

            <div class="footer-note">
                © 2026 Management Catalog
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.password-toggle');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = 'Sembunyi';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = 'Lihat';
        }
    }
</script>
</body>
</html>
