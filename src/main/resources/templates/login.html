<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Sarinah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a56db;
            --primary-dark: #1344b0;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(26, 86, 219, 0.15), transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1), transparent 70%);
            bottom: -80px;
            left: -80px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.3);
        }

        .logo-section h1 {
            color: #f1f5f9;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .logo-section p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-floating > .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            padding: 16px 16px 8px 48px;
            height: 56px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-floating > .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.2);
            color: #f1f5f9;
        }

        .form-floating > .form-control::placeholder { color: transparent; }

        .form-floating > label {
            color: #94a3b8;
            padding-left: 48px;
            font-size: 14px;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #64748b;
            transform: scale(0.8) translateY(-0.6rem) translateX(0.2rem);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
        }

        .btn-login {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.4);
            background: linear-gradient(135deg, var(--primary-dark), #4f46e5);
            color: white;
        }

        .btn-login:active { transform: translateY(0); }

        .alert-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .alert-success-custom {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .ad-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: #64748b;
            margin-top: 24px;
        }

        .ad-badge i { color: #3b82f6; }

        .footer-text {
            text-align: center;
            color: #475569;
            font-size: 12px;
            margin-top: 24px;
        }

        /* Loading spinner */
        .spinner { display: none; }
        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1>Portal Sarinah</h1>
            <p>Masuk dengan akun Active Directory</p>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert-custom" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Logout Message -->
        <div th:if="${logoutMessage}" class="alert-custom alert-success-custom" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/portal/login}" method="post" id="loginForm">
            <div class="form-floating position-relative">
                <i class="bi bi-person input-icon"></i>
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Username"
                       autocomplete="username"
                       required
                       autofocus>
                <label for="username">Username AD</label>
            </div>

            <div class="form-floating position-relative">
                <i class="bi bi-lock input-icon"></i>
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="current-password"
                       required>
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn btn-login mt-3" id="btnLogin">
                <span class="btn-text">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
                </span>
                <span class="spinner">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Memproses...
                </span>
            </button>
        </form>

        <div class="text-center">
            <span class="ad-badge">
                <i class="bi bi-diagram-3"></i>
                Active Directory &bull; sarinah.net
            </span>
        </div>
    </div>

    <p class="footer-text">
        &copy; 2026 PT Sarinah (Persero). Sistem Informasi Terpadu.
    </p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function() {
        const btn = document.getElementById('btnLogin');
        btn.classList.add('loading');
        btn.disabled = true;
    });
</script>

</body>
</html>
