<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarinah</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Sora:wght@300;400;500;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;overflow:hidden;font-family:'Sora',sans-serif;
          background:linear-gradient(180deg,#bfe3ff 0%,#dff1ff 30%,#eaf7ff 100%);
          -webkit-tap-highlight-color:transparent;user-select:none;}
        canvas{display:block;}

        /* ---------- top bar ---------- */
        .topbar{position:fixed;top:0;left:0;right:0;z-index:10;
          display:flex;align-items:center;justify-content:space-between;
          padding:16px 18px;pointer-events:none;}
        .title{display:flex;align-items:center;gap:12px;pointer-events:auto;}
        .back{width:34px;height:34px;display:grid;place-items:center;color:#fff;
          font-size:22px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.25);}
        .title h1{font-family:'Baloo 2',cursive;font-weight:700;font-size:24px;color:#fff;
          text-shadow:0 2px 6px rgba(0,80,160,.35);}
        .top-actions{display:flex;gap:10px;pointer-events:auto;}
        .pill-btn{width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
          display:grid;place-items:center;font-size:20px;color:#fff;
          box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .2s;}
        .pill-btn:active{transform:scale(.92);}
        .pill-q{background:linear-gradient(135deg,#ffb938,#ff9500);}
        .pill-g{background:linear-gradient(135deg,#ffd24a,#ffae00);}

        /* ---------- banner ---------- */
        .banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9;
          background:linear-gradient(135deg,#5bb8ff,#3d9bff);color:#fff;text-align:center;
          padding:16px 26px;border-radius:22px;font-weight:600;font-size:15px;line-height:1.45;
          box-shadow:0 10px 26px rgba(40,120,220,.4),inset 0 1px 0 rgba(255,255,255,.4);
          border:2px solid rgba(255,255,255,.5);max-width:80vw;
          animation:floaty 3s ease-in-out infinite;}
        .banner b{font-family:'Baloo 2',cursive;font-weight:800;}
        @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}

        /* ---------- hint ---------- */
        .hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:9;
          background:rgba(255,255,255,.85);color:#3a4a60;padding:10px 20px;border-radius:999px;
          font-size:13px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.12);backdrop-filter:blur(6px);}

        /* ---------- interior overlay ---------- */
        #interior{position:fixed;inset:0;z-index:50;display:none;}
        #interior.show{display:block;}
        #interiorCanvas{display:block;}
        .interior-bar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;
          align-items:center;justify-content:space-between;padding:16px 18px;}
        .leave{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);
          border:none;border-radius:999px;padding:10px 18px;cursor:pointer;font-family:'Sora';
          font-weight:600;font-size:14px;color:#1a2436;box-shadow:0 6px 16px rgba(0,0,0,.18);}
        .interior-name{font-family:'Baloo 2',cursive;font-weight:800;font-size:22px;color:#fff;
          text-shadow:0 2px 8px rgba(0,0,0,.3);}
        .interior-card{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:2;
          background:#fff;border-radius:24px;padding:26px 30px;max-width:440px;width:88vw;
          box-shadow:0 30px 70px -24px rgba(20,40,80,.5);text-align:center;
          animation:cardup .5s cubic-bezier(.16,1,.3,1);}
        @keyframes cardup{from{opacity:0;transform:translateX(-50%) translateY(30px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
        .interior-card .badge{display:inline-block;font-size:12px;letter-spacing:2px;font-weight:600;
          padding:6px 14px;border-radius:999px;margin-bottom:12px;}
        .interior-card h2{font-family:'Baloo 2',cursive;font-weight:800;font-size:30px;margin-bottom:6px;}
        .interior-card p{color:#5a6478;font-size:14px;font-weight:300;line-height:1.6;}
        .istats{display:flex;gap:14px;margin-top:20px;}
        .istat{flex:1;background:#f4f7fc;border-radius:14px;padding:14px 8px;}
        .istat .v{font-family:'Baloo 2',cursive;font-weight:800;font-size:24px;}
        .istat .l{font-size:11px;color:#8a92a4;margin-top:2px;}

        /* loading marker tooltip */
        .toast{position:fixed;left:50%;bottom:80px;z-index:60;transform:translateX(-50%) translateY(120%);
          background:#1a2436;color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;
          box-shadow:0 18px 40px -16px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.16,1,.3,1);}
        .toast.show{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
<!-- peta kota -->
<canvas id="scene"></canvas>

<div class="topbar">
    <div class="title"><span class="back">‹</span><h1>Sarinah </h1></div>
    <div class="top-actions">
        <button class="pill-btn pill-q" onclick="ping('Bantuan — klik gedung untuk masuk')">?</button>
        <button class="pill-btn pill-g" onclick="ping('Hadiah kamu menanti!')">🎁</button>
    </div>
</div>

<div class="banner">Jelajahi <b>Sarinah</b> dan kunjungi<br>HC · IT · Sarinah Club</div>
<div class="hint">Seret untuk memutar · klik gedung / marker untuk masuk</div>

<!-- interior -->
<div id="interior">
    <canvas id="interiorCanvas"></canvas>
    <div class="interior-bar">
        <button class="leave" onclick="leaveInterior()">‹ Keluar</button>
        <span class="interior-name"></span>
        <span style="width:80px"></span>
    </div>
    <div class="interior-card">
        <span class="badge"></span>
        <h2></h2>
        <p></p>
        <div class="istats"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script th:inline="none">
    function ping(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
      clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200);}

    // ============================================================
    //  PETA KOTA ISOMETRIK
    // ============================================================
    const canvas=document.getElementById('scene');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0xdff1ff);

    // kamera isometrik (orthographic-ish via perspective jauh)
    const camera=new THREE.PerspectiveCamera(38,1,0.1,300);
    let camAngle=0.9, camDist=58, camHeight=44;
    function placeCam(){
      camera.position.set(Math.sin(camAngle)*camDist,camHeight,Math.cos(camAngle)*camDist);
      camera.lookAt(0,2,0);
    }

    // ---------- helper bentuk ----------
    const M=(c,r=0.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
    function box(w,h,d,mat,x,y,z,parent=scene){
      const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}

    // ---------- tanah dasar ----------
    const ground=new THREE.Mesh(new THREE.BoxGeometry(80,2,80),M(0x8fd17a,0.95));
    ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);

    // ---------- jalan (silang) ----------
    const roadMat=M(0xb8bcc4,0.9);
    box(16,0.2,80,roadMat,4,0.1,0);
    box(80,0.2,16,roadMat,0,0.1,8);
    // garis jalan kuning
    const lineMat=M(0xffd24a,0.6);
    for(let z=-36;z<=36;z+=6)box(0.5,0.05,3,lineMat,4,0.22,z);
    for(let x=-36;x<=36;x+=6)box(3,0.05,0.5,lineMat,x,0.22,8);
    // zebra cross
    for(let i=-3;i<=3;i++)box(1.1,0.06,7,M(0xffffff,0.6),-4+i*1.6,0.23,16);

    // ---------- rumput blok ----------
    function lawn(x,z,w,d){const l=new THREE.Mesh(new THREE.BoxGeometry(w,0.3,d),M(0x9bd97f,0.95));
      l.position.set(x,0.25,z);l.receiveShadow=true;scene.add(l);}
    lawn(-22,-22,28,28);lawn(22,22,26,26);

    // ---------- pohon ----------
    function tree(x,z,s=1){
      const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
      box(0.6,1.6,0.6,M(0x9c6b3f),0,0.8,0,g);
      const leaf=M(0x5fb04a,0.9);
      const a=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),leaf);a.position.y=2.6;a.castShadow=true;g.add(a);
      const b=new THREE.Mesh(new THREE.SphereGeometry(1.1,10,10),leaf);b.position.set(0.9,2.1,0.3);g.add(b);
      const c=new THREE.Mesh(new THREE.SphereGeometry(1.0,10,10),leaf);c.position.set(-0.8,2.0,-0.4);g.add(c);
      scene.add(g);
    }
    [[-30,-30],[-26,-34],[-34,-24],[-20,-32],[-32,-18],[-16,-26],[28,28],[33,24],[24,33],[18,30],[30,16],[14,26]]
      .forEach(p=>tree(p[0],p[1],0.8+Math.random()*0.5));

    // ---------- air mancur ----------
    (function(){
      const g=new THREE.Group();g.position.set(-22,0,-14);
      const pool=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.6,24),M(0xffffff,0.6));pool.position.y=0.3;g.add(pool);
      const water=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,0.4,24),M(0x6cc7ff,0.3,0.2));water.position.y=0.55;g.add(water);
      box(0.8,1.4,0.8,M(0xffffff,0.6),0,1.1,0,g);
      const top=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.3,16),M(0xffffff,0.6));top.position.y=1.9;g.add(top);
      scene.add(g);
    })();

    // ---------- bangku ----------
    function bench(x,z,r){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=r;
      box(2,0.2,0.7,M(0xd98c4a),0,0.5,0,g);box(2,0.6,0.15,M(0xd98c4a),0,0.8,-0.3,g);scene.add(g);}
    bench(-14,-8,0);bench(-26,-8,0);

    // ---------- toko-toko kecil (gaya referensi) ----------
    function shop(x,z,col,roof,w=6,d=6,h=4){
      const g=new THREE.Group();g.position.set(x,0,z);
      box(w,h,d,M(col,0.8),0,h/2,0,g);
      // atap
      const r=new THREE.Mesh(new THREE.ConeGeometry(w*0.8,2,4),M(roof,0.8));
      r.position.y=h+0.9;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);
      // pintu
      box(1.4,2,0.2,M(0x6ca8e0,0.5,0.3),0,1,d/2+0.05,g);
      scene.add(g);return g;
    }
    shop(-14,2,0xfff0d4,0xe06a5a,7,6,4);     // toko buah
    shop(-22,4,0xeaf2ff,0x4f6bff,6,6,5);     // mandiri-ish biru
    shop(16,18,0xfff4e8,0xe0a85a,6,6,4);     // bakery
    shop(24,12,0xffe9e0,0xd4232a,6,6,4);     // sudut merah

    // sepeda parkir (lingkaran)
    (function(){const g=new THREE.Group();g.position.set(-30,0,-2);
      const base=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,0.3,20),M(0xc8d2dc,0.8));base.position.y=0.15;g.add(base);
      for(let i=0;i<3;i++){const r=i*0.9-0.9;box(0.1,1.2,1.6,M(0xff5a5a),r,0.9,0,g);}
      scene.add(g);})();

    // ============================================================
    //  GEDUNG SARINAH (pusat, referensi)
    // ============================================================
    const sarinah=new THREE.Group();sarinah.position.set(14,0,-8);scene.add(sarinah);
    // podium lebar
    box(13,4,11,M(0xf2efe9,0.6),0,2,0,sarinah);
    // menara utama (ramping tinggi) - putih bersih khas Sarinah
    const tower=box(9,22,8,M(0xfbfaf7,0.5),0,15,0,sarinah);
    // pita kaca biru per lantai
    for(let i=0;i<10;i++)box(9.2,1.0,8.2,M(0x9fc3e8,0.3,0.4),0,6.5+i*2,0,sarinah);
    // garis vertikal emas (kolom)
    for(let x=-3.5;x<=3.5;x+=1.75)box(0.4,20,0.2,M(0xe8c860,0.5),x,15,4.1,sarinah);
    // mahkota atap biru tua (khas foto: atap biru menonjol)
    const crown=box(10,3,9,M(0x2c4a8a,0.5),0,27.5,0,sarinah);
    const crownTop=new THREE.Mesh(new THREE.BoxGeometry(7,2,6),M(0x35539a,0.5));
    crownTop.position.y=30;sarinah.add(crownTop);
    // logo mandiri/sarinah (panel)
    (function(){const c=document.createElement('canvas');c.width=256;c.height=128;
      const x=c.getContext('2d');x.fillStyle='#1a3a8a';x.font='bold 56px Baloo 2,sans-serif';x.textAlign='center';
      x.fillText('SARINAH',128,80);
      const t=new THREE.CanvasTexture(c);
      const p=new THREE.Mesh(new THREE.PlaneGeometry(6,3),new THREE.MeshBasicMaterial({map:t,transparent:true}));
      p.position.set(0,22,4.15);sarinah.add(p);})();
    // kanopi pintu masuk
    box(6,0.4,3,M(0x2c4a8a,0.5),0,4.2,6.5,sarinah);
    box(5,3.5,0.3,M(0x9fc3e8,0.3,0.4),0,2,7.9,sarinah);

    // ---------- orang-orang kecil ----------
    function person(x,z,col){
      const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=Math.random()*6;
      const body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.9,8),M(col,0.8));
      body.position.y=0.7;body.castShadow=true;g.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,10),M(0xf2c9a0,0.8));head.position.y=1.4;g.add(head);
      scene.add(g);return g;
    }
    const people=[];
    const pcols=[0xff6b6b,0x4f6bff,0xffd24a,0x5fb04a,0xff8a3d,0x9b59b6,0x3dc6c6];
    for(let i=0;i<14;i++){
      const onX=Math.random()<0.5;
      const px=onX?(Math.random()*60-30):4+(Math.random()*8-4);
      const pz=onX?8+(Math.random()*8-4):(Math.random()*60-30);
      const p=person(px,pz,pcols[i%pcols.length]);
      p._base=[px,pz];p._t=Math.random()*6;people.push(p);
    }

    // ============================================================
    //  MARKER MENGAMBANG (klik untuk masuk)
    // ============================================================
    const DIV=[
      {key:'HC',full:'HC',sub:'Human Capital',color:0x4f6bff,pos:[ -6,4,2],
       desc:'Rekrutmen, pengembangan talenta, dan kesejahteraan tim. Jantung dari organisasi.',
       stats:[['14','Anggota'],['6','Lowongan'],['98%','Retensi']]},
      {key:'IT',full:'IT',sub:'Technology',color:0x35539a,pos:[14,30,-8],
       desc:'Rekayasa, infrastruktur, keamanan, dan pengembangan produk digital perusahaan.',
       stats:[['8','Proyek'],['24','Layanan'],['99.9%','Uptime']]},
      {key:'SC',full:'Sarinah Club',sub:'Community',color:0xe06a5a,pos:[24,5,12],
       desc:'Komunitas, acara, dan program keanggotaan untuk seluruh warga Sarinah.',
       stats:[['3','Acara'],['320','Anggota'],['12','Mitra']]},
    ];
    const markers=[];
    DIV.forEach(d=>{
      const g=new THREE.Group();g.position.set(d.pos[0],d.pos[1],d.pos[2]);
      // lingkaran putih (seperti referensi)
      const disc=new THREE.Mesh(new THREE.CircleGeometry(2.2,40),
        new THREE.MeshBasicMaterial({color:0xffffff}));
      disc.userData.marker=d;g.add(disc);
      const ring=new THREE.Mesh(new THREE.RingGeometry(2.2,2.6,40),
        new THREE.MeshBasicMaterial({color:d.color,side:THREE.DoubleSide}));
      g.add(ring);
      // ikon (canvas): dokumen + pensil + huruf
      const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
      x.fillStyle='#'+d.color.toString(16).padStart(6,'0');
      x.font='bold 130px Baloo 2,sans-serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText(d.key,128,138);
      const tex=new THREE.CanvasTexture(c);
      const icon=new THREE.Mesh(new THREE.CircleGeometry(1.7,40),
        new THREE.MeshBasicMaterial({map:tex,transparent:true}));
      icon.position.z=0.01;icon.userData.marker=d;g.add(icon);
      // ekor segitiga
      const tail=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.2,3),
        new THREE.MeshBasicMaterial({color:0xffffff}));
      tail.position.y=-2.6;tail.rotation.z=Math.PI;g.add(tail);
      scene.add(g);
      g._data=d;g._baseY=d.pos[1];g._t=Math.random()*6;
      markers.push(g);
    });

    // ---------- pencahayaan cerah ----------
    scene.add(new THREE.HemisphereLight(0xffffff,0xbfe3c0,0.9));
    scene.add(new THREE.AmbientLight(0xffffff,0.4));
    const sun=new THREE.DirectionalLight(0xfff6e6,1.1);
    sun.position.set(-30,50,20);sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    const sc=sun.shadow.camera;sc.left=-50;sc.right=50;sc.top=50;sc.bottom=-50;sc.far=150;
    scene.add(sun);

    // ---------- interaksi peta: putar + klik ----------
    let dragging=false,lx,moved=0;
    canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;moved=0;});
    window.addEventListener('pointerup',e=>{dragging=false;if(moved<6)tryClick(e);});
    window.addEventListener('pointermove',e=>{if(dragging){camAngle-=(e.clientX-lx)*0.006;moved+=Math.abs(e.clientX-lx);lx=e.clientX;}});
    canvas.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(38,Math.min(80,camDist+e.deltaY*0.03));camHeight=camDist*0.76;},{passive:false});

    const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
    function tryClick(e){
      const ev=e.changedTouches?e.changedTouches[0]:e;
      mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;
      ray.setFromCamera(mouse,camera);
      // cek marker dulu
      const hitM=ray.intersectObjects(markers,true);
      if(hitM.length){let g=hitM[0].object;while(g&&!g._data)g=g.parent;if(g)return enterInterior(g._data);}
      // cek gedung sarinah
      const hitB=ray.intersectObject(sarinah,true);
      if(hitB.length)return enterInterior(DIV[1]); // gedung utama = IT/Sarinah
    }

    function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix();}
    addEventListener('resize',resize);resize();

    const clock=new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime();
      placeCam();
      // marker melayang + hadap kamera
      markers.forEach(m=>{m.position.y=m._baseY+Math.sin(t*1.8+m._t)*0.4;
        m.lookAt(camera.position.x,m.position.y,camera.position.z);});
      // orang berjalan
      people.forEach(p=>{p._t+=0.01;p.position.x=p._base[0]+Math.sin(p._t)*2;});
      renderer.render(scene,camera);
    }
    animate();

    // ============================================================
    //  INTERIOR (masuk gedung)
    // ============================================================
    const iEl=document.getElementById('interior');
    const iCanvas=document.getElementById('interiorCanvas');
    let iRenderer,iScene,iCam,iAnim,iYaw=0,iDrag=false,iLx;

    function enterInterior(d){
      iEl.classList.add('show');
      iEl.querySelector('.interior-name').textContent=d.full;
      const hex='#'+d.color.toString(16).padStart(6,'0');
      const card=iEl.querySelector('.interior-card');
      const badge=card.querySelector('.badge');
      badge.textContent=d.sub.toUpperCase();badge.style.background=hex+'1a';badge.style.color=hex;
      card.querySelector('h2').textContent=d.full;card.querySelector('h2').style.color=hex;
      card.querySelector('p').textContent=d.desc;
      card.querySelector('.istats').innerHTML=d.stats.map(s=>
        `<div class="istat"><div class="v" style="color:${hex}">${s[0]}</div><div class="l">${s[1]}</div></div>`).join('');
      buildInterior(d.color);
    }
    window.leaveInterior=()=>{iEl.classList.remove('show');cancelAnimationFrame(iAnim);};

    function buildInterior(color){
      if(!iRenderer){
        iRenderer=new THREE.WebGLRenderer({canvas:iCanvas,antialias:true});
        iRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
        iRenderer.shadowMap.enabled=true;
        iCanvas.addEventListener('pointerdown',e=>{iDrag=true;iLx=e.clientX;});
        window.addEventListener('pointerup',()=>iDrag=false);
        window.addEventListener('pointermove',e=>{if(iDrag){iYaw-=(e.clientX-iLx)*0.005;iLx=e.clientX;}});
        iCanvas.addEventListener('touchmove',e=>{const x=e.touches[0].clientX;
          if(iLx!=null)iYaw-=(x-iLx)*0.006;iLx=x;},{passive:true});
        iCanvas.addEventListener('touchend',()=>iLx=null);
      }
      iScene=new THREE.Scene();iScene.background=new THREE.Color(0xeef4fb);
      iCam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);

      const RM=(c,r=0.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
      // ruang
      const fl=new THREE.Mesh(new THREE.PlaneGeometry(30,30),RM(0xf0ece4,0.6));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;iScene.add(fl);
      const cl=new THREE.Mesh(new THREE.PlaneGeometry(30,30),RM(0xffffff,0.9));cl.rotation.x=Math.PI/2;cl.position.y=8;iScene.add(cl);
      function iwall(x,z,ry){const w=new THREE.Mesh(new THREE.PlaneGeometry(30,8),RM(0xf6f2ea,0.85));
        w.position.set(x,4,z);w.rotation.y=ry;w.receiveShadow=true;iScene.add(w);}
      iwall(0,-15,0);iwall(-15,0,Math.PI/2);iwall(15,0,-Math.PI/2);
      // dinding aksen warna divisi
      const accent=new THREE.Mesh(new THREE.PlaneGeometry(30,8),RM(color,0.6));
      accent.position.set(0,4,-14.9);iScene.add(accent);
      // jendela
      for(let x=-10;x<=10;x+=5){const win=new THREE.Mesh(new THREE.PlaneGeometry(3,4),
        new THREE.MeshBasicMaterial({color:0xcfe6ff}));win.position.set(x,4.5,-14.8);iScene.add(win);}

      // meja resepsionis besar
      const desk=new THREE.Mesh(new THREE.BoxGeometry(8,1.4,2),RM(0xffffff,0.5));desk.position.set(0,0.7,-6);desk.castShadow=true;iScene.add(desk);
      const deskTop=new THREE.Mesh(new THREE.BoxGeometry(8.4,0.2,2.4),RM(color,0.5));deskTop.position.set(0,1.5,-6);iScene.add(deskTop);
      // logo besar di dinding
      const c=document.createElement('canvas');c.width=512;c.height=256;const xx=c.getContext('2d');
      xx.fillStyle='#ffffff';xx.font='bold 120px Baloo 2,sans-serif';xx.textAlign='center';xx.textBaseline='middle';
      xx.fillText(iEl.querySelector('.interior-name').textContent,256,128);
      const tex=new THREE.CanvasTexture(c);
      const sign=new THREE.Mesh(new THREE.PlaneGeometry(10,5),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
      sign.position.set(0,5,-14.7);iScene.add(sign);
      // sofa & meja tamu
      function sofa(x,z){const s=new THREE.Mesh(new THREE.BoxGeometry(3,1,1.4),RM(0xd9deea,0.8));s.position.set(x,0.5,z);s.castShadow=true;iScene.add(s);
        const b=new THREE.Mesh(new THREE.BoxGeometry(3,1,0.4),RM(0xd9deea,0.8));b.position.set(x,1,z-0.5);iScene.add(b);}
      sofa(-7,4);sofa(7,4);
      const ctable=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.6,20),RM(0xe8ddc8,0.7));ctable.position.set(0,0.3,5);iScene.add(ctable);
      // tanaman
      [-12,12].forEach(x=>{const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.5,1,16),RM(0xcbb89a));pot.position.set(x,0.5,-12);iScene.add(pot);
        const pl=new THREE.Mesh(new THREE.SphereGeometry(1,12,12),RM(0x6aa84f,0.9));pl.position.set(x,1.6,-12);iScene.add(pl);});

      iScene.add(new THREE.HemisphereLight(0xffffff,0xdfe6ee,1.0));
      const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(5,15,8);dl.castShadow=true;iScene.add(dl);
      const pl=new THREE.PointLight(color,0.6,30);pl.position.set(0,6,0);iScene.add(pl);

      function loop(){iAnim=requestAnimationFrame(loop);
        iCam.position.set(Math.sin(iYaw)*9,3,Math.cos(iYaw)*9+2);
        iCam.lookAt(0,3,-6);
        iRenderer.setSize(innerWidth,innerHeight,false);
        iCam.aspect=innerWidth/innerHeight;iCam.updateProjectionMatrix();
        iRenderer.render(iScene,iCam);}
      loop();
    }
</script>
</body>
</html>
