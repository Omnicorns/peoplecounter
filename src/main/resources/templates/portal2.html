<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sarinah</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        /* ============================================================
           LOADING OVERLAY
           Tampil sampai gambar template selesai dimuat.
           ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: #0b1220;
            background: linear-gradient(135deg, #0b1220, #111827);
            transition: opacity .45s ease, visibility .45s ease;
        }

        .loading-overlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            position: relative;
            width: 72px;
            height: 72px;
        }

        .loader-ring .ring {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(255, 255, 255, 0.12);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .loader-ring .ring.inner {
            inset: 12px;
            border-width: 3px;
            border-top-color: transparent;
            border-bottom-color: #818cf8;
            animation: spin 1.3s linear infinite reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #cbd5e1;
            font-size: 14px;
            letter-spacing: .4px;
            font-weight: 600;
        }

        .loading-dots::after {
            content: "";
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader-ring .ring,
            .loading-dots::after { animation: none; }
        }

        /*
           PAGE FULL SCREEN
        */
        .village-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        .village-page::before {
            content: "";
            position: absolute;
            inset: -40px;
            z-index: 0;
            background-image: url('/template.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: blur(26px);
            transform: scale(1.08);
            opacity: 0.9;
        }

        .village-page::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: rgba(0, 0, 0, 0.16);
            pointer-events: none;
        }

        @media (orientation: portrait) {
            .village-page::before {
                background-image: url('/template1.png');
                background-position: center center;
            }
        }

        .village-image-wrap {
            position: relative;
            z-index: 1;
            display: inline-block;
            line-height: 0;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
        }

        .village-img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .img-portrait {
            display: none;
        }

        .img-landscape {
            display: block;
        }

        @media (orientation: portrait) {
            .img-landscape {
                display: none;
            }

            .img-portrait {
                display: block;
            }
        }

        .hotspot {
            position: absolute;
            z-index: 10;
            border: none;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            padding: 0;
            outline: none;
        }

        .hotspot:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        /* ===== posisi hotspot: LANDSCAPE / template.png ===== */
        .village-image-wrap.landscape .hotspot-hc {
            left: 25%;
            top: 53%;
            width: 9%;
            height: 16%;
        }

        .village-image-wrap.landscape .hotspot-marketing {
            left: 40%;
            top: 67%;
            width: 9%;
            height: 16%;
        }

        .village-image-wrap.landscape .hotspot-it {
            left: 75%;
            top: 52%;
            width: 9%;
            height: 16%;
        }

        /* ===== posisi hotspot: PORTRAIT / template1.png ===== */
        .village-image-wrap.portrait .hotspot-hc {
            left: 13%;
            top: 51%;
            width: 22%;
            height: 14%;
        }

        .village-image-wrap.portrait .hotspot-it {
            left: 84%;
            top: 53%;
            width: 22%;
            height: 14%;
        }

        .village-image-wrap.portrait .hotspot-marketing {
            left: 53%;
            top: 78%;
            width: 28%;
            height: 15%;
        }

        .debug-box {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 99;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            font-size: 12px;
            line-height: 1.45;
            display: none;
        }

        .debug-on .debug-box {
            display: block;
        }

        .debug-on .hotspot {
            outline: 2px dashed rgba(255,255,255,.9);
            background: rgba(255,255,255,.12);
        }
    </style>
</head>

<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loader-ring">
        <div class="ring"></div>
        <div class="ring inner"></div>
    </div>
    <div class="loading-text">Memuat<span class="loading-dots"></span></div>
</div>

<div id="villagePage" class="village-page">

    <div id="imageWrap" class="village-image-wrap landscape">

        <!-- LANDSCAPE -->
        <img
                class="village-img img-landscape"
                th:src="@{/template.png}"
                src="/template.png"
                alt="Sarinah Village Landscape">

        <!-- PORTRAIT -->
        <img
                class="village-img img-portrait"
                th:src="@{/template1.png}"
                src="/template1.png"
                alt="Sarinah Village Portrait">

        <button type="button"
                class="hotspot hotspot-hc"
                onclick="pindahBooth('hc')"
                onmousemove="debugPosisi(event, 'HC')"
                aria-label="Masuk Booth HC"></button>

        <button type="button"
                class="hotspot hotspot-marketing"
                onclick="pindahBooth('marketing')"
                onmousemove="debugPosisi(event, 'Marketing')"
                aria-label="Masuk Booth Marketing"></button>

        <button type="button"
                class="hotspot hotspot-it"
                onclick="pindahBooth('it')"
                onmousemove="debugPosisi(event, 'IT')"
                aria-label="Masuk Booth IT"></button>

    </div>

    <div id="debugBox" class="debug-box"></div>

</div>

<script th:inline="javascript">
    const DEBUG_MODE = false;

    const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";

    const imageWrap = document.getElementById("imageWrap");
    const loadingOverlay = document.getElementById("loadingOverlay");

    if (DEBUG_MODE) {
        document.body.classList.add("debug-on");
    }

    function syncOrientation() {
        const isPortrait = window.innerHeight > window.innerWidth;
        imageWrap.classList.toggle("portrait", isPortrait);
        imageWrap.classList.toggle("landscape", !isPortrait);
    }

    function pindahBooth(kodeBooth) {
        window.location.href = boothBaseUrl + kodeBooth;
    }

    function debugPosisi(event, namaBooth) {
        if (!DEBUG_MODE) return;

        const debugBox = document.getElementById("debugBox");
        const rect = imageWrap.getBoundingClientRect();

        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;

        debugBox.innerHTML =
            "Booth: <b>" + namaBooth + "</b><br>" +
            "Mode: <b>" + getMode() + "</b><br>" +
            "x: <b>" + x.toFixed(1) + "%</b> | " +
            "y: <b>" + y.toFixed(1) + "%</b>";
    }

    function getMode() {
        return window.innerHeight > window.innerWidth
            ? "portrait / template1.png"
            : "landscape / template.png";
    }

    /* ============================================================
       LOADING: sembunyikan overlay setelah gambar aktif selesai load.
       - Hanya menunggu gambar yang relevan dengan orientasi sekarang
         (landscape -> template.png, portrait -> template1.png).
       - Ada fallback timeout supaya overlay tidak nyangkut selamanya
         kalau gambar gagal load.
       ============================================================ */
    function hideLoading() {
        loadingOverlay.classList.add("hide");
    }

    function waitForActiveImage() {
        const isPortrait = window.innerHeight > window.innerWidth;
        // pilih gambar yang sedang ditampilkan sesuai orientasi
        const activeImg = document.querySelector(
            isPortrait ? ".img-portrait" : ".img-landscape"
        );

        if (!activeImg) { hideLoading(); return; }

        // sudah ke-cache / sudah selesai load
        if (activeImg.complete && activeImg.naturalWidth > 0) {
            hideLoading();
            return;
        }

        // tunggu event load / error
        activeImg.addEventListener("load", hideLoading, { once: true });
        activeImg.addEventListener("error", hideLoading, { once: true }); // tetap lanjut walau gagal
    }

    syncOrientation();
    waitForActiveImage();

    // Fallback: paksa hilang setelah 6 detik apa pun yang terjadi
    setTimeout(hideLoading, 6000);

    // Juga hilangkan saat seluruh halaman selesai (jaga-jaga)
    window.addEventListener("load", hideLoading);

    window.addEventListener("resize", syncOrientation);
    window.addEventListener("orientationchange", syncOrientation);
</script>

</body>
</html>
