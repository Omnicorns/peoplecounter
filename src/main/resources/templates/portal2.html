<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sarinah</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        /*
           PAGE FULL SCREEN
           Background biru diganti jadi gambar utama yang dibuat blur.
           Gambar utama tetap tampil contain supaya tidak kepotong.
        */
        .village-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        /*
           BACKGROUND BLUR LANDSCAPE
           Ini mengisi area kosong di belakang gambar utama.
        */
        .village-page::before {
            content: "";
            position: absolute;
            inset: -40px;
            z-index: 0;
            background-image: url('/template.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: blur(26px);
            transform: scale(1.08);
            opacity: 0.9;
        }

        /*
           Overlay tipis supaya background blur tidak terlalu ramai.
        */
        .village-page::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: rgba(0, 0, 0, 0.16);
            pointer-events: none;
        }

        /*
           PORTRAIT pakai template1.png sebagai background blur.
        */
        @media (orientation: portrait) {
            .village-page::before {
                background-image: url('/template1.png');
                background-position: center center;
            }
        }

        /*
           WRAPPER INI UKURANNYA IKUT GAMBAR.
           Jadi hotspot dihitung dari gambar, bukan dari layar.
        */
        .village-image-wrap {
            position: relative;
            z-index: 1;
            display: inline-block;
            line-height: 0;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
        }

        /*
           KUNCI SUPAYA GAMBAR AUTO RESIZE DAN TIDAK KEPOTONG
        */
        .village-img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .img-portrait {
            display: none;
        }

        .img-landscape {
            display: block;
        }

        @media (orientation: portrait) {
            .img-landscape {
                display: none;
            }

            .img-portrait {
                display: block;
            }
        }

        /*
           Hotspot transparan.
           Posisi relatif ke gambar asli.
        */
        .hotspot {
            position: absolute;
            z-index: 10;
            border: none;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            padding: 0;
            outline: none;
        }

        .hotspot:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        /* ===== posisi hotspot: LANDSCAPE / template.png ===== */
        .village-image-wrap.landscape .hotspot-hc {
            left: 25%;
            top: 53%;
            width: 9%;
            height: 16%;
        }

        .village-image-wrap.landscape .hotspot-marketing {
            left: 40%;
            top: 67%;
            width: 9%;
            height: 16%;
        }

        .village-image-wrap.landscape .hotspot-it {
            left: 75%;
            top: 52%;
            width: 9%;
            height: 16%;
        }

        /* ===== posisi hotspot: PORTRAIT / template1.png ===== */
        .village-image-wrap.portrait .hotspot-hc {
            left: 13%;
            top: 51%;
            width: 22%;
            height: 14%;
        }

        .village-image-wrap.portrait .hotspot-it {
            left: 84%;
            top: 53%;
            width: 22%;
            height: 14%;
        }

        .village-image-wrap.portrait .hotspot-marketing {
            left: 53%;
            top: 78%;
            width: 28%;
            height: 15%;
        }

        .debug-box {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 99;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            font-size: 12px;
            line-height: 1.45;
            display: none;
        }

        .debug-on .debug-box {
            display: block;
        }

        .debug-on .hotspot {
            outline: 2px dashed rgba(255,255,255,.9);
            background: rgba(255,255,255,.12);
        }
    </style>
</head>

<body>

<div id="villagePage" class="village-page">

    <div id="imageWrap" class="village-image-wrap landscape">

        <!-- LANDSCAPE -->
        <img
                class="village-img img-landscape"
                th:src="@{/template.png}"
                src="/template.png"
                alt="Sarinah Village Landscape">

        <!-- PORTRAIT -->
        <img
                class="village-img img-portrait"
                th:src="@{/template1.png}"
                src="/template1.png"
                alt="Sarinah Village Portrait">

        <button type="button"
                class="hotspot hotspot-hc"
                onclick="pindahBooth('hc')"
                onmousemove="debugPosisi(event, 'HC')"
                aria-label="Masuk Booth HC"></button>

        <button type="button"
                class="hotspot hotspot-marketing"
                onclick="pindahBooth('marketing')"
                onmousemove="debugPosisi(event, 'Marketing')"
                aria-label="Masuk Booth Marketing"></button>

        <button type="button"
                class="hotspot hotspot-it"
                onclick="pindahBooth('it')"
                onmousemove="debugPosisi(event, 'IT')"
                aria-label="Masuk Booth IT"></button>

    </div>

    <div id="debugBox" class="debug-box"></div>

</div>

<script th:inline="javascript">
    /*
       Ubah jadi true untuk cek posisi hotspot.
       Kalau sudah pas, balikkan ke false.
    */
    const DEBUG_MODE = false;

    /*
       URL booth:
       /booth/hc
       /booth/marketing
       /booth/it
    */
    const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";

    const imageWrap = document.getElementById("imageWrap");

    if (DEBUG_MODE) {
        document.body.classList.add("debug-on");
    }

    function syncOrientation() {
        const isPortrait = window.innerHeight > window.innerWidth;

        imageWrap.classList.toggle("portrait", isPortrait);
        imageWrap.classList.toggle("landscape", !isPortrait);
    }

    function pindahBooth(kodeBooth) {
        window.location.href = boothBaseUrl + kodeBooth;
    }

    function debugPosisi(event, namaBooth) {
        if (!DEBUG_MODE) return;

        const debugBox = document.getElementById("debugBox");
        const rect = imageWrap.getBoundingClientRect();

        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;

        debugBox.innerHTML =
            "Booth: <b>" + namaBooth + "</b><br>" +
            "Mode: <b>" + getMode() + "</b><br>" +
            "x: <b>" + x.toFixed(1) + "%</b> | " +
            "y: <b>" + y.toFixed(1) + "%</b>";
    }

    function getMode() {
        return window.innerHeight > window.innerWidth
            ? "portrait / template1.png"
            : "landscape / template.png";
    }

    syncOrientation();

    window.addEventListener("resize", syncOrientation);
    window.addEventListener("orientationchange", syncOrientation);
</script>

</body>
</html>
