<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sarinah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1117;
    }

    :root {
      --app-height: 100dvh;
      --marker-size: clamp(68px, 6.8vw, 104px);
      --template-image: url("/template.png");
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #0b1220, #111827);
      transition: opacity .45s ease, visibility .45s ease;
    }

    .loading-overlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .loader-ring .ring {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    .loader-ring .ring.inner {
      inset: 12px;
      border-width: 3px;
      border-top-color: transparent;
      border-bottom-color: #818cf8;
      animation: spin 1.3s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
    }

    .loading-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    .village-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .village-page::before {
      content: "";
      position: absolute;
      inset: -36px;
      z-index: 0;
      background-image: var(--template-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(22px);
      transform: scale(1.08);
      opacity: .88;
    }

    .village-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: rgba(0,0,0,.08);
      pointer-events: none;
    }

    .village-image-wrap {
      position: relative;
      z-index: 1;
      display: inline-block;
      line-height: 0;
      max-width: 100vw;
      max-height: var(--app-height);
      isolation: isolate;
    }

    .village-img {
      display: block;
      max-width: 100vw;
      max-height: var(--app-height);
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* BACKGROUND MUSIC */
    .sv-music-toggle {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 9998;
      min-height: 38px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 23, 42, .50);
      box-shadow: 0 14px 34px rgba(0,0,0,.24);
      backdrop-filter: blur(12px) saturate(145%);
      -webkit-backdrop-filter: blur(12px) saturate(145%);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
    }

    .sv-music-toggle:hover {
      background: rgba(15, 23, 42, .68);
    }

    .sv-music-toggle.need-click {
      background: rgba(239, 68, 68, .78);
      animation: musicPulse 1.2s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    /* MINI LEADERBOARD */
    .sv-mini-lb {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 40;
      width: min(260px, calc(100% - 88px));
      padding: 9px 11px 10px;
      border-radius: 10px;
      color: #fff;
      background: rgba(24, 126, 218, .58);
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      backdrop-filter: blur(8px) saturate(145%);
      -webkit-backdrop-filter: blur(8px) saturate(145%);
      pointer-events: auto;
      line-height: normal;
    }

    .sv-mini-lb-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .sv-mini-lb-title {
      margin: 0;
      text-align: center;
      font-size: 14px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: .15px;
      text-shadow: 0 1px 2px rgba(0,0,0,.28);
    }

    .sv-mini-lb-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 46px;
      padding: 4px 7px;
      border-radius: 999px;
      color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.14);
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .sv-mini-lb-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,.16);
    }

    .sv-mini-lb-list {
      display: grid;
      gap: 2px;
    }

    .sv-mini-lb-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      color: rgba(255,255,255,.98);
      font-size: 10px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: .1px;
    }

    .sv-mini-lb-rank {
      text-align: center;
      font-weight: 950;
      opacity: .95;
    }

    .sv-mini-lb-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 1px rgba(0,0,0,.18);
    }

    .sv-mini-lb-score {
      font-size: 9px;
      font-weight: 950;
      color: #facc15;
      white-space: nowrap;
    }

    /* QUIZ BUTTON */
    .sv-gift-quiz-float {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 40;
      min-width: 54px;
      min-height: 54px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 7px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: rgba(239, 68, 68, .75);
      border: 1px solid rgba(255,255,255,.30);
      box-shadow: 0 14px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.24);
      backdrop-filter: blur(11px) saturate(145%);
      -webkit-backdrop-filter: blur(11px) saturate(145%);
      transition: transform .16s ease, filter .16s ease, background .16s ease;
      pointer-events: auto;
      line-height: normal;
    }

    .sv-gift-quiz-float:hover {
      transform: translateY(-2px) scale(1.04);
      filter: brightness(1.06);
      background: rgba(220, 38, 38, .84);
    }

    .sv-gift-quiz-float:active {
      transform: scale(.96);
    }

    .sv-gift-quiz-float svg {
      width: 26px;
      height: 26px;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.26));
    }

    .sv-gift-quiz-label {
      display: block;
      color: #fff;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .15px;
      text-shadow: 0 1px 1px rgba(0,0,0,.22);
      white-space: nowrap;
    }

    /* QR MODAL QUIZ */
    .sv-modal-open {
      overflow: hidden;
    }

    .sv-qr-modal[hidden] {
      display: none;
    }

    .sv-qr-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 18px;
      line-height: normal;
    }

    .sv-qr-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, .62);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      opacity: 0;
      transition: opacity .18s ease;
    }

    .sv-qr-card {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100vw - 28px));
      padding: 18px 18px 20px;
      border-radius: 26px;
      color: #111827;
      background:
        radial-gradient(circle at 20% 0%, rgba(239,68,68,.12), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.92));
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 30px 80px rgba(0,0,0,.36);
      transform: translateY(14px) scale(.94);
      opacity: 0;
      transition: transform .22s cubic-bezier(.16, 1, .3, 1), opacity .18s ease;
    }

    .sv-qr-modal.show .sv-qr-backdrop {
      opacity: 1;
    }

    .sv-qr-modal.show .sv-qr-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .sv-qr-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      color: #334155;
      background: rgba(15,23,42,.08);
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      transition: transform .16s ease, background .16s ease;
    }

    .sv-qr-close:hover {
      transform: scale(1.06);
      background: rgba(15,23,42,.13);
    }

    .sv-qr-title {
      margin: 4px 42px 4px;
      color: #991b1b;
      text-align: center;
      font-size: clamp(20px, 4.8vw, 26px);
      line-height: 1.1;
      font-weight: 950;
      letter-spacing: -.4px;
    }

    .sv-qr-subtitle {
      margin: 0 auto 14px;
      max-width: 320px;
      color: #475569;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 750;
    }

    .sv-qr-box {
      position: relative;
      width: min(326px, 78vw);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 12px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid rgba(148,163,184,.28);
      box-shadow:
        inset 0 0 0 7px rgba(248,250,252,.86),
        0 18px 42px rgba(15,23,42,.14);
    }

    .sv-qr-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sv-qr-logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(62px, 17vw, 84px);
      height: clamp(62px, 17vw, 84px);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      padding: 8px;
      border-radius: 22px;
      color: #c1121f;
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(226,232,240,.95);
      box-shadow: 0 8px 22px rgba(15,23,42,.18);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }

    .sv-qr-logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .sv-qr-note {
      margin: 11px 0 0;
      color: #64748b;
      text-align: center;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 750;
      word-break: break-word;
    }

    /* MARKER */
    .booth-marker {
      --pin-color: #8b3dff;
      --delay: 0s;
      --marker-local-size: var(--marker-size);
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 25;
      width: calc(var(--marker-local-size) * 1.16);
      height: calc(var(--marker-local-size) * 1.48);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      line-height: 1;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.30));
      animation: markerFloat 3.2s ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: margin-top, transform;
    }

    .booth-marker::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 20px;
      height: 7px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,.26);
      filter: blur(5px);
      opacity: .65;
      pointer-events: none;
    }

    .booth-marker:hover {
      animation-play-state: paused;
      transform: translate(-50%, -103%) scale(1.035);
    }

    .booth-marker:active {
      transform: translate(-50%, -100%) scale(.985);
    }

    .pin-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .pin-main-solid {
      fill: var(--pin-color);
    }

    .pin-glass {
      fill: rgba(255,255,255,.13);
      pointer-events: none;
    }

    .pin-rim {
      fill: none;
      stroke: rgba(255,255,255,.22);
      stroke-width: 1.4;
      pointer-events: none;
    }

    .pin-shine {
      fill: rgba(255,255,255,.38);
      filter: blur(.2px);
      pointer-events: none;
    }

    .pin-content {
      position: absolute;
      left: 50%;
      top: 41%;
      z-index: 2;
      width: 78%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, .48vw, 8px);
      color: #fff;
      text-align: center;
      pointer-events: none;
    }

    .pin-icon {
      width: clamp(24px, 2.45vw, 36px);
      height: clamp(24px, 2.45vw, 36px);
      display: block;
      color: #fff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.24));
    }

    .pin-title {
      max-width: 100%;
      color: #fff;
      font-weight: 900;
      font-size: clamp(13px, 1.08vw, 18px);
      letter-spacing: .15px;
      white-space: nowrap;
      text-shadow: 0 2px 9px rgba(0,0,0,.30);
    }

    .pin-dot {
      position: absolute;
      left: 50%;
      bottom: -2px;
      z-index: 4;
      width: 12px;
      height: 12px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #fff;
      box-shadow:
        0 0 0 5px rgba(255,255,255,.32),
        0 0 18px rgba(255,255,255,.95),
        0 8px 12px rgba(0,0,0,.18);
      animation: dotPulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    .pin-dot::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: inherit;
      border: 2px solid rgba(255,255,255,.30);
      animation: ripple 1.8s ease-out infinite;
    }

    .marker-hc {
      --pin-color: #7c3aed;
      --delay: 0s;
      --x: 23.2%;
      --y: 59.5%;
    }

    .marker-marketing {
      --pin-color: #f97316;
      --delay: .35s;
      --marker-local-size: clamp(72px, 7.25vw, 112px);
      --x: 38.6%;
      --y: 71.0%;
    }

    .marker-marketing .pin-title {
      font-size: clamp(11px, .92vw, 15px);
    }

    .marker-it {
      --pin-color: #0ea5e9;
      --delay: .7s;
      --x: 76.8%;
      --y: 59.5%;
    }

    @keyframes markerFloat {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -10px; }
    }

    @keyframes dotPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.18); opacity: .9; }
    }

    @keyframes ripple {
      0% { transform: scale(.72); opacity: .58; }
      100% { transform: scale(1.22); opacity: 0; }
    }

    /* PORTRAIT MODE */
    .village-page.landscape-mode {
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .village-page.portrait-mode {
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
    }

    .village-page.portrait-mode::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .village-page.portrait-mode {
      scrollbar-width: none;
    }

    .village-page.portrait-mode .village-image-wrap {
      height: var(--app-height);
      max-height: var(--app-height);
      max-width: none;
      flex: 0 0 auto;
      scroll-snap-align: center;
    }

    .village-page.portrait-mode .village-img {
      height: var(--app-height);
      width: auto;
      max-height: var(--app-height);
      max-width: none;
    }

    .orientation-badge {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      z-index: 50;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: rgba(255,255,255,.94);
      background: rgba(10, 18, 31, .46);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      pointer-events: none;
    }

    .orientation-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,.88);
    }

    .booth-quicknav {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 55;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(10, 18, 31, .50);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 16px 38px rgba(0,0,0,.26);
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
    }

    .booth-quicknav button {
      border: 0;
      min-width: 42px;
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        0 6px 18px rgba(0,0,0,.20);
    }

    .booth-quicknav button:nth-child(1) {
      background: linear-gradient(180deg, #a855f7, #7c3aed);
    }

    .booth-quicknav button:nth-child(2) {
      background: linear-gradient(180deg, #fb923c, #ea580c);
    }

    .booth-quicknav button:nth-child(3) {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
    }

    body.portrait-on .orientation-badge,
    body.portrait-on .booth-quicknav {
      display: flex;
    }

    body.landscape-on .booth-quicknav {
      display: none;
    }

    @media (max-width: 760px) {
      :root {
        --marker-size: clamp(58px, 12vw, 78px);
      }

      .sv-mini-lb {
        top: 8px;
        left: 8px;
        width: min(230px, calc(100% - 74px));
        padding: 7px 9px 8px;
      }

      .sv-mini-lb-title {
        font-size: 13px;
      }

      .sv-mini-lb-row {
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 6px;
        min-height: 18px;
        font-size: 9px;
      }

      .sv-gift-quiz-float {
        top: 8px;
        right: 8px;
        min-width: 46px;
        min-height: 46px;
        padding: 5px 6px;
      }

      .sv-gift-quiz-float svg {
        width: 22px;
        height: 22px;
      }

      .sv-gift-quiz-label {
        font-size: 8px;
      }

      .sv-music-toggle {
        right: 8px;
        bottom: calc(70px + env(safe-area-inset-bottom, 0px));
        min-height: 34px;
        padding: 0 11px;
        font-size: 11px;
      }

      .pin-dot {
        width: 10px;
        height: 10px;
      }
    }

    @media (orientation: portrait) {
      :root {
        --marker-size: clamp(62px, 9.8vh, 86px);
      }

      .marker-marketing {
        --marker-local-size: clamp(68px, 10.2vh, 94px);
      }

      .pin-title {
        font-size: clamp(12px, 2.25vh, 16px);
      }

      .marker-marketing .pin-title {
        font-size: clamp(10px, 1.92vh, 14px);
      }

      .pin-icon {
        width: clamp(23px, 3.9vh, 32px);
        height: clamp(23px, 3.9vh, 32px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring .ring,
      .loading-dots::after,
      .booth-marker,
      .pin-dot,
      .pin-dot::after,
      .sv-music-toggle.need-click {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

<audio id="svBgMusic"
       preload="auto"
       autoplay
       loop
       playsinline>
  <source th:src="@{/haverst.mpeg}" src="/haverst.mpeg" type="audio/mpeg">
  <source th:src="@{/haverst.mpeg}" src="/haverst.mpeg" type="audio/mpeg">
</audio>

<button type="button"
        id="svMusicToggle"
        class="sv-music-toggle"
        aria-label="Toggle musik">
  🔊 Musik
</button>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loader-ring">
    <div class="ring"></div>

</div>

<div id="villagePage" class="village-page">
  <div id="imageWrap" class="village-image-wrap">

    <section class="sv-mini-lb" aria-label="Leaderboard quiz">
      <div class="sv-mini-lb-head">
        <h2 class="sv-mini-lb-title">Leaderboard</h2>
        <span id="svMiniLbStatusText" class="sv-mini-lb-status">
          <span class="sv-mini-lb-dot"></span>Load
        </span>
      </div>

      <div id="svMiniLeaderboardList" class="sv-mini-lb-list">

          <span class="sv-mini-lb-rank">-</span>
          <span class="sv-mini-lb-name">Memuat data...</span>
          <span class="sv-mini-lb-score"></span>
        </div>
      </div>
    </section>

    <button type="button"
            id="svGiftQuizButton"
            class="sv-gift-quiz-float"
            aria-label="Tampilkan QR Quiz"

      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#ffd166" d="M10 28h44v27a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5V28Z"/>
        <path fill="#f59e0b" d="M8 20a5 5 0 0 1 5-5h38a5 5 0 0 1 5 5v9H8v-9Z"/>
        <path fill="#ef4444" d="M28 15h8v45h-8z"/>
        <path fill="#dc2626" d="M8 27h48v7H8z" opacity=".92"/>
        <path fill="#fff" d="M23.4 15.4c-5.4-.8-9.3-3.3-9.3-7.1 0-3 2.4-5.4 5.8-5.4 5.7 0 9.1 7.1 10.3 11.7-1.8.5-4.1 1.1-6.8.8Zm-3.5-8.2c-1 0-1.8.5-1.8 1.3 0 1.5 2.3 2.6 6.5 3.1-1.2-2.4-2.8-4.4-4.7-4.4Zm20.7 8.2c-2.7.3-5-.3-6.8-.8C35 10 38.4 2.9 44.1 2.9c3.4 0 5.8 2.4 5.8 5.4 0 3.8-3.9 6.3-9.3 7.1Zm-1.2-3.8c4.2-.5 6.5-1.6 6.5-3.1 0-.8-.8-1.3-1.8-1.3-1.9 0-3.5 2-4.7 4.4Z" opacity=".96"/>
      </svg>

    <img id="villageImg" class="village-img" th:src="@{/template.png}" src="/template.png" alt="Sarinah Village">

    <button type="button" class="booth-marker marker-hc"

        <path class="pin-glass"
              d="M25 43 C32 20 54 13 74 18 C87 21 96 30 101 41 C90 32 75 27 59 27 C45 27 33 33 25 43 Z"/>
        <circle class="pin-rim" cx="60" cy="57" r="39"/>
        <ellipse class="pin-shine" cx="43" cy="31" rx="13" ry="7" transform="rotate(-25 43 31)"/>
      </svg>
      <span class="pin-content">
        <svg class="pin-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="20" cy="23" r="8" fill="currentColor"/>
          <circle cx="44" cy="23" r="8" fill="currentColor"/>
          <circle cx="32" cy="17" r="9" fill="currentColor"/>
          <path d="M8 51c0-8.2 6.6-14.2 15-14.2S38 42.8 38 51" fill="currentColor" opacity=".88"/>
          <path d="M26 52c0-9.4 7.8-16.2 18-16.2S62 42.6 62 52" fill="currentColor" opacity=".72"/>
          <path d="M16 53c0-10 7-17.8 16-17.8S48 43 48 53" fill="currentColor"/>
        </svg>
        <span class="pin-title">HC</span>
      </span>
      <span class="pin-dot"></span>
    </button>

    <button type="button" class="booth-marker marker-marketing"
            onclick="pindahBooth('marketing')"
            aria-label="Masuk Booth Marketing">
      <svg class="pin-svg" viewBox="0 0 120 154" aria-hidden="true">
        <path class="pin-main-solid"
              d="M60 150 C55 140 49 132 39 121 C20 101 10 79 10 56 C10 25 33 6 60 6 C87 6 110 25 110 56 C110 79 100 101 81 121 C71 132 65 140 60 150 Z"/>
        <path class="pin-glass"
              d="M25 43 C32 20 54 13 74 18 C87 21 96 30 101 41 C90 32 75 27 59 27 C45 27 33 33 25 43 Z"/>
        <circle class="pin-rim" cx="60" cy="57" r="39"/>
        <ellipse class="pin-shine" cx="43" cy="31" rx="13" ry="7" transform="rotate(-25 43 31)"/>
      </svg>
      <span class="pin-content">
        <svg class="pin-icon" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M10 29.5c0-2.5 2-4.5 4.5-4.5H23l18.5-10.4c3-1.7 6.7.5 6.7 4v26.8c0 3.5-3.7 5.7-6.7 4L23 39H14.5c-2.5 0-4.5-2-4.5-4.5v-5z"/>
          <path fill="currentColor" d="M23.5 39.5l4.2 12.3c.7 2.2-.9 4.2-3.1 4.2H22c-1.7 0-3.1-1.1-3.6-2.7L15 41h8.5z" opacity=".9"/>
          <path fill="currentColor" d="M52 24.5c2.2 2.3 3.4 5 3.4 7.5s-1.2 5.2-3.4 7.5" opacity=".95"/>
          <path fill="currentColor" d="M56.5 18.5c4.1 4.1 6.1 8.8 6.1 13.5s-2 9.4-6.1 13.5" opacity=".68"/>
        </svg>
        <span class="pin-title">Marketing</span>
      </span>
      <span class="pin-dot"></span>
    </button>

    <button type="button" class="booth-marker marker-it"
            onclick="pindahBooth('it')"
            aria-label="Masuk Booth IT">
      <svg class="pin-svg" viewBox="0 0 120 154" aria-hidden="true">
        <path class="pin-main-solid"
              d="M60 150 C55 140 49 132 39 121 C20 101 10 79 10 56 C10 25 33 6 60 6 C87 6 110 25 110 56 C110 79 100 101 81 121 C71 132 65 140 60 150 Z"/>
        <path class="pin-glass"
              d="M25 43 C32 20 54 13 74 18 C87 21 96 30 101 41 C90 32 75 27 59 27 C45 27 33 33 25 43 Z"/>
        <circle class="pin-rim" cx="60" cy="57" r="39"/>
        <ellipse class="pin-shine" cx="43" cy="31" rx="13" ry="7" transform="rotate(-25 43 31)"/>
      </svg>
      <span class="pin-content">
        <svg class="pin-icon" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="9" y="13" width="46" height="30" rx="4" fill="currentColor"/>
          <rect x="14" y="18" width="36" height="20" rx="2.5" fill="rgba(14,165,233,.25)"/>
          <rect x="26" y="47" width="12" height="4" rx="1.5" fill="currentColor"/>
          <rect x="19" y="51" width="26" height="4" rx="2" fill="currentColor"/>
        </svg>
        <span class="pin-title">IT</span>
      </span>
      <span class="pin-dot"></span>
    </button>
  </div>

  <div id="orientationBadge" class="orientation-badge">Geser kiri/kanan untuk pilih booth</div>

  <div id="boothQuickNav" class="booth-quicknav" aria-label="Navigasi booth">
    <button type="button" onclick="scrollToBooth('hc')">HC</button>
    <button type="button" onclick="scrollToBooth('marketing')">Marketing</button>
    <button type="button" onclick="scrollToBooth('it')">IT</button>
  </div>
</div>

<div id="svQrModal" class="sv-qr-modal" hidden aria-hidden="true">
  <div class="sv-qr-backdrop" data-close-qr></div>

  <section class="sv-qr-card" role="dialog" aria-modal="true" aria-labelledby="svQrTitle">
    <button type="button" class="sv-qr-close" data-close-qr aria-label="Tutup QR">×</button>

    <h2 id="svQrTitle" class="sv-qr-title">Scan QR Quiz</h2>
    <p class="sv-qr-subtitle">Scan QR di bawah ini untuk membuka quiz Sarinah.</p>

    <a id="svQrBoxLink"
       class="sv-qr-box"
       href="/quiz-booth3"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Buka link quiz dari QR">
      <img id="svQrImg"
           class="sv-qr-img"
           src=""
           alt="QR Quiz Sarinah">

      <span class="sv-qr-logo-wrap">
        <img class="sv-qr-logo"
             th:src="@{/sarinah.png}"
             src="/sarinah.png"
             alt="Sarinah"
             onerror="this.remove(); this.parentElement.textContent='Sarinah';">
      </span>
    </a>

    <p id="svQrNote" class="sv-qr-note">/quiz-booth3</p>
  </section>
</div>

<script th:inline="javascript">
  const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";
  const SV_LEADERBOARD_API_URL = /*[[@{/api/quiz-booth-3/leaderboard(limit=5)}]]*/ "/api/quiz-booth-3/leaderboard?limit=5";
  const SV_LB_REFRESH_MS = 10000;

  const SV_QUIZ_PATH = /*[[@{/quiz-booth3}]]*/ "/quiz-booth3";
  const SV_QUIZ_URL = new URL(SV_QUIZ_PATH, window.location.origin).href;
  const SV_TEMPLATE_IMAGE_URL = /*[[@{/template.png}]]*/ "/template.png";

  const villagePage = document.getElementById("villagePage");
  const imageWrap = document.getElementById("imageWrap");
  const villageImg = document.getElementById("villageImg");
  const loadingOverlay = document.getElementById("loadingOverlay");
  const svGiftQuizButton = document.getElementById("svGiftQuizButton");
  const svQrModal = document.getElementById("svQrModal");

  function initTemplateImage() {
    document.documentElement.style.setProperty(
      "--template-image",
      `url("${SV_TEMPLATE_IMAGE_URL}")`
    );

    if (villageImg && villageImg.getAttribute("src") !== SV_TEMPLATE_IMAGE_URL) {
      villageImg.setAttribute("src", SV_TEMPLATE_IMAGE_URL);
    }
  }

  function initQuizQr() {
    const qrUrl = "https://quickchart.io/qr?size=420&margin=1&ecLevel=H&text=" + encodeURIComponent(SV_QUIZ_URL);

    const qrBoxLink = document.getElementById("svQrBoxLink");
    const qrImg = document.getElementById("svQrImg");
    const qrNote = document.getElementById("svQrNote");

    if (qrBoxLink) qrBoxLink.href = SV_QUIZ_URL;
    if (qrImg) qrImg.src = qrUrl;
    if (qrNote) qrNote.innerText = SV_QUIZ_URL;
  }

  let svLbRows = [];
  let svLbRefreshTimer = null;
  let svLbRefreshRunning = false;

  function svOpenQrModal() {
    if (!svQrModal) return;

    svQrModal.hidden = false;
    svQrModal.setAttribute("aria-hidden", "false");
    document.body.classList.add("sv-modal-open");

    requestAnimationFrame(() => {
      svQrModal.classList.add("show");
    });
  }

  function svCloseQrModal() {
    if (!svQrModal) return;

    svQrModal.classList.remove("show");
    svQrModal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("sv-modal-open");

    window.setTimeout(() => {
      if (!svQrModal.classList.contains("show")) {
        svQrModal.hidden = true;
      }
    }, 220);
  }

  svGiftQuizButton?.addEventListener("click", svOpenQrModal);

  svQrModal?.addEventListener("click", (event) => {
    if (event.target.closest("[data-close-qr]")) {
      svCloseQrModal();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && svQrModal && !svQrModal.hidden) {
      svCloseQrModal();
    }
  });

  function setAppHeight() {
    const h = Math.max(
      320,
      Math.round(
        window.visualViewport?.height ||
        window.innerHeight ||
        document.documentElement.clientHeight ||
        0
      )
    );
    document.documentElement.style.setProperty("--app-height", h + "px");
  }

  function isPortraitMode() {
    return window.innerHeight > window.innerWidth;
  }

  function syncOrientationMode() {
    const portrait = isPortraitMode();

    document.body.classList.toggle("portrait-on", portrait);
    document.body.classList.toggle("landscape-on", !portrait);

    villagePage.classList.toggle("portrait-mode", portrait);
    villagePage.classList.toggle("landscape-mode", !portrait);
  }

  function scrollToBooth(kodeBooth) {
    const marker = document.querySelector(".marker-" + kodeBooth);
    if (!marker) return;

    if (!isPortraitMode()) {
      marker.animate(
        [
          { transform: "translate(-50%, -100%) scale(1)" },
          { transform: "translate(-50%, -106%) scale(1.08)" },
          { transform: "translate(-50%, -100%) scale(1)" }
        ],
        { duration: 480, easing: "cubic-bezier(.16,1,.3,1)" }
      );
      return;
    }

    const targetLeft = marker.offsetLeft - (villagePage.clientWidth / 2);
    villagePage.scrollTo({
      left: Math.max(0, targetLeft),
      behavior: "smooth"
    });
  }

  function centerPortraitDefault(instant = false) {
    if (!isPortraitMode()) return;

    const target = document.querySelector(".marker-marketing") || document.querySelector(".marker-hc");
    if (!target) return;

    requestAnimationFrame(() => {
      const targetLeft = target.offsetLeft - (villagePage.clientWidth / 2);
      villagePage.scrollTo({
        left: Math.max(0, targetLeft),
        behavior: instant ? "auto" : "smooth"
      });
    });
  }

  function pindahBooth(kodeBooth) {
    window.location.href = boothBaseUrl + kodeBooth;
  }

  function hideLoading() {
    loadingOverlay.classList.add("hide");
  }

  function svStartLeaderboardAutoRefresh() {
    if (svLbRefreshTimer) clearInterval(svLbRefreshTimer);
    svLbRefreshTimer = setInterval(() => {
      svRefreshLeaderboard();
    }, SV_LB_REFRESH_MS);
  }

  async function svRefreshLeaderboard() {
    if (svLbRefreshRunning) return;

    svLbRefreshRunning = true;
    svSetMiniLeaderboardStatus("Sync");

    try {
      const response = await fetch(SV_LEADERBOARD_API_URL, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const json = await response.json();

      const rows = Array.isArray(json)
        ? json
        : (json.data || json.rows || json.value || []);

      svLbRows = svNormalizeLeaderboardRows(rows);
      svRenderMiniLeaderboardRows(svLbRows);
      svSetMiniLeaderboardStatus("Auto");

      console.log("Leaderboard API HIT:", SV_LEADERBOARD_API_URL, rows);

    } catch (error) {
      console.error("Leaderboard refresh gagal:", error);
      svSetMiniLeaderboardStatus("Error");
      svRenderMiniLeaderboardRows([]);
    } finally {
      svLbRefreshRunning = false;
    }
  }

  function svNormalizeLeaderboardRows(rows) {
    return (rows || [])
      .map((row, index) => {
        const name = String(
          row.name ??
          row.Name ??
          row.nama ??
          row.Nama ??
          row["Nama Lengkap"] ??
          row["Nama lengkap"] ??
          ""
        ).trim();

        const email = String(
          row.email ??
          row.Email ??
          row["E-mail"] ??
          ""
        ).trim();

        const division = String(
          row.division ??
          row.Division ??
          row.divisi ??
          row.Divisi ??
          ""
        ).trim();

        const score = Number(
          row.score ??
          row.Score ??
          row.nilai ??
          row.Nilai ??
          row["Total points"] ??
          row["Total Points"] ??
          0
        );

        const durationSeconds = Number(
          row.durationSeconds ??
          row.DurationSeconds ??
          row.duration_seconds ??
          row["durationSeconds"] ??
          999999999
        );

        const start = String(row.start ?? row.Start ?? row["Start time"] ?? "").trim();
        const done = String(row.done ?? row.Done ?? row["Completion time"] ?? "").trim();

        return {
          name,
          email,
          division,
          score: Number.isFinite(score) ? score : 0,
          durationSeconds: Number.isFinite(durationSeconds) ? durationSeconds : 999999999,
          durationMs: Number.isFinite(durationSeconds) ? durationSeconds * 1000 : 999999999000,
          start,
          done,
          originalIndex: index
        };
      })
      .filter(item => item.name)
      .sort(svCompareLeaderboard)
      .slice(0, 5);
  }

  function svCompareLeaderboard(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    if (a.durationSeconds !== b.durationSeconds) return a.durationSeconds - b.durationSeconds;
    return a.originalIndex - b.originalIndex;
  }

  function svRenderMiniLeaderboardRows(rows) {
    const target = document.getElementById("svMiniLeaderboardList");
    if (!target) return;

    const top5 = (rows || []).slice().sort(svCompareLeaderboard).slice(0, 5);

    if (!top5.length) {
      target.innerHTML = `
        <div class="sv-mini-lb-row">
          <span class="sv-mini-lb-rank">-</span>
          <span class="sv-mini-lb-name">Belum ada data</span>
          <span class="sv-mini-lb-score"></span>
        </div>
      `;
      return;
    }

    target.innerHTML = top5.map((item, idx) => {
      return `
        <div class="sv-mini-lb-row">
          <span class="sv-mini-lb-rank">${idx + 1}</span>
          <span class="sv-mini-lb-name" title="${svEscapeHtml(item.name)}">${svEscapeHtml(item.name)}</span>
          <span class="sv-mini-lb-score">${svFormatNumber(item.score)}/100 · ${svFormatDuration(item.durationSeconds)}</span>
        </div>
      `;
    }).join("");
  }

  function svSetMiniLeaderboardStatus(text) {
    const status = document.getElementById("svMiniLbStatusText");
    if (!status) return;

    status.innerHTML = `<span class="sv-mini-lb-dot"></span>${svEscapeHtml(text || "Auto")}`;
  }

  function svEscapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function svFormatNumber(value) {
    const number = Number(value || 0);
    if (!Number.isFinite(number)) return "0";
    return number.toLocaleString("id-ID");
  }

  function svFormatDuration(seconds) {
    const safe = Number.isFinite(Number(seconds)) ? Math.max(0, Number(seconds)) : 0;
    const m = Math.floor(safe / 60);
    const s = Math.floor(safe % 60);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  // BACKGROUND MUSIC AUTOPLAY
  const svBgMusic = document.getElementById("svBgMusic");
  const svMusicToggle = document.getElementById("svMusicToggle");

  let svMusicPlaying = false;

  async function svPlayMusic() {
    if (!svBgMusic) return;

    try {
      svBgMusic.volume = 0.55;
      svBgMusic.muted = false;

      await svBgMusic.play();

      svMusicPlaying = true;

      if (svMusicToggle) {
        svMusicToggle.innerHTML = "🔊 Musik";
        svMusicToggle.classList.remove("need-click");
      }
    } catch (error) {
      console.warn("Autoplay musik diblokir browser, perlu klik user:", error);

      svMusicPlaying = false;

      if (svMusicToggle) {
        svMusicToggle.innerHTML = "▶️ Putar Musik";
        svMusicToggle.classList.add("need-click");
      }
    }
  }

  function svPauseMusic() {
    if (!svBgMusic) return;

    svBgMusic.pause();
    svMusicPlaying = false;

    if (svMusicToggle) {
      svMusicToggle.innerHTML = "🔇 Musik";
      svMusicToggle.classList.remove("need-click");
    }
  }

  function svToggleMusic() {
    if (!svBgMusic) return;

    if (svBgMusic.paused || !svMusicPlaying) {
      svPlayMusic();
    } else {
      svPauseMusic();
    }
  }

  svMusicToggle?.addEventListener("click", svToggleMusic);

  ["click", "touchstart", "keydown"].forEach((eventName) => {
    document.addEventListener(eventName, () => {
      if (svBgMusic && svBgMusic.paused) {
        svPlayMusic();
      }
    }, { once: true, passive: true });
  });

  initTemplateImage();
  initQuizQr();
  setAppHeight();
  syncOrientationMode();

  if (villageImg.complete && villageImg.naturalWidth > 0) {
    hideLoading();
    centerPortraitDefault(true);
  } else {
    villageImg.addEventListener("load", () => {
      hideLoading();
      centerPortraitDefault(true);
    }, { once: true });

    villageImg.addEventListener("error", () => {
      hideLoading();
    }, { once: true });
  }

  setTimeout(hideLoading, 5000);

  window.addEventListener("load", () => {
    svPlayMusic();
  });

  window.addEventListener("resize", () => {
    setAppHeight();
    syncOrientationMode();
    centerPortraitDefault(true);
  }, { passive: true });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      setAppHeight();
      syncOrientationMode();
      centerPortraitDefault(true);
    }, 250);
  }, { passive: true });

  window.visualViewport?.addEventListener("resize", () => {
    setAppHeight();
    syncOrientationMode();
  }, { passive: true });

  svRenderMiniLeaderboardRows([]);
  svRefreshLeaderboard();
  svStartLeaderboardAutoRefresh();
</script>
</body>
</html>
