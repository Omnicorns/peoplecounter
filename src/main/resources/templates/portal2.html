<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sarinah Village</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1117;
    }

    :root {
      --app-height: 100dvh;
      --marker-size: clamp(68px, 6.8vw, 104px);
      --text-shadow: 0 2px 8px rgba(0,0,0,.34);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #0b1220, #111827);
      transition: opacity .45s ease, visibility .45s ease;
    }

    .loading-overlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .loader-ring .ring {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .9s cubic-bezier(.4,0,.2,1) infinite;
    }

    .loader-ring .ring.inner {
      inset: 12px;
      border-width: 3px;
      border-top-color: transparent;
      border-bottom-color: #818cf8;
      animation: spin 1.3s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #cbd5e1;
      font-size: 14px;
      letter-spacing: .4px;
      font-weight: 700;
    }

    .loading-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    .village-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .village-page::before {
      content: "";
      position: absolute;
      inset: -36px;
      z-index: 0;
      background-image: url("/template.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: blur(22px);
      transform: scale(1.08);
      opacity: .88;
    }

    .village-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: rgba(0,0,0,.08);
      pointer-events: none;
    }

    .village-image-wrap {
      position: relative;
      z-index: 1;
      display: inline-block;
      line-height: 0;
      max-width: 100vw;
      max-height: 100vh;
      max-height: var(--app-height);
      isolation: isolate;
    }

    .village-img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: var(--app-height);
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ============================================================
       MARKER BUBBLE CSS
       Titik koordinat marker berada di ujung pin / titik putih.
       Ubah left/top kalau mau geser posisi.
       ============================================================ */
    /* ============================================================
       PRODUCTION MARKER BUBBLE
       Bentuk marker dibuat dari SVG teardrop, bukan kotak/diamond.
       Titik koordinat marker ada di ujung pin bagian bawah.
       Geser posisi cukup ubah --x dan --y di .marker-hc/.marker-marketing/.marker-it
       ============================================================ */
    .booth-marker {
      --pin-color: #8b3dff;
      --pin-color-2: #6d28d9;
      --pin-glow: rgba(139,61,255,.42);
      --delay: 0s;
      --marker-local-size: var(--marker-size);

      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 12;
      width: calc(var(--marker-local-size) * 1.16);
      height: calc(var(--marker-local-size) * 1.48);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      line-height: 1;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.30));
      animation: markerFloat 3.2s ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: margin-top, transform;
    }

    .booth-marker::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 20px;
      height: 7px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,.26);
      filter: blur(5px);
      opacity: .65;
      pointer-events: none;
    }

    .booth-marker:hover {
      animation-play-state: paused;
      transform: translate(-50%, -103%) scale(1.035);
      filter: drop-shadow(0 24px 34px rgba(0,0,0,.34));
    }

    .booth-marker:active {
      transform: translate(-50%, -100%) scale(.985);
    }

    .pin-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .pin-main {
      fill: url(#markerGradient);
      stroke: rgba(255,255,255,.78);
      stroke-width: 3.4;
      vector-effect: non-scaling-stroke;
    }

    .pin-main-solid {
      fill: var(--pin-color);
    }

    .pin-glass {
      fill: rgba(255,255,255,.13);
      pointer-events: none;
    }

    .pin-rim {
      fill: none;
      stroke: rgba(255,255,255,.22);
      stroke-width: 1.4;
      pointer-events: none;
    }

    .pin-shine {
      fill: rgba(255,255,255,.38);
      filter: blur(.2px);
      pointer-events: none;
    }

    .pin-content {
      position: absolute;
      left: 50%;
      top: 41%;
      z-index: 2;
      width: 78%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, .48vw, 8px);
      color: #fff;
      text-align: center;
      pointer-events: none;
    }

    .pin-icon {
      width: clamp(24px, 2.45vw, 36px);
      height: clamp(24px, 2.45vw, 36px);
      display: block;
      color: #fff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.24));
    }

    .pin-title {
      max-width: 100%;
      color: #fff;
      font-weight: 900;
      font-size: clamp(13px, 1.08vw, 18px);
      letter-spacing: .15px;
      white-space: nowrap;
      text-shadow: 0 2px 9px rgba(0,0,0,.30);
    }

    .pin-dot {
      position: absolute;
      left: 50%;
      bottom: -2px;
      z-index: 4;
      width: 12px;
      height: 12px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #fff;
      box-shadow:
        0 0 0 5px rgba(255,255,255,.32),
        0 0 18px rgba(255,255,255,.95),
        0 8px 12px rgba(0,0,0,.18);
      animation: dotPulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    .pin-dot::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: inherit;
      border: 2px solid rgba(255,255,255,.30);
      animation: ripple 1.8s ease-out infinite;
    }

    .marker-hc {
      --pin-color: #8b3dff;
      --pin-color-2: #5b21b6;
      --pin-glow: rgba(139,61,255,.52);
      --delay: 0s;

      /* Akurat ke atap booth ungu */
      --x: 23.2%;
      --y: 59.5%;
    }

    .marker-marketing {
      --pin-color: #ff7a12;
      --pin-color-2: #d9480f;
      --pin-glow: rgba(255,122,18,.52);
      --delay: .35s;
      --marker-local-size: clamp(72px, 7.25vw, 112px);

      /* Akurat ke atap booth orange */
      --x: 38.6%;
      --y: 71.0%;
    }

    .marker-marketing .pin-title {
      font-size: clamp(11px, .92vw, 15px);
      letter-spacing: 0;
    }

    .marker-it {
      --pin-color: #168cff;
      --pin-color-2: #075cb8;
      --pin-glow: rgba(22,140,255,.52);
      --delay: .7s;

      /* Akurat ke atap booth biru */
      --x: 76.8%;
      --y: 59.5%;
    }

    .marker-hc .pin-main,
    .marker-hc .pin-main-solid {
      fill: #7c3aed;
    }

    .marker-marketing .pin-main,
    .marker-marketing .pin-main-solid {
      fill: #f97316;
    }

    .marker-it .pin-main,
    .marker-it .pin-main-solid {
      fill: #0ea5e9;
    }

    @keyframes markerFloat {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -10px; }
    }

    @keyframes dotPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.18); opacity: .9; }
    }

    @keyframes ripple {
      0% { transform: scale(.72); opacity: .58; }
      100% { transform: scale(1.22); opacity: 0; }
    }

    @media (max-width: 768px) {
      :root {
        --marker-size: clamp(58px, 12vw, 80px);
      }

      .marker-marketing {
        --marker-local-size: clamp(64px, 13.2vw, 88px);
      }

      .pin-dot {
        width: 10px;
        height: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring .ring,
      .loading-dots::after,
      .booth-marker,
      .pin-dot,
      .pin-dot::after {
        animation: none !important;
      }
    }


    /* ============================================================
       PORTRAIT + LANDSCAPE RESPONSIVE MODE
       - Landscape: gambar contain full screen.
       - Portrait: gambar dibuat full-height dan bisa swipe kiri/kanan.
       - Bubble production tetap menempel di koordinat gambar.
       ============================================================ */
    .village-page.landscape-mode {
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .village-page.portrait-mode {
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
    }

    .village-page.portrait-mode::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .village-page.portrait-mode {
      scrollbar-width: none;
    }

    .village-page.portrait-mode .village-image-wrap {
      height: var(--app-height);
      max-height: var(--app-height);
      max-width: none;
      flex: 0 0 auto;
      scroll-snap-align: center;
    }

    .village-page.portrait-mode .village-img {
      height: var(--app-height);
      width: auto;
      max-height: var(--app-height);
      max-width: none;
    }

    .orientation-badge {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      z-index: 50;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: rgba(255,255,255,.94);
      background: rgba(10, 18, 31, .46);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .2px;
      pointer-events: none;
    }

    .orientation-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,.88);
    }

    .booth-quicknav {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 55;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(10, 18, 31, .50);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 16px 38px rgba(0,0,0,.26);
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
    }

    .booth-quicknav button {
      border: 0;
      min-width: 42px;
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .2px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        0 6px 18px rgba(0,0,0,.20);
    }

    .booth-quicknav button:nth-child(1) {
      background: linear-gradient(180deg, #a855f7, #7c3aed);
    }

    .booth-quicknav button:nth-child(2) {
      background: linear-gradient(180deg, #fb923c, #ea580c);
    }

    .booth-quicknav button:nth-child(3) {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
    }

    .booth-quicknav button:active {
      transform: scale(.95);
    }

    body.portrait-on .orientation-badge,
    body.portrait-on .booth-quicknav {
      display: flex;
    }

    body.landscape-on .booth-quicknav {
      display: none;
    }

    @media (orientation: portrait) {
      :root {
        --marker-size: clamp(62px, 9.8vh, 86px);
      }

      .marker-marketing {
        --marker-local-size: clamp(68px, 10.2vh, 94px);
      }

      .booth-marker {
        filter: drop-shadow(0 14px 22px rgba(0,0,0,.30));
      }

      .pin-title {
        font-size: clamp(12px, 2.25vh, 16px);
      }

      .marker-marketing .pin-title {
        font-size: clamp(10px, 1.92vh, 14px);
      }

      .pin-icon {
        width: clamp(23px, 3.9vh, 32px);
        height: clamp(23px, 3.9vh, 32px);
      }
    }


    .debug-box {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.72);
      color: white;
      font-size: 12px;
      line-height: 1.45;
      display: none;
    }

    .debug-on .debug-box {
      display: block;
    }

    .debug-on .booth-marker {
      outline: 2px dashed rgba(255,255,255,.9);
    }

    @media (max-width: 768px) {
      :root {
        --marker-size: clamp(58px, 12vw, 78px);
      }

      .pin-dot {
        width: 10px;
        height: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring .ring,
      .loading-dots::after,
      .booth-marker,
      .pin-dot {
        animation: none !important;
      }
    }

    /* ============================================================
       QUIZ BUTTON + AUTO REFRESH LEADERBOARD TOP 5
       Ranking: Total points tertinggi, lalu durasi pengerjaan tercepat.
       ============================================================ */
    .sv-quiz-actions {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: calc(14px + env(safe-area-inset-right, 0px));
      z-index: 85;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .sv-quiz-btn {
      border: 0;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font-weight: 950;
      font-size: 13px;
      letter-spacing: .2px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 16px 35px rgba(0,0,0,.28);
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      white-space: nowrap;
    }

    .sv-quiz-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.38),
        0 20px 42px rgba(0,0,0,.34);
    }

    .sv-quiz-btn:active {
      transform: scale(.96);
    }

    .sv-quiz-btn.quiz {
      background: linear-gradient(180deg, #ef4444, #dc2626);
    }

    .sv-quiz-btn.leaderboard {
      background: linear-gradient(180deg, #f59e0b, #d97706);
    }

    .sv-lb-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 7, 18, .72);
      backdrop-filter: blur(16px) saturate(145%);
      -webkit-backdrop-filter: blur(16px) saturate(145%);
    }

    .sv-lb-backdrop.show {
      display: flex;
      animation: svLbFade .18s ease both;
    }

    @keyframes svLbFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sv-lb-modal {
      width: min(980px, 100%);
      max-height: min(90vh, 760px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      color: #f8fafc;
      background:
        radial-gradient(circle at 50% 0%, rgba(245,158,11,.18), transparent 32%),
        linear-gradient(180deg, #121625, #0b0f19);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow:
        0 34px 95px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .sv-lb-head {
      padding: 22px 22px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(90deg, rgba(250,204,21,.12), transparent 44%),
        rgba(255,255,255,.02);
    }

    .sv-lb-head-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .sv-lb-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      color: #facc15;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .sv-lb-title {
      margin: 12px 0 4px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1;
      letter-spacing: -.045em;
      font-weight: 1000;
    }

    .sv-lb-subtitle {
      margin: 0;
      color: rgba(226,232,240,.76);
      font-size: 13px;
      line-height: 1.5;
      max-width: 760px;
    }

    .sv-lb-close {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: white;
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
      transition: transform .16s ease, background .16s ease;
    }

    .sv-lb-close:hover {
      transform: rotate(90deg);
      background: rgba(255,255,255,.14);
    }

    .sv-lb-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 22px;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .sv-lb-tools-left,
    .sv-lb-tools-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .sv-lb-tool,
    .sv-lb-upload {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      color: #f8fafc;
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .14s ease, background .14s ease;
    }

    .sv-lb-tool:hover,
    .sv-lb-upload:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.13);
    }

    .sv-lb-upload input {
      display: none;
    }

    .sv-lb-refresh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(226,232,240,.74);
      font-size: 12px;
      font-weight: 800;
    }

    .sv-lb-refresh-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,.8);
      animation: svLbPulse 1.5s ease-in-out infinite;
    }

    @keyframes svLbPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.78); }
    }

    .sv-lb-body {
      overflow: auto;
      padding: 18px 22px 22px;
    }

    .sv-lb-podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .sv-lb-podium-card {
      position: relative;
      min-height: 166px;
      padding: 20px 16px;
      border-radius: 22px;
      text-align: center;
      overflow: hidden;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }

    .sv-lb-podium-card.rank-1 {
      min-height: 182px;
      transform: translateY(-8px);
      background:
        radial-gradient(circle at 50% 0%, rgba(250,204,21,.26), transparent 55%),

  <script th:inline="javascript">
    const DEBUG_MODE = false;
    const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";

    const villagePage = document.getElementById("villagePage");
    const imageWrap = document.getElementById("imageWrap");
    const villageImg = document.getElementById("villageImg");
    const loadingOverlay = document.getElementById("loadingOverlay");

    if (DEBUG_MODE) {
      document.body.classList.add("debug-on");
    }

    function setAppHeight() {
      const h = Math.max(320, Math.round(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 0));
      document.documentElement.style.setProperty("--app-height", h + "px");
    }


    function isPortraitMode() {
      return window.innerHeight > window.innerWidth;
    }

    function syncOrientationMode() {
      const portrait = isPortraitMode();

      document.body.classList.toggle("portrait-on", portrait);
      document.body.classList.toggle("landscape-on", !portrait);

      villagePage.classList.toggle("portrait-mode", portrait);
      villagePage.classList.toggle("landscape-mode", !portrait);

      imageWrap.classList.toggle("portrait", portrait);
      imageWrap.classList.toggle("landscape", !portrait);
    }

    function scrollToBooth(kodeBooth) {
      const marker = document.querySelector(".marker-" + kodeBooth);
      if (!marker) return;

      if (!isPortraitMode()) {
        marker.animate(
          [
            { transform: "translate(-50%, -100%) scale(1)" },
            { transform: "translate(-50%, -106%) scale(1.08)" },
            { transform: "translate(-50%, -100%) scale(1)" }
          ],
          { duration: 480, easing: "cubic-bezier(.16,1,.3,1)" }
        );
        return;
      }

      const targetLeft = marker.offsetLeft - (villagePage.clientWidth / 2);
      villagePage.scrollTo({
        left: Math.max(0, targetLeft),
        behavior: "smooth"
      });
    }

    function centerPortraitDefault(instant = false) {
      if (!isPortraitMode()) return;

      const target = document.querySelector(".marker-marketing") || document.querySelector(".marker-hc");
      if (!target) return;

      requestAnimationFrame(() => {
        const targetLeft = target.offsetLeft - (villagePage.clientWidth / 2);
        villagePage.scrollTo({
          left: Math.max(0, targetLeft),
          behavior: instant ? "auto" : "smooth"
        });
      });
    }

    function pindahBooth(kodeBooth) {
      window.location.href = boothBaseUrl + kodeBooth;
    }

    function debugPosisi(event, namaBooth) {
      if (!DEBUG_MODE) return;

      const debugBox = document.getElementById("debugBox");
      const rect = imageWrap.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;

      debugBox.innerHTML =
        "Booth: <b>" + namaBooth + "</b><br>" +
        "x: <b>" + x.toFixed(1) + "%</b> | " +
        "y: <b>" + y.toFixed(1) + "%</b>";
    }

    function hideLoading() {
      loadingOverlay.classList.add("hide");
    }

    setAppHeight();
    syncOrientationMode();

    if (villageImg.complete && villageImg.naturalWidth > 0) {
      hideLoading();
      centerPortraitDefault(true);
    } else {
      villageImg.addEventListener("load", () => {
        hideLoading();
        centerPortraitDefault(true);
      }, { once: true });
      villageImg.addEventListener("error", hideLoading, { once: true });
    }

    setTimeout(hideLoading, 5000);
    window.addEventListener("resize", () => {
      setAppHeight();
      syncOrientationMode();
      centerPortraitDefault(true);
    }, { passive: true });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        setAppHeight();
        syncOrientationMode();
        centerPortraitDefault(true);
      }, 250);
    }, { passive: true });

    window.visualViewport?.addEventListener("resize", () => {
      setAppHeight();
      syncOrientationMode();
    }, { passive: true });


    /* ============================================================
       QUIZ + LEADERBOARD AUTO REFRESH
       ============================================================ */
    const SV_QUIZ_FORM_URL = "https://forms.office.com/r/gyEkcLHRTu";
    const SV_LEADERBOARD_EXCEL_URL = "https://ptsarinah-my.sharepoint.com/:x:/g/personal/frisca_adiesthy_sarinah_co_id/IQAMuVmzLVhaTp2GxxOr_C7DARMv8aBuTNd1-D-VT4n_NcE?email=aloysius.tanto%40sarinah.co.id&e=hWGKas";
    const SV_LEADERBOARD_API_URL = /*[[${leaderboardApiUrl} != null ? ${leaderboardApiUrl} : '' ]]*/ "";
    const SV_LB_REFRESH_MS = 10000;
    const SV_LB_STORAGE_KEY = "sarinah_quiz_leaderboard_rows_v2";

    let svLbRows = [];
    let svLbRefreshTimer = null;
    let svLbRefreshRunning = false;

    function svOpenQuiz() {
      window.open(SV_QUIZ_FORM_URL, "_blank", "noopener,noreferrer");
    }

    function svOpenLeaderboard() {
      const panel = document.getElementById("svLeaderboardBackdrop");
      if (!panel) return;
      panel.classList.add("show");
      panel.setAttribute("aria-hidden", "false");
      svRenderLeaderboard();
      svRefreshLeaderboard(false);
    }

    function svCloseLeaderboard() {
      const panel = document.getElementById("svLeaderboardBackdrop");
      if (!panel) return;
      panel.classList.remove("show");
      panel.setAttribute("aria-hidden", "true");
    }

    function svStartLeaderboardAutoRefresh() {
      if (svLbRefreshTimer) clearInterval(svLbRefreshTimer);
      svLbRefreshTimer = setInterval(() => svRefreshLeaderboard(false), SV_LB_REFRESH_MS);
    }

    async function svRefreshLeaderboard(force) {
      if (svLbRefreshRunning) return;
      svLbRefreshRunning = true;
      const refreshText = document.getElementById("svLbRefreshText");
      if (refreshText) refreshText.textContent = "Memuat data...";
      svSetMiniLeaderboardStatus("Sync");

      try {
        if (SV_LEADERBOARD_API_URL && String(SV_LEADERBOARD_API_URL).trim() !== "") {
          const response = await fetch(SV_LEADERBOARD_API_URL, {
            method: "GET",
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
            cache: "no-store"
          });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const json = await response.json();
          const rows = Array.isArray(json) ? json : (json.data || json.rows || json.value || []);
          svLbRows = svNormalizeLeaderboardRows(rows);
          svSaveStoredLeaderboardRows(rows);
        } else {
          const stored = svLoadStoredLeaderboardRows();
          if (stored.length) svLbRows = svNormalizeLeaderboardRows(stored);
        }

        svRenderLeaderboard();
        if (refreshText) {
          const now = new Date();
          refreshText.textContent = "Auto refresh aktif • " + now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        }
        svSetMiniLeaderboardStatus("Auto");
      } catch (error) {
        console.warn("Leaderboard refresh gagal:", error);
        if (refreshText) refreshText.textContent = "Auto refresh gagal, pakai data terakhir";
        svSetMiniLeaderboardStatus("Demo");
        if (force) alert("Leaderboard belum bisa refresh. Cek endpoint/data Excel.");
      } finally {
        svLbRefreshRunning = false;
      }
    }

    function svSaveStoredLeaderboardRows(rows) {
      try {
        localStorage.setItem(SV_LB_STORAGE_KEY, JSON.stringify(rows || []));
      } catch (err) {
        console.warn("Tidak bisa simpan leaderboard ke localStorage", err);
      }
    }

    function svLoadStoredLeaderboardRows() {
      try {
        const raw = localStorage.getItem(SV_LB_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        return [];
      }
    }

    async function svHandleLeaderboardFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        let rows = [];
        const lower = file.name.toLowerCase();

        if (lower.endsWith(".csv")) {
          const text = await file.text();
          rows = svParseCsv(text);
        } else {
          if (!window.XLSX) {
            throw new Error("Library XLSX belum termuat. Coba refresh halaman lalu upload lagi.");
          }
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: "array", cellDates: true });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
        }

        svSaveStoredLeaderboardRows(rows);
        svLbRows = svNormalizeLeaderboardRows(rows);
        svRenderLeaderboard();
        svOpenLeaderboard();
      } catch (error) {
        console.error(error);
        alert(error.message || "File leaderboard belum bisa dibaca. Gunakan .xlsx, .xls, atau .csv.");
      } finally {
        event.target.value = "";
      }
    }

    function svNormalizeLeaderboardRows(rows) {
      return (rows || [])
        .map((row, index) => {
          const nama = svPickValue(row, [
            "Nama Lengkap", "Nama lengkap", "nama lengkap",
            "Name", "name", "Nama", "nama",
            "Full Name", "full name"
          ]);

          const email = svPickValue(row, ["Email", "email", "E-mail", "User principal name"]);
          const scoreRaw = svPickValue(row, [
            "Total points", "Total Points", "total points",
            "Score", "score", "Nilai", "nilai", "Poin", "poin"
          ]);
          const startRaw = svPickValue(row, [
            "Start time", "Start Time", "start time",
            "Waktu Mulai", "waktu mulai", "Started", "started"
          ]);
          const completeRaw = svPickValue(row, [
            "Completion time", "Completion Time", "completion time",
            "Waktu Selesai", "waktu selesai", "Completed", "completed"
          ]);

          const name = String(nama || email || ("Peserta " + (index + 1))).trim();
          const score = svToNumber(scoreRaw);
          const startDate = svParseDate(startRaw);
          const completeDate = svParseDate(completeRaw);

          let durationMs = Number.POSITIVE_INFINITY;
          if (startDate && completeDate) {
            durationMs = Math.max(0, completeDate.getTime() - startDate.getTime());
          }

          return {
            name,
            email: String(email || "").trim(),
            score,
            startRaw: String(startRaw || "").trim(),
            completeRaw: String(completeRaw || "").trim(),
            startDate,
            completeDate,
            durationMs,
            originalIndex: index
          };
        })
        .filter(item => item.name && Number.isFinite(item.score))
        .sort(svCompareLeaderboard);
    }

    function svCompareLeaderboard(a, b) {
      // 1) Nilai tertinggi
      if (b.score !== a.score) return b.score - a.score;

      // 2) Durasi pengerjaan tercepat: Completion time - Start time
      if (a.durationMs !== b.durationMs) return a.durationMs - b.durationMs;

      // 3) Kalau durasi sama / start kosong, Completion time paling awal
      const ac = a.completeDate ? a.completeDate.getTime() : Number.POSITIVE_INFINITY;
      const bc = b.completeDate ? b.completeDate.getTime() : Number.POSITIVE_INFINITY;
      if (ac !== bc) return ac - bc;

      // 4) Urutan data asli
      return a.originalIndex - b.originalIndex;
    }


    function svSetMiniLeaderboardStatus(text) {
      const status = document.getElementById("svMiniLbStatusText");
      if (!status) return;
      status.innerHTML = '<span class="sv-mini-lb-dot"></span>' + svEscapeHtml(text || "Auto");
    }

    function svRenderMiniLeaderboardRows(rows) {
      const target = document.getElementById("svMiniLeaderboardList");
      if (!target) return;

      const top5 = (rows || []).slice().sort(svCompareLeaderboard).slice(0, 5);
      if (!top5.length) {
        target.innerHTML = '<div class="sv-mini-lb-row"><span class="sv-mini-lb-rank">-</span><span class="sv-mini-lb-name">Belum ada data</span></div>';
        return;
      }

      target.innerHTML = top5.map((item, idx) => `
        <div class="sv-mini-lb-row">
          <span class="sv-mini-lb-rank">${idx + 1}</span>
          <span class="sv-mini-lb-name" title="${svEscapeHtml(item.name)}">${svEscapeHtml(item.name)}</span>
        </div>
      `).join("");
    }


    function svRenderLeaderboard() {
      const top5 = (svLbRows || []).slice().sort(svCompareLeaderboard).slice(0, 5);
      svRenderMiniLeaderboardRows(top5);
      const podium = document.getElementById("svLbPodium");
      const list = document.getElementById("svLbList");
      const empty = document.getElementById("svLbEmpty");

      if (!podium || !list || !empty) return;

      if (!top5.length) {
        podium.innerHTML = "";
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      const top3 = top5.slice(0, 3);
      podium.innerHTML = top3.map((item, idx) => {
        const rank = idx + 1;
        const medal = rank === 1 ? "🥇" : (rank === 2 ? "🥈" : "🥉");
        return `
          <article class="sv-lb-podium-card rank-${rank}">
            <div class="sv-lb-rank-circle">${rank}</div>
            <div class="sv-lb-name" title="${svEscapeHtml(item.name)}">${svEscapeHtml(item.name)}</div>
            <div class="sv-lb-sub">${svEscapeHtml(svMaskIdentity(item.email || item.completeRaw || "Quiz participant"))}</div>
            <div class="sv-lb-score">${medal} ${svFormatNumber(item.score)} poin</div>
            <div class="sv-lb-sub">⏱ ${svFormatDuration(item.durationMs)} • selesai ${svEscapeHtml(item.completeRaw || "-")}</div>
          </article>
        `;
      }).join("");

      const rows = top5.slice(3);
      list.innerHTML = rows.map((item, idx) => {
        const rank = idx + 4;
        return `
          <div class="sv-lb-row">
            <div class="sv-lb-row-rank">${rank}</div>
            <div class="sv-lb-row-name">
              <b title="${svEscapeHtml(item.name)}">${svEscapeHtml(item.name)}</b>
              <span>${svEscapeHtml(svMaskIdentity(item.email || item.completeRaw || "Quiz participant"))}</span>
            </div>
            <div class="sv-lb-row-time">⏱ ${svFormatDuration(item.durationMs)}</div>
            <div class="sv-lb-row-score">${svFormatNumber(item.score)}</div>
          </div>
        `;
      }).join("");
    }

    function svPickValue(row, keys) {
      if (!row) return "";
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(row, key) && row[key] !== "") return row[key];
      }

      const lookup = {};
      Object.keys(row).forEach(key => {
        lookup[String(key).trim().toLowerCase()] = row[key];
      });

      for (const key of keys) {
        const value = lookup[String(key).trim().toLowerCase()];
        if (value !== undefined && value !== "") return value;
      }

      return "";
    }

    function svToNumber(value) {
      if (typeof value === "number") return value;
      const clean = String(value ?? "0").replace(",", ".").replace(/[^\d.-]/g, "");
      const parsed = Number(clean);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function svParseDate(value) {
      if (!value) return null;
      if (value instanceof Date && !isNaN(value)) return value;

      const text = String(value).trim();
      if (!text) return null;

      // Excel serial number
      if (/^\d+(\.\d+)?$/.test(text)) {
        const serial = Number(text);
        if (serial > 25000) {
          const utcDays = Math.floor(serial - 25569);
          const utcValue = utcDays * 86400;
          const date = new Date(utcValue * 1000);
          const fractionalDay = serial - Math.floor(serial) + 0.0000001;
          let totalSeconds = Math.floor(86400 * fractionalDay);
          const seconds = totalSeconds % 60;
          totalSeconds -= seconds;
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor(totalSeconds / 60) % 60;
          date.setHours(hours, minutes, seconds);
          return isNaN(date) ? null : date;
        }
      }

      // Format Microsoft Forms: 5/25/2026 14:13
      const us = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (us) {
        const parsed = new Date(Number(us[3]), Number(us[1]) - 1, Number(us[2]), Number(us[4]), Number(us[5]), Number(us[6] || 0));
        return isNaN(parsed) ? null : parsed;
      }

      // Format Indonesia: 25/5/2026 14:13
      const id = text.match(/^(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (id) {
        const parsed = new Date(Number(id[3]), Number(id[2]) - 1, Number(id[1]), Number(id[4]), Number(id[5]), Number(id[6] || 0));
        return isNaN(parsed) ? null : parsed;
      }

      const fallback = new Date(text);
      return isNaN(fallback) ? null : fallback;
    }

    function svFormatDuration(ms) {
      if (!Number.isFinite(ms)) return "-";
      const totalSeconds = Math.max(0, Math.round(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) return `${hours}j ${minutes}m`;
      if (minutes > 0) return `${minutes}m ${seconds}s`;
      return `${seconds}s`;
    }

    function svFormatNumber(value) {
      return new Intl.NumberFormat("id-ID").format(value || 0);
    }

    function svMaskIdentity(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (text.includes("@")) {
        const parts = text.split("@");
        const name = parts[0];
        const visible = name.length <= 3 ? name : name.slice(0, 3) + "***";
        return visible + "@" + parts[1];
      }
      if (text.length <= 8) return text;
      return text.slice(0, 8) + "**";
    }

    function svEscapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function svParseCsv(csvText) {
      const text = String(csvText || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if ((ch === "," || ch === ";") && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell);
          if (row.some(v => String(v).trim() !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        if (row.some(v => String(v).trim() !== "")) rows.push(row);
      }

      if (!rows.length) return [];
      const headers = rows[0].map(h => String(h || "").trim());
      return rows.slice(1).map(values => {
        const obj = {};
        headers.forEach((header, idx) => obj[header || ("Column " + idx)] = values[idx] ?? "");
        return obj;
      });
    }

    document.getElementById("svLbExcelLink")?.setAttribute("href", SV_LEADERBOARD_EXCEL_URL);
    document.getElementById("svLbFile")?.addEventListener("change", svHandleLeaderboardFile);

    document.getElementById("svLeaderboardBackdrop")?.addEventListener("click", (event) => {
      if (event.target && event.target.id === "svLeaderboardBackdrop") svCloseLeaderboard();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") svCloseLeaderboard();
    });

    svLbRows = svNormalizeLeaderboardRows(svLoadStoredLeaderboardRows());
    svRenderLeaderboard();
    svStartLeaderboardAutoRefresh();
    svRefreshLeaderboard(false);

  </script>
