<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sarinah Village</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #008ee8;
        }

        /* gambar PENUH LAYAR (cover): tidak ada celah, tepi boleh sedikit terpotong */
        .village-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #008ee8;
            background-image: url('/template.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        @media (orientation: portrait) {
            .village-page {
                background-image: url('/template1.png');
            }
        }

        /* hotspot = area klik transparan, TANPA lingkaran / efek hover */
        .hotspot {
            position: absolute;
            z-index: 10;
            border: none;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            padding: 0;
            outline: none;
        }
        .hotspot:active { transform: translate(-50%, -50%) scale(0.96); }

        /* ===== posisi hotspot: LANDSCAPE (template.png) ===== */
        .hotspot-hc        { left: 25%; top: 53%; width: 9%;  height: 16%; }
        .hotspot-marketing { left: 40%; top: 67%; width: 9%;  height: 16%; }
        .hotspot-it        { left: 75%; top: 52%; width: 9%;  height: 16%; }

        /* ===== posisi hotspot: PORTRAIT (template1.png) ===== */
        @media (orientation: portrait) {
            .hotspot-hc        { left: 13%; top: 51%; width: 22%; height: 14%; }
            .hotspot-it        { left: 84%; top: 53%; width: 22%; height: 14%; }
            .hotspot-marketing { left: 53%; top: 78%; width: 28%; height: 15%; }
        }

        .debug-box {
            position: fixed;
            left: 16px; bottom: 16px;
            z-index: 99;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            font-size: 12px;
            display: none;
        }
        .debug-on .debug-box { display: block; }

        /* saat debug ON, hotspot diberi garis bantu agar mudah dipaskan */
        .debug-on .hotspot { outline: 2px dashed rgba(255,255,255,.9); background: rgba(255,255,255,.12); }
    </style>
</head>

<body>

<div id="villagePage" class="village-page">

    <button type="button"
            class="hotspot hotspot-hc"
            onclick="pindahBooth('hc')"
            onmousemove="debugPosisi(event, 'HC')"
            aria-label="Masuk Booth HC"></button>

    <button type="button"
            class="hotspot hotspot-marketing"
            onclick="pindahBooth('marketing')"
            onmousemove="debugPosisi(event, 'Marketing')"
            aria-label="Masuk Booth Marketing"></button>

    <button type="button"
            class="hotspot hotspot-it"
            onclick="pindahBooth('it')"
            onmousemove="debugPosisi(event, 'IT')"
            aria-label="Masuk Booth IT"></button>

    <div id="debugBox" class="debug-box"></div>

</div>

<script th:inline="javascript">
    /* Ubah jadi true untuk memaskan posisi hotspot, lalu kembalikan ke false. */
    const DEBUG_MODE = false;

    /* URL booth → /booth/hc , /booth/marketing , /booth/it */
    const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";

    if (DEBUG_MODE) document.body.classList.add("debug-on");

    function pindahBooth(kodeBooth) {
        window.location.href = boothBaseUrl + kodeBooth;
    }

    function debugPosisi(event, namaBooth) {
        if (!DEBUG_MODE) return;
        const page = document.getElementById("villagePage");
        const debugBox = document.getElementById("debugBox");
        const rect = page.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        debugBox.innerHTML =
            "Booth: <b>" + namaBooth + "</b><br>" +
            "Mode: <b>" + getMode() + "</b><br>" +
            "x: <b>" + x.toFixed(1) + "%</b> | " +
            "y: <b>" + y.toFixed(1) + "%</b>";
    }

    function getMode() {
        return window.innerHeight > window.innerWidth ? "portrait / template1.png" : "landscape / template.png";
    }
</script>

</body>
</html>
