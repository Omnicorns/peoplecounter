<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sarinah Village</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #008ee8;
        }

        .village-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #008ee8;
        }

        .village-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center center;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        .debug-box {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 99;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            font-size: 12px;
            display: none;
        }

        .back-btn {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 20;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            background: rgba(0, 84, 170, 0.55);
            color: white;
            font-size: 34px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .back-btn:hover {
            background: rgba(0, 84, 170, 0.85);
        }
    </style>
</head>

<body>

<div class="village-page">



    <img
            id="villageImage"
            class="village-image"
            th:src="@{/template.png}"
            src="/template.png"
            alt="Sarinah Village"
            onclick="klikBooth(event)"
            onmousemove="ubahCursorBooth(event)"
            onmouseleave="resetCursor()"
    >

    <div id="debugBox" class="debug-box"></div>

</div>

<script th:inline="javascript">
    const DEBUG_MODE = false;

    const boothBaseUrl = /*[[@{/booth/}]]*/ "/booth/";

    /*
        Posisi area klik berdasarkan gambar landscape yang kamu pakai.

        HC        = marker ungu kiri
        Marketing = marker orange bawah tengah
        IT        = marker biru kanan

        Kalau posisi kurang pas:
        ubah angka minX, maxX, minY, maxY.
    */
    const AREA_BOOTHS = [
        {
            kode: "hc",
            nama: "HC",
            minX: 16,
            maxX: 29,
            minY: 41,
            maxY: 67
        },
        {
            kode: "marketing",
            nama: "Marketing",
            minX: 34,
            maxX: 48,
            minY: 52,
            maxY: 77
        },
        {
            kode: "it",
            nama: "IT",
            minX: 70,
            maxX: 86,
            minY: 38,
            maxY: 64
        }
    ];

    function klikBooth(event) {
        const posisi = ambilPosisiPersen(event);
        const booth = cariBooth(posisi.x, posisi.y);

        tampilkanDebug(posisi.x, posisi.y, booth);

        if (booth) {
            pindahBooth(booth.kode);
            return;
        }

        alert("Klik marker HC, IT, atau Marketing.");
    }

    function pindahBooth(kodeBooth) {
        window.location.href = boothBaseUrl + kodeBooth;
    }

    function ubahCursorBooth(event) {
        const img = event.currentTarget;
        const posisi = ambilPosisiPersen(event);
        const booth = cariBooth(posisi.x, posisi.y);

        if (booth) {
            img.style.cursor = "pointer";
            img.title = "Masuk Booth " + booth.nama;
        } else {
            img.style.cursor = "default";
            img.title = "";
        }
    }

    function resetCursor() {
        const img = document.getElementById("villageImage");
        img.style.cursor = "default";
        img.title = "";
    }

    function ambilPosisiPersen(event) {
        const img = event.currentTarget;
        const rect = img.getBoundingClientRect();

        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;

        return { x, y };
    }

    function cariBooth(x, y) {
        for (const area of AREA_BOOTHS) {
            if (
                x >= area.minX &&
                x <= area.maxX &&
                y >= area.minY &&
                y <= area.maxY
            ) {
                return area;
            }
        }

        return null;
    }

    function tampilkanDebug(x, y, booth) {
        if (!DEBUG_MODE) return;

        const debugBox = document.getElementById("debugBox");
        debugBox.style.display = "block";
        debugBox.innerHTML =
            "x: <b>" + x.toFixed(1) + "%</b> | " +
            "y: <b>" + y.toFixed(1) + "%</b><br>" +
            "Booth: <b>" + (booth ? booth.nama : "-") + "</b>";
    }
</script>

</body>
</html>
