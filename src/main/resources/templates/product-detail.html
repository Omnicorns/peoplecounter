<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PROMIS — Produk</title>

  <style>
    :root{
      --bg:#f4f6fa; --ink:#111827; --muted:#6b7280; --ring:#e5e7eb; --card:#fff;
      --pri:#2DB36D; --pri-2:#229957; --pri-3:#157248; --chip:#f1f5f9; --chip-tx:#111827;
      --shadow:0 6px 20px rgba(0,0,0,.06); --radius:14px;
    }

    body{margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

    /* APPBAR */
    .appbar{background:#0b1220;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50}
    .appbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
    .logo{width:28px;height:28px;border-radius:8px;background:#fff;color:#0b1220;display:grid;place-items:center;font-weight:900}
    .title{font-weight:800;letter-spacing:.2px}
    .flex-1{flex:1}
    .userbox{display:flex;align-items:center;gap:10px}
    .chip{background:#fff;color:#111827;border-radius:999px;padding:6px 12px;font-weight:700}
    .btn-ghost{padding:6px 12px;border:1px solid #fff;border-radius:10px;background:transparent;color:#fff;cursor:pointer}
    .btn-ghost:hover{background:rgba(255,255,255,.12)}

    /* PAGE */
    .page{max-width:1100px;margin:16px auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--ring)}
    .card-title{font-weight:800}
    .rows{padding:12px 16px}
    .row{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--ring)}
    .row:last-child{border-bottom:0}
    .k{font-size:12px;color:var(--muted);font-weight:700}
    .v{font-size:16px;font-weight:800;word-break:break-word}
    .empty{padding:16px;color:var(--muted)}

    /* SEARCH BAR */
    .search{padding:16px}
    .group{display:flex;border:1px solid var(--ring);border-radius:12px;overflow:hidden;background:#fff}
    .seg{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:1}
    .seg+ .seg{border-left:1px solid var(--ring)}
    .icon{width:18px;height:18px;opacity:.9}
    .inpt{flex:1;border:0;outline:none;background:transparent;font:14px/1.5 inherit;color:var(--ink)}
    .inpt::placeholder{color:#6b7280}
    .btn{background:var(--pri);color:#fff;font-weight:700;border:0;min-width:110px;cursor:pointer}
    .btn:hover{background:var(--pri-2)}

    /* CHIPS */
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip-p{background:#dcfce7;border:1px solid #86efac;color:#065f46;padding:6px 10px;border-radius:999px;font-weight:700}

    /* TABLE */
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:10px;border-bottom:1px solid var(--ring);text-align:left}
    th{font-size:12px;color:var(--muted);font-weight:700}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    tbody tr:hover{background:#f9fafb}

    /* HISTORY */
    .hist-grid{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center}
    .hist-main{background:#f9fafb;border:1px solid var(--ring);border-radius:12px;padding:10px 12px}
    .hist-title{font-weight:800}
    .hist-sub{color:#64748b;font-size:12px}
    .btn-sm{padding:8px 12px;background:var(--pri);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
    .btn-sm:hover{background:var(--pri-2)}
    @media (max-width:640px){.row{grid-template-columns:1fr}.hist-grid{grid-template-columns:1fr}.btn{width:100%}}
  </style>
</head>
<body>

<!-- APPBAR -->
<header class="appbar">
  <div class="appbar-inner">
    <div class="logo">P</div>
    <div class="title">PROMIS</div>
    <div class="flex-1"></div>
    <div class="userbox" th:if="${session.AUTH_USERNAME != null}">
      <span class="chip" th:text="${session.AUTH_USERNAME}">john</span>
      <form th:action="@{/web/logout}" method="post">
        <button type="submit" class="btn-ghost">Logout</button>
      </form>
    </div>
    <div class="userbox" th:if="${session.AUTH_USERNAME == null}">
      <a class="btn-ghost" th:href="@{/web/login}">Login</a>
    </div>
  </div>
</header>

<main class="page">

  <!-- SEARCH -->
  <section class="card">
    <div class="card-h"><div class="card-title">Cari Produk</div></div>
    <div class="search">
      <form class="group" th:action="@{/web/product}" method="get">
        <div class="seg">
          <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h2v14H3zm4 0h2v14H7zm4 0h2v14h-2zM3 3h18v2H3zm0 16h18v2H3z"/></svg>
          <input class="inpt" type="text" name="sku" th:value="${qSku}" placeholder="Masukkan SKU (mis. ank0002721)">
        </div>
        <div class="seg">
          <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M4 7h2v10H4zm3 0h1v10H7zm3 0h2v10h-2zm4 0h1v10h-1zm3 0h2v10h-2z"/></svg>
          <input class="inpt" type="text" name="code" th:value="${qCode}" placeholder="Atau Barcode (opsional)">
        </div>
        <button class="btn" type="submit">Tampilkan</button>
      </form>
    </div>
  </section>

  <!-- DETAIL -->
  <section class="card" th:if="${sku != null}">
    <div class="card-h"><div class="card-title">Detail Produk</div></div>
    <div class="rows">
      <div class="row"><div class="k">Nama Produk</div><div class="v" th:text="${name}">-</div></div>
      <div class="row"><div class="k">SKU</div><div class="v" th:text="${sku}">-</div></div>
      <div class="row"><div class="k">Promo</div>
        <div><span class="chip-p" th:if="${promo != null}" th:text="${promo}">-</span></div>
      </div>
    </div>
  </section>

  <!-- STOK -->
  <section class="card" th:if="${sku != null}">
    <div class="card-h"><div class="card-title">Stok & Harga per Lokasi</div></div>
    <div class="rows" th:if="${stocks == null or #lists.isEmpty(stocks)}"><div class="empty">Tidak ada data stok/harga.</div></div>
    <div class="rows" th:if="${stocks != null and !#lists.isEmpty(stocks)}">
      <table>
        <thead><tr><th>Lokasi</th><th style="text-align:right">Stok</th><th style="text-align:right">Harga</th></tr></thead>
        <tbody>
        <tr th:each="r : ${stocks}">
          <td th:text="${r.location}">-</td>
          <td class="num" th:text="${r.stock}">0</td>
          <td class="num" th:text="${'Rp ' + #numbers.formatDecimal(r.price,0,'POINT',0,'COMMA')}">Rp 0</td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="card">
    <div class="card-h"><div class="card-title">Riwayat SKU</div></div>
    <div class="rows" th:if="${history == null or #lists.isEmpty(history)}"><div class="empty">Belum ada riwayat.</div></div>
    <div class="rows" th:if="${history != null and !#lists.isEmpty(history)}">
      <div class="hist-grid" th:each="h : ${history}">
        <div class="hist-main">
          <div class="hist-title" th:text="${h['name'] != null ? h['name'] : h['sku']}">Nama produk</div>
          <div class="hist-sub">SKU: <span th:text="${h['sku']}">FN001</span></div>
        </div>
        <div class="hist-actions"><a class="btn-sm" th:href="@{/web/product(sku=${h['sku']})}">Pakai</a></div>
      </div>
    </div>
  </section>

</main>
</body>
</html>
