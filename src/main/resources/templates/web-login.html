<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROMIS — Login</title>

    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{
          --bg:#f8fafc; --surface:#ffffff; --ink:#0f172a; --muted:#475569;
          --ring:#e5e7eb; --brand:#0b1220; --pri:#2563eb; --pri-2:#1d4ed8;
          --danger:#ef4444; --ok:#16a34a;
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0; background:var(--bg); color:var(--ink); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}

        header.appbar{position:sticky; top:0; background:var(--brand); color:#fff; padding:12px 20px; z-index:10}
        .brand{display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.5px}
        .brand-logo{width:28px; height:28px; background:#fff; border-radius:6px; display:grid; place-items:center; font-size:14px; color:var(--brand); font-weight:800}
        .brand-text{font-size:16px}

        main{display:grid; place-items:center; min-height:calc(100vh - 56px); padding:24px}
        .card{
          width:100%; max-width:420px; background:var(--surface); border:1px solid var(--ring);
          border-radius:14px; padding:24px; box-shadow:0 6px 30px rgba(2,6,23,.06);
        }
        h1{margin:0 0 4px; font-size:20px}
        p.subtitle{margin:0 0 16px; color:var(--muted); font-size:13px}

        .field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
        .label{font-size:12px; color:#334155; font-weight:600}
        .input{
          width:100%; padding:10px 12px; border:1px solid var(--ring); border-radius:10px;
          background:#fff; color:var(--ink); outline:none; font-size:14px;
        }
        .input:focus{border-color:var(--pri); box-shadow:0 0 0 3px rgba(37,99,235,.15)}

        .actions{margin-top:14px; display:flex; gap:10px; align-items:center}
        .btn{
          appearance:none; border:0; background:var(--pri); color:#fff; padding:10px 14px;
          border-radius:10px; font-weight:700; cursor:pointer; width:100%;
        }
        .btn:hover{background:var(--pri-2)}
        .hint{font-size:12px; color:var(--muted); margin-top:8px}

        .alert{
          border:1px solid var(--danger); color:#991b1b; background:#fff1f2;
          padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:12px;
        }
        .ok{
          border:1px solid var(--ok); color:#065f46; background:#ecfdf5;
          padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:12px;
        }

        footer{margin-top:16px; text-align:center; color:#94a3b8; font-size:12px}
        a{text-decoration:none; color:inherit}
    </style>
</head>
<body>
<header class="appbar">
    <div class="brand">
        <!-- Logo PROMIS: kotak kecil putih + teks — ganti sesuai asetmu -->
        <div class="brand-logo">P</div>
        <div class="brand-text">PROMIS</div>
    </div>
</header>

<main>
    <div class="card">
        <h1>Masuk</h1>
        <p class="subtitle">Gunakan akun PROMIS Anda</p>

        <!-- Error dari controller -->
        <div th:if="${error}" class="alert" th:text="${error}">Terjadi kesalahan</div>
        <!-- Pesan OK opsional: ?ok=logout atau sejenisnya, jika mau -->
        <div th:if="${param.ok}" class="ok" th:text="${param.ok}">Berhasil</div>

        <form th:action="@{/web/login}" method="post" autocomplete="off">
            <!-- Penting untuk CSRF (jika Spring Security aktif) -->

            <!-- Redirect target (opsional) -->


            <div class="field">
                <label class="label" for="usernameOrEmail">Username / Email</label>
                <input class="input" id="usernameOrEmail" name="usernameOrEmail" type="text" placeholder="mis. jdoe atau jdoe@domain.com" autofocus required />
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password" placeholder="••••••••" required />
            </div>

            <div class="actions">
                <button class="btn" type="submit">Masuk</button>
            </div>

            <div class="hint">Dengan masuk, Anda menyetujui ketentuan berlaku.</div>
        </form>

        <footer>© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> PROMIS</footer>
    </div>
</main>
</body>
</html>
