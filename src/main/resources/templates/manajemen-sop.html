<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>PROMIS — Manajemen SOP</title>

    <!-- inject dari controller -->
    <meta name="api-base" th:content="${apiBase}" content="/api">
    <meta name="x-api-key" th:content="${apiKey}"  content="">
    <!-- optional: kirimkan username ke watermark preview -->
    <meta name="auth-user" th:if="${session.AUTH_USERNAME != null}" th:content="${session.AUTH_USERNAME}" content="User"/>

    <!-- Bootstrap & PDF.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
          --bg:#f5f7fb; --panel:#fff; --ink:#0f172a; --muted:#64748b; --ring:#e6ebf2;
          --brand:#0b1322; --brand2:#101a2f; --warn:#f59e0b; --arch:#cbd5e1; --pub:#2563eb;
          --shadow:0 10px 28px rgba(2,6,23,.08); --r:20px;
          --safe-top: env(safe-area-inset-top, 0px);
          --safe-right: env(safe-area-inset-right, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-left: env(safe-area-inset-left, 0px);
          --pri:#2DB36D; /* warna tab aktif seperti gambar 2 */
          --appbarH:56px;
        }
        *{box-sizing:border-box}
        html,body{margin:0;background:var(--bg);color:var(--ink);
          font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

        /* Appbar */
        .appbar{
          position:sticky;top:0;z-index:60;
          background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;
          border-bottom:1px solid rgba(255,255,255,.08);
          padding-top:calc(6px + var(--safe-top));
        }
        .brand{display:flex;align-items:center;gap:10px;font-weight:800}
        .brand img{width:28px;height:28px;border-radius:10px;background:#fff}
        .pill{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:800}
        .pill.active{background:#1a2337}
        .chip{background:#fff;color:#0f172a;border-radius:999px;padding:.45rem .8rem;font-weight:800}
        .btn-ghost{padding:.45rem .8rem;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:transparent;color:#fff;cursor:pointer}
        .btn-ghost:hover{background:rgba(255,255,255,.1)}

        /* Cards */
        .cardx{background:#fff;border:1px solid var(--ring);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
        .cardx .top{display:flex;align-items:center;gap:8px}
        .cardx .top h3{margin:0;font-size:18px;line-height:1.2;word-break:break-word}
        .badgex{margin-left:auto;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;color:#fff}
        .Published{background:var(--pub)}
        .Draft{background:var(--warn);color:#111827}
        .Archived{background:var(--arch);color:#111827}
        .meta{color:#94a3b8;font-weight:700;margin:6px 0 8px}
        .chips{display:flex;gap:8px;flex-wrap:wrap}
        .chipx{background:#eef2ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px}
        .chipx.owner{background:#dfeaff;color:#1e40af}
        .chipx.ghost{background:#f1f5f9;color:#0f172a}
        .hr{height:1px;background:var(--ring);margin:10px 0;border:0}
        .file{display:flex;align-items:center;gap:8px;font-weight:700;word-break:break-word}
        .file .size{color:#94a3b8;margin-left:6px;font-weight:600}
        .btnx{padding:8px 12px;border-radius:12px;border:1px solid var(--ring);background:#fff;color:#000;font-weight:800;cursor:pointer}
        .btnx:hover{background:#f8fafc}
        .btnx[disabled]{opacity:.6;cursor:not-allowed}

        /* Preview overlay */
        .spv{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.68);backdrop-filter:blur(1.5px)}
        .spv.show{display:flex}
        .spv-backdrop{position:absolute;inset:0}
        .spv-box{
          position:relative;background:#0b1220;border:1px solid #1e2a44;border-radius:14px;
          width:min(96vw, 1000px); max-height:92dvh; padding:12px; box-shadow:0 12px 32px rgba(0,0,0,.45);
          display:flex; flex-direction:column;
        }
        .spv-head{display:flex;align-items:center;gap:10px;color:#e5edff;padding:6px 8px;border-bottom:1px solid #1e2a44}
        .spv-head .sp{flex:1}
        .spv-pages{flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; align-items:center; gap:12px}
        .spv-pages canvas{background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);width:100%;max-width:100%;height:auto}
        .spv-x{
          position:absolute;
          top:calc(10px + var(--safe-top));
          right:calc(10px + var(--safe-right));
          width:36px;height:36px;border-radius:10px;
          border:1px solid #24304c;background:#121b31;color:#e5edff;font-weight:800;line-height:34px;text-align:center;cursor:pointer;
        }

        /* ===== MOBILE SWITCHER ===== */
        .mobile-switch-wrap{display:block;background:#fff;border-bottom:1px solid var(--ring)}
        @media (min-width:720px){.mobile-switch-wrap{display:none}}
        .mobile-switch{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:8px}
        .segbtn{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid var(--ring);background:#fff;color:#0b1220;border-radius:999px;font-weight:800;text-align:center;cursor:pointer;user-select:none;text-decoration:none}
        .segbtn:hover{filter:brightness(1.02)}
        .segbtn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
        @media (max-width:720px){.mobile-switch-wrap.sticky{position:sticky;top:var(--appbarH);z-index:45}}
    </style>
</head>
<body oncontextmenu="return false">

<!-- APPBAR -->
<header class="appbar">
    <div class="container py-2">
        <div class="d-flex align-items-center gap-3 flex-nowrap">
            <div class="brand"><img src="/promis.png" alt="PROMIS"><span>PROMIS</span></div>
            <nav class="d-none d-md-flex gap-2 ms-2" aria-label="Primary">
                <a class="pill" th:href="@{/web/product}">Produk</a>
                <a class="pill" th:href="@{/web/home}">Home</a>
                <span class="pill active">Manajemen SOP</span>
            </nav>
            <div class="ms-auto d-flex align-items-center gap-2">
                <div class="d-flex align-items-center gap-2" th:if="${session.AUTH_USERNAME != null}">
                    <span class="chip" th:text="${session.AUTH_USERNAME}">aloy</span>
                    <form th:action="@{/web/logout}" method="post" data-loading class="m-0">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-ghost">Logout</button>
                    </form>
                </div>
                <div th:if="${session.AUTH_USERNAME == null}">
                    <a class="btn-ghost" th:href="@{/web/login}">Login</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- MOBILE SWITCHER (aktif otomatis seperti gambar 2) -->
<nav class="mobile-switch-wrap sticky" aria-label="Navigasi utama">
    <div class="mobile-switch" role="tablist" id="mobTabs">
        <a class="segbtn" href="/web/home"    data-route="/web/home"    role="tab" aria-selected="false">Home</a>
        <a class="segbtn" href="/web/product" data-route="/web/product" role="tab" aria-selected="false">Produk</a>
        <a class="segbtn" href="/web/sop"     data-route="/web/sop"     role="tab" aria-selected="false">SOP</a>
    </div>
</nav>

<main class="container my-3">
    <h1 class="h4 fw-bold mb-3">Daftar SOP</h1>

    <!-- Toolbar -->
    <div class="row g-2">
        <div class="col-12">
            <div class="d-flex align-items-center gap-2 px-3 py-2 bg-white border rounded-4 shadow-sm">
                <input id="q" class="form-control border-0" placeholder="Cari judul/kode…">
            </div>
        </div>
        <div class="col-6 col-md-auto" style="min-width:160px">
            <select id="fOwner" class="form-select rounded-4 shadow-sm"><option value="">Semua Owner</option></select>
        </div>
        <div class="col-6 col-md-auto" style="min-width:160px">
            <select id="fTag" class="form-select rounded-4 shadow-sm"><option value="">Semua Tag</option></select>
        </div>
        <div class="col-12 col-md-auto" style="min-width:160px">
            <select id="fSort" class="form-select rounded-4 shadow-sm">
                <option selected>Terbaru</option><option>Terlama</option><option>A-Z</option><option>Z-A</option>
            </select>
        </div>
    </div>

    <!-- Cards -->
    <section id="cards" class="row row-cols-1 row-cols-md-2 g-3 mt-2" aria-live="polite"></section>

    <!-- Pager -->
    <div class="d-flex flex-wrap gap-2 justify-content-end align-items-center my-3">
        <small id="pgInfo" class="text-secondary">0–0 dari 0</small>
        <select id="pgSize" class="form-select form-select-sm" style="width:80px">
            <option>6</option><option selected>10</option><option>20</option>
        </select>
        <button id="pgPrev" class="btn btn-sm btn-light">Prev</button>
        <span id="pgPage" class="text-secondary">1 / 1</span>
        <button id="pgNext" class="btn btn-sm btn-light">Next</button>
    </div>
</main>

<!-- PREVIEW -->
<div id="spv" class="spv" role="dialog" aria-modal="true" aria-label="Pratinjau PDF">
    <div class="spv-backdrop" id="spvBackdrop"></div>
    <div class="spv-box" role="document" aria-labelledby="spvTitle">
        <div class="spv-x" id="spvX" aria-label="Tutup">✕</div>
        <div class="spv-head">
            <strong id="spvTitle">Pratinjau</strong>
            <div class="sp"></div>
        </div>
        <div class="spv-pages" id="spvPages"></div>
    </div>
</div>

<script>
    // ====== Config
    const API_BASE=(document.querySelector('meta[name="api-base"]')?.content||'/api').replace(/\/+$/,'');
    const API_KEY =document.querySelector('meta[name="x-api-key"]')?.content?.trim()||'';
    const j=async (url,opt={})=>{
      const h=Object.assign({},opt.headers||{}); if(API_KEY)h['x-api-key']=API_KEY;
      const r=await fetch(url,{...opt,headers:h}); if(!r.ok) throw new Error(await r.text().catch(()=>r.statusText));
      const ct=r.headers.get('content-type')||''; return ct.includes('application/json')? r.json(): r.text();
    };
    const $=s=>document.querySelector(s);

    // ====== State
    const state={all:[],view:[],q:'',owner:'',tag:'',sort:'Terbaru',page:1,pageSize:10};

    // ====== Utils
    const fmtDate=s=>{ if(!s)return'-'; const d=new Date(s);
      return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}).replace('.','');
    };
    const chip=(t,cls='')=>`<span class="chipx ${cls}">${t}</span>`;
    const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));

    function parseQuery(q){
      const tokens=(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
      const cond={text:[],owner:[],tags:[]};
      for(const t of tokens){
        if(t.startsWith('owner:'))cond.owner.push(t.slice(6));
        else if(t.startsWith('tag:'))cond.tags.push(t.slice(4));
        else if(t.startsWith('#'))cond.tags.push(t.slice(1));
        else cond.text.push(t);
      }
      return cond;
    }

    function applyFilter(){
      const {text,owner:qo,tags:qt}=parseQuery(state.q);
      let arr=state.all.filter(x=>{
        const base=`${x.code||''} ${x.title||''} ${x.owner||''} ${(x.tags||[]).join(' ')} ${(x.categories||[]).join(' ')}`.toLowerCase();
        const hitText=!text.length||text.every(t=>base.includes(t));
        const hitOwner1=!state.owner||String(x.owner||'').toLowerCase()===state.owner.toLowerCase();
        const hitTag1=!state.tag||(Array.isArray(x.tags)&&x.tags.map(t=>String(t).toLowerCase()).includes(state.tag.toLowerCase()));
        const hitOwner2=!qo.length||qo.some(v=>String(x.owner||'').toLowerCase().includes(v));
        const hitTag2=!qt.length||(Array.isArray(x.tags)&&qt.every(v=>x.tags.map(t=>String(t).toLowerCase()).includes(v)));
        return hitText&&hitOwner1&&hitTag1&&hitOwner2&&hitTag2;
      });
      const s=state.sort;
      arr.sort((a,b)=>{
        if(s==='Terbaru') return new Date(b.effective||b.createdAt||0)-new Date(a.effective||a.createdAt||0);
        if(s==='Terlama') return new Date(a.effective||a.createdAt||0)-new Date(b.effective||b.createdAt||0);
        if(s==='A-Z') return String(a.title||'').localeCompare(String(b.title||''));
        if(s==='Z-A') return String(b.title||'').localeCompare(String(a.title||''));
        return 0;
      });
      state.view=arr;
    }

    // ====== PREVIEW (multi-page)
    const spv=$('#spv'), spvPages=$('#spvPages'), spvTitle=$('#spvTitle');
    const spvBackdrop=$('#spvBackdrop'), spvX=$('#spvX');
    let spvOpen=false;
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    (function injectProtectionCSS(){
      try{
        const st=document.createElement('style');
        st.textContent = `
          @media print{ body{ display:none !important; } }
          body, #spv{ -webkit-user-select:none; user-select:none; }
          canvas, img{ -webkit-user-drag:none; }
        `;
        document.head.appendChild(st);
      }catch(_){}
    })();

    const AUTH_USER = (document.querySelector('meta[name="auth-user"]')?.content || window.AUTH_USER || 'User').toString().trim();

    function lockScroll(on){ document.body.style.overflow = on ? 'hidden' : ''; }

    function drawWatermark(ctx, w, h, text){
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.translate(w/2, h/2);
      ctx.rotate(-Math.PI/6);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.floor(Math.min(w,h)/10)}px Inter, Arial, sans-serif`;
      ctx.fillStyle = '#000';
      ctx.fillText(text, 0, 0);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.font = `600 ${Math.floor(Math.min(w,h)/22)}px Inter, Arial, sans-serif`;
      ctx.fillStyle = '#000';
      const step = Math.floor(Math.min(w,h)/2.5);
      for(let y = step/2; y < h+step; y += step){
        for(let x = step/2; x < w+step; x += step){
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(-Math.PI/6);
          ctx.fillText(text, 0, 0);
          ctx.restore();
        }
      }
      ctx.restore();
    }

    async function openSimplePreviewById(docId, fileId, fileName){
      try{
        const lower=String(fileName||'').toLowerCase();
        if(!lower.endsWith('.pdf')){ alert('Pratinjau hanya untuk PDF.'); return; }
        const url=`${API_BASE}/sop/${docId}/files/${fileId}`;
        const r=await fetch(url,{headers:API_KEY?{'x-api-key':API_KEY}:{}, cache:'no-store'});
        if(!r.ok) throw new Error(await r.text());
        const buf=await r.arrayBuffer();
        await showPdfAll(buf, fileName||'Dokumen');
      }catch(e){ alert(e.message||'Gagal membuka pratinjau'); }
    }

    async function showPdfAll(arrayBuffer, name){
      spvTitle.textContent=name||'Pratinjau';
      spv.classList.add('show'); spvOpen=true; lockScroll(true);
      spvPages.innerHTML='';

      const loadingTask=pdfjsLib.getDocument({data:arrayBuffer, disableCreateObjectURL:true});
      const pdf=await loadingTask.promise;

      const pixelRatio=Math.min(window.devicePixelRatio||1,2);
      const containerWidth=Math.floor(spvPages.getBoundingClientRect().width);

      const wmUser = AUTH_USER || 'User';
      const wmTime = new Date().toLocaleString();
      const wmText = `${wmUser} • ${wmTime} • CONFIDENTIAL`;

      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const base=page.getViewport({scale:1});
        const scale=containerWidth/base.width;
        const viewport=page.getViewport({scale});
        const canvas=document.createElement('canvas');
        canvas.setAttribute('aria-label',`Halaman ${p}`);
        const ctx=canvas.getContext('2d',{alpha:false});
        canvas.width=Math.floor(viewport.width*pixelRatio);
        canvas.height=Math.floor(viewport.height*pixelRatio);
        canvas.style.width=`${Math.floor(viewport.width)}px`;
        canvas.style.height=`${Math.floor(viewport.height)}px`;
        ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
        spvPages.appendChild(canvas);

        await page.render({canvasContext:ctx, viewport}).promise;

        const logicalW = canvas.width / pixelRatio;
        const logicalH = canvas.height / pixelRatio;
        drawWatermark(ctx, logicalW, logicalH, wmText);
      }
    }

    function closePreview(){
      if(!spvOpen) return;
      spv.classList.remove('show'); spvOpen=false; lockScroll(false);
      spvPages.innerHTML='';
    }
    spvBackdrop.addEventListener('click', closePreview);
    spvX.addEventListener('click', closePreview);
    window.addEventListener('keydown', e=>{ if(e.key==='Escape') closePreview(); });
    window.addEventListener('orientationchange', ()=>{ if(spvOpen) closePreview(); });
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden && spvOpen) closePreview(); }, true);
    window.addEventListener('contextmenu', e=>e.preventDefault(), true);

    // ====== Render cards
    function render(){
      const cards=$('#cards'); cards.innerHTML='';
      const total=state.view.length;
      const pages=Math.max(1,Math.ceil(total/state.pageSize));
      if(state.page>pages) state.page=pages;
      const start=(state.page-1)*state.pageSize, end=Math.min(start+state.pageSize,total);

      if(!total){
        cards.innerHTML=`<div class="col"><div class="cardx text-center p-4">
          <div class="mb-2">📄</div><div><b>Tidak ada data</b><br><small class="text-secondary">Coba ubah pencarian/fitur filter.</small></div>
        </div></div>`;
      }else{
        state.view.slice(start,end).forEach(s=>{
          const tg=(s.tags||[]).map(t=>chip(t,'ghost')).join('');
          const cat=(s.categories||[]).map(c=>chip(c)).join('');
          const own=s.owner?chip('By '+s.owner,'owner'):'';
          const filesArr=Array.isArray(s.files)?s.files:[];
          const filesHtml=filesArr.map(f=>{
            const safe=(f.fileName||'file')
              .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
            const sz=f.size?(f.size>=1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(1)+' KB'):'';
            return `<div class="file"><span>${safe}</span> <span class="size">• ${sz}</span></div>`;
          }).join('') || '<div class="meta">Tidak ada file</div>';

          const firstPdf=filesArr.find(ff=>/\.pdf$/i.test(ff?.fileName||''));
          const previewDisabled = firstPdf ? '' : 'disabled';

          const col=document.createElement('div');
          col.className='col';
          col.innerHTML=`
            <article class="cardx">
              <div class="top">
                <h3 class="flex-grow-1">${s.title||'-'}</h3>
                <span class="badgex ${s.status||'Draft'}">${(s.status||'Draft')}</span>
              </div>
              <div class="meta">${s.code||'-'} • v${s.version||'1.0'}</div>
              <div class="chips">${own} ${cat} ${tg}</div>
              <hr class="hr">
              ${filesHtml}
              <div class="d-flex gap-2 mt-2">
                <button class="btnx" ${previewDisabled}
                  onclick="openSimplePreviewById(${s.id}, ${firstPdf? firstPdf.id : 'null'}, '${(firstPdf? (firstPdf.fileName||'').replace(/['\"<>&]/g,s=>({'\'':'&#39;','\"':'&quot;','<':'&lt;','&':'&amp;','>':'&gt;'}[s])) : '')}')">
                  Preview
                </button>
              </div>
              <div class="meta mt-2">Berlaku: ${fmtDate(s.effective)}</div>
            </article>`;
          cards.appendChild(col);
        });
      }

      $('#pgInfo').textContent = total ? `${start+1}–${end} dari ${total}` : '0–0 dari 0';
      $('#pgPage').textContent = `${state.page} / ${pages}`;
      $('#pgPrev').disabled = state.page<=1;
      $('#pgNext').disabled = state.page>=pages;
    }

    // ====== Populate & Load
    function populateFilters(){
      const owners=uniq(state.all.map(x=>x.owner));
      const tags=uniq(state.all.flatMap(x=>Array.isArray(x.tags)?x.tags:[]));
      const fOwner=$('#fOwner'), fTag=$('#fTag');
      fOwner.length=1; fTag.length=1;
      owners.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; fOwner.appendChild(op); });
      tags.forEach(t=>{ const op=document.createElement('option'); op.value=t; op.textContent=t; fTag.appendChild(op); });
      if(!owners.includes(state.owner)) state.owner='', fOwner.value='';
      if(!tags.includes(state.tag)) state.tag='', fTag.value='';
    }
    async function load(){
      try{
        const qs=new URLSearchParams(); if(state.q)qs.set('query',state.q);
        const data=await j(`${API_BASE}/sop?${qs.toString()}`);
        state.all=Array.isArray(data.items)?data.items:[];
      }catch(e){ console.warn('API error:',e); state.all=[]; }
      populateFilters(); state.page=1; applyFilter(); render();
    }

    // ====== Events
    let t=null;
    $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=(e.target.value||'').trim(); load(); },180); });
    $('#fOwner').addEventListener('change',e=>{ state.owner=e.target.value||''; applyFilter(); state.page=1; render(); });
    $('#fTag').addEventListener('change',e=>{ state.tag=e.target.value||''; applyFilter(); state.page=1; render(); });
    $('#fSort').addEventListener('change',e=>{ state.sort=e.target.value; applyFilter(); state.page=1; render(); });
    $('#pgPrev').onclick=()=>{ if(state.page>1){ state.page--; render(); } };
    $('#pgNext').onclick=()=>{ const pages=Math.max(1,Math.ceil(state.view.length/state.pageSize)); if(state.page<pages){ state.page++; render(); } };
    $('#pgSize').onchange=e=>{ state.pageSize=parseInt(e.target.value,10)||10; state.page=1; render(); };

    window.addEventListener('keydown', e=>{
      const k=e.key.toLowerCase();
      if((e.ctrlKey||e.metaKey)&&(k==='p'||k==='s')){ e.preventDefault(); e.stopPropagation(); }
      if(e.key==='Escape') closePreview();
    }, true);

    // === Mobile switcher: set tab aktif sesuai path (seperti gambar 2)
    (function setActiveMobileTab(){
      try{
        const tabs = document.querySelectorAll('#mobTabs .segbtn');
        const norm = (p)=>{
          if(!p) return '/web/home';
          const n = p.replace(/\/+$/,'');
          return (n==='/web'||n==='/web/') ? '/web/home' : n;
        };
        const current = norm(location.pathname);

        let found=false;
        tabs.forEach(a=>{
          const r = norm(a.getAttribute('data-route')||a.getAttribute('href')||'');
          const isActive = current.startsWith(r);
          a.classList.toggle('active', isActive);
          a.setAttribute('aria-selected', isActive ? 'true' : 'false');
          if(isActive) found=true;
        });
        if(!found){
          const home = document.querySelector('#mobTabs .segbtn[data-route="/web/home"]');
          if(home){ home.classList.add('active'); home.setAttribute('aria-selected','true'); }
        }
      }catch(_){}
    })();

    // load awal
    load();
</script>
</body>
</html>
