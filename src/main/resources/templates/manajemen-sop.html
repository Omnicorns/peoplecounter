<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>PROMIS — Manajemen SOP</title>

    <!-- inject dari controller -->
    <meta name="api-base" th:content="${apiBase}" content="/api">
    <meta name="x-api-key" th:content="${apiKey}"  content="">
    <!-- optional: kirimkan username ke watermark preview -->
    <meta name="auth-user" th:if="${session.AUTH_USERNAME != null}" th:content="${session.AUTH_USERNAME}" content="User"/>

    <!-- Bootstrap & PDF.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#f5f7fb;--ink:#0b1220;--muted:#667085;--ring:#e6e8ee;--card:#ffffff;--pri:#2DB36D;--pri-2:#229957;--pri-3:#157248;--chip:#eef2f6;--chip-tx:#0b1220;--surface:#0b1220;--shadow:0 10px 30px rgba(17,24,39,.08);--radius:16px;--table-stripe:#fafbfc;--ok-bg:#dcfce7;--ok-br:#86efac;--ok-tx:#065f46;--ring-focus:0 0 0 3px rgba(45,179,109,.25)}

 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
 a{color:inherit;text-decoration:none} button,input,select{font:inherit}


 /* Appbar */
.appbar{position:sticky;top:0;z-index:50;color:#fff;background:linear-gradient(180deg,#0b1220 0%,#101a32 100%);border-bottom:1px solid rgba(255,255,255,.06)}
 .appbar-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
 .logo{width:32px;height:32px;border-radius:10px;background:#fff;color:#0b1220;display:grid;place-items:center;font-weight:900;box-shadow:0 4px 14px rgba(255,255,255,.15) inset,0 8px 20px rgba(0,0,0,.25)}
 .brand{display:flex;align-items:center;gap:10px}.title{font-weight:800;letter-spacing:.2px}
 .brand-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-weight:700}
 .flex-1{flex:1}.userbox{display:flex;align-items:center;gap:10px}
 .chip{background:#fff;color:#111827;border-radius:999px;padding:6px 12px;font-weight:700}
 .btn-ghost{padding:8px 12px;border:1px solid rgba(255,255,255,.6);border-radius:12px;background:transparent;color:#fff;cursor:pointer}
 .btn-ghost:hover{background:rgba(255,255,255,.12)} .btn-ghost:focus{outline:none;box-shadow:var(--ring-focus)}

 /* Cards */
 .cardx{background:#fff;border:1px solid var(--ring);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
 .cardx .top{display:flex;align-items:center;gap:8px}
 .cardx .top h3{margin:0;font-size:18px;line-height:1.2;word-break:break-word}
 .badgex{margin-left:auto;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;color:#fff}
 .Published{background:var(--pub)}
 .Draft{background:var(--warn);color:#111827}
 .Archived{background:var(--arch);color:#111827}
 .meta{color:#94a3b8;font-weight:700;margin:6px 0 8px}
 .chips{display:flex;gap:8px;flex-wrap:wrap}
 .chipx{background:#eef2ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px}
 .chipx.owner{background:#dfeaff;color:#1e40af}
 .chipx.ghost{background:#f1f5f9;color:#0f172a}
 .hr{height:1px;background:var(--ring);margin:10px 0;border:0}
 .file{display:flex;align-items:center;gap:8px;font-weight:700;word-break:break-word}
 .file .size{color:#94a3b8;margin-left:6px;font-weight:600}
 .btnx{padding:8px 12px;border-radius:12px;border:1px solid var(--ring);background:#fff;color:#000;font-weight:800;cursor:pointer}
 .btnx:hover{background:#f8fafc}
 .btnx[disabled]{opacity:.6;cursor:not-allowed}

 /* Preview overlay */
 .spv{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.68);backdrop-filter:blur(1.5px)}
 .spv.show{display:flex}
 .spv-backdrop{position:absolute;inset:0}
 .spv-box{
   position:relative;background:#0b1220;border:1px solid #1e2a44;border-radius:14px;
   width:min(96vw, 1000px); max-height:92dvh; padding:12px; box-shadow:0 12px 32px rgba(0,0,0,.45);
   display:flex; flex-direction:column;
 }
 .spv-head{display:flex;align-items:center;gap:10px;color:#e5edff;padding:6px 8px;border-bottom:1px solid #1e2a44;flex-wrap:wrap}
 .spv-head .sp{flex:1}
 .spv-pages{flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; align-items:center; gap:12px}
 .spv-x{
   position:absolute;
   top:calc(10px + var(--safe-top));
   right:calc(10px + var(--safe-right));
   width:36px;height:36px;border-radius:10px;
   border:1px solid #24304c;background:#121b31;color:#e5edff;font-weight:800;line-height:34px;text-align:center;cursor:pointer;
 }

 /* PAGE + HIGHLIGHT LAYERS */
 .spv-page{position:relative;width:100%;max-width:100%}
 .spv-page canvas{display:block;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);width:100%;height:auto}
 .hl-layer{position:absolute;inset:0;pointer-events:none;border-radius:8px;overflow:hidden}
 .hl{position:absolute;background:rgba(255,230,0,.35);outline:1px solid rgba(180,140,0,.6);border-radius:2px}
 .hl.active{background:rgba(255,230,0,.6);outline-color:#b38a00}

 /* ===== MOBILE SWITCHER ===== */
 .mobile-switch-wrap{display:block;background:#fff;border-bottom:1px solid var(--ring)}
 @media (min-width:720px){.mobile-switch-wrap{display:none}}
 .mobile-switch{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:8px}
 .segbtn{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid var(--ring);background:#fff;color:#0b1220;border-radius:999px;font-weight:800;text-align:center;cursor:pointer;user-select:none;text-decoration:none}
 .segbtn:hover{filter:brightness(1.02)}
 .segbtn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
 @media (max-width:720px){.mobile-switch-wrap.sticky{position:sticky;top:var(--appbarH);z-index:45}}

 /* Find bar */
 .findbar{display:flex;gap:8px;align-items:center}
 .findbar input{background:#0f172a;border:1px solid #24304c;color:#e5edff;border-radius:10px;padding:.45rem .6rem;min-width:180px}
 .findbar button{background:#16223a;border:1px solid #24304c;color:#e5edff;border-radius:10px;padding:.45rem .6rem;cursor:pointer}
 .findbar small{opacity:.8}

 .appbar{ position: sticky; top: 0; z-index: 50; color:#fff; background: linear-gradient(180deg,#0b1220 0%,#101a32 100%); border-bottom:1px solid rgba(255,255,255,.06); }
 .appbar-inner{ max-width:1100px; margin:0 auto; padding: calc(10px + env(safe-area-inset-top,0px)) 16px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
 .brand{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; }
 .logo{ width: clamp(24px, 6vw, 32px); height: clamp(24px, 6vw, 32px); border-radius:10px; background:#fff; color:#0b1220; display:grid; place-items:center; font-weight:900; }
 .title{ font-weight:800; font-size:clamp(14px,2.8vw,18px); letter-spacing:.2px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .brand-chip{ display:none; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); font-weight:700; white-space:nowrap; }
 @media (min-width:480px){ .brand-chip{ display:inline-flex; } }
 @media (max-width:640px){ .brand-chip + .brand-chip{ display:none; } }
 .flex-1{ flex:0 0 auto; display:none; }
 .userbox{ display:flex; align-items:center; gap:10px; margin-left:auto; flex:0 0 auto; min-width:0; }
 .userbox .chip{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .btn-ghost{ padding:8px 12px; border:1px solid rgba(255,255,255,.6); border-radius:12px; background:transparent; color:#fff; cursor:pointer; }
 .btn-ghost:hover{ background:rgba(255,255,255,.12); }
 @media (max-width:360px){ .appbar-inner{ padding: calc(8px + env(safe-area-inset-top,0px)) 12px 8px; gap:8px; } .btn-ghost{ padding:6px 10px; } }
    </style>
</head>
<body oncontextmenu="return false">

<!-- APPBAR -->
<header class="appbar">
    <div class="appbar-inner">
        <div class="brand">
            <img class="logo" src="/promis.png" alt="PROMIS" width="96" height="96">
            <div class="title">PROMIS</div>
            <a class="brand-chip" title="Produk & Stok" th:href="@{/web/product}">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v2H4zm2 4h12v12H6zM8 10v8h8v-8z"/></svg>
                Produk
            </a>
            <a class="brand-chip" title="SOP" th:href="@{/web/sop}">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v2H4zm2 4h12v12H6zM8 10v8h8v-8z"/></svg>
                Manajemen SOP
            </a>
            <a class="brand-chip" title="SOP" th:href="@{/web/home}">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v2H4zm2 4h12v12H6zM8 10v8h8v-8z"/></svg>

        </div>

<!-- MOBILE SWITCHER (aktif otomatis seperti gambar 2) -->
<nav class="mobile-switch-wrap sticky" aria-label="Navigasi utama">
    <div class="mobile-switch" role="tablist" id="mobTabs">
        <a class="segbtn" href="/web/home"    data-route="/web/home"    role="tab" aria-selected="false">Home</a>
        <a class="segbtn" href="/web/product" data-route="/web/product" role="tab" aria-selected="false">Produk</a>
        <a class="segbtn" href="/web/sop"     data-route="/web/sop"     role="tab" aria-selected="false">SOP</a>
    </div>
</nav>

<main class="container my-3">
    <h1 class="h4 fw-bold mb-3">Daftar SOP</h1>

    <!-- Toolbar -->
    <div class="row g-2">
        <div class="col-12">
            <div class="d-flex align-items-center gap-2 px-3 py-2 bg-white border rounded-4 shadow-sm">
                <input id="q" class="form-control border-0" placeholder="Cari judul/kode…">
            </div>
        </div>
        <div class="col-6 col-md-auto" style="min-width:160px">

            <option>6</option><option selected>10</option><option>20</option>

</main>

<!-- PREVIEW -->
<div id="spv" class="spv" role="dialog" aria-modal="true" aria-label="Pratinjau PDF">
    <div class="spv-backdrop" id="spvBackdrop"></div>
    <div class="spv-box" role="document" aria-labelledby="spvTitle">
        <div class="spv-x" id="spvX" aria-label="Tutup">✕</div>
        <div class="spv-head">
            <strong id="spvTitle">Pratinjau</strong>
            <div class="sp"></div>

            <!-- === FIND BAR (baru) === -->
            <div class="findbar" aria-label="Pencarian dokumen">
                <input id="spvFind" type="search" placeholder="Cari di dokumen…" enterkeyhint="search" />
                <button id="spvPrev" title="Sebelumnya (Shift+Enter)">⬆︎</button>
                <button id="spvNext" title="Berikutnya (Enter)">⬇︎</button>
                <small id="spvCount">0 / 0</small>
                <button id="spvClear" title="Bersihkan">✖</button>
            </div>
        </div>
        <div class="spv-pages" id="spvPages"></div>
    </div>
</div>

<script>
    // ====== Config
    const API_BASE=(document.querySelector('meta[name="api-base"]')?.content||'/api').replace(/\/+$/,'');
    const API_KEY =document.querySelector('meta[name="x-api-key"]')?.content?.trim()||'';
    const j=async (url,opt={})=>{
      const h=Object.assign({},opt.headers||{}); if(API_KEY)h['x-api-key']=API_KEY;
      const r=await fetch(url,{...opt,headers:h}); if(!r.ok) throw new Error(await r.text().catch(()=>r.statusText));
      const ct=r.headers.get('content-type')||''; return ct.includes('application/json')? r.json(): r.text();
    };
    const $=s=>document.querySelector(s);

    // ====== State
    const state={all:[],view:[],q:'',owner:'',tag:'',sort:'Terbaru',page:1,pageSize:10};

    // ====== Utils
    const fmtDate=s=>{ if(!s)return'-'; const d=new Date(s);
      return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}).replace('.','');
    };
    const chip=(t,cls='')=>`<span class="chipx ${cls}">${t}</span>`;
    const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));

    function parseQuery(q){
      const tokens=(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
      const cond={text:[],owner:[],tags:[]};
      for(const t of tokens){
        if(t.startsWith('owner:'))cond.owner.push(t.slice(6));
        else if(t.startsWith('tag:'))cond.tags.push(t.slice(4));
        else if(t.startsWith('#'))cond.tags.push(t.slice(1));
        else cond.text.push(t);
      }
      return cond;
    }

    function applyFilter(){
      const {text,owner:qo,tags:qt}=parseQuery(state.q);
      let arr=state.all.filter(x=>{
        const base=`${x.code||''} ${x.title||''} ${x.owner||''} ${(x.tags||[]).join(' ')} ${(x.categories||[]).join(' ')}`.toLowerCase();
        const hitText=!text.length||text.every(t=>base.includes(t));
        const hitOwner1=!state.owner||String(x.owner||'').toLowerCase()===state.owner.toLowerCase();
        const hitTag1=!state.tag||(Array.isArray(x.tags)&&x.tags.map(t=>String(t).toLowerCase()).includes(state.tag.toLowerCase()));
        const hitOwner2=!qo.length||qo.some(v=>String(x.owner||'').toLowerCase().includes(v));
        const hitTag2=!qt.length||(Array.isArray(x.tags)&&qt.every(v=>x.tags.map(t=>String(t).toLowerCase()).includes(v)));
        return hitText&&hitOwner1&&hitTag1&&hitOwner2&&hitTag2;
      });
      const s=state.sort;
      arr.sort((a,b)=>{
        if(s==='Terbaru') return new Date(b.effective||b.createdAt||0)-new Date(a.effective||a.createdAt||0);
        if(s==='Terlama') return new Date(a.effective||a.createdAt||0)-new Date(b.effective||b.createdAt||0);
        if(s==='A-Z') return String(a.title||'').localeCompare(String(b.title||''));
        if(s==='Z-A') return String(b.title||'').localeCompare(String(a.title||''));
        return 0;
      });
      state.view=arr;
    }

    // ====== PREVIEW + FIND
    const spv=$('#spv'), spvPages=$('#spvPages'), spvTitle=$('#spvTitle');
    const spvBackdrop=$('#spvBackdrop'), spvX=$('#spvX');
    const findInput = $('#spvFind'), findPrev=$('#spvPrev'), findNext=$('#spvNext'), findCount=$('#spvCount'), findClear=$('#spvClear');
    let spvOpen=false;

    // PDF.js worker
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    (function injectProtectionCSS(){
      try{
        const st=document.createElement('style');
        st.textContent = `
          @media print{ body{ display:none !important; } }
          body, #spv{ -webkit-user-select:none; user-select:none; }
          canvas, img{ -webkit-user-drag:none; }
        `;
        document.head.appendChild(st);
      }catch(_){}
    })();

    const AUTH_USER = (document.querySelector('meta[name="auth-user"]')?.content || window.AUTH_USER || 'User').toString().trim();

    function lockScroll(on){ document.body.style.overflow = on ? 'hidden' : ''; }

    function drawWatermark(ctx, w, h, text){
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.translate(w/2, h/2);
      ctx.rotate(-Math.PI/6);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.floor(Math.min(w,h)/10)}px Inter, Arial, sans-serif`;
      ctx.fillStyle = '#000';
      ctx.fillText(text, 0, 0);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.font = `600 ${Math.floor(Math.min(w,h)/22)}px Inter, Arial, sans-serif`;
      ctx.fillStyle = '#000';
      const step = Math.floor(Math.min(w,h)/2.5);
      for(let y = step/2; y < h+step; y += step){
        for(let x = step/2; x < w+step; x += step){
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(-Math.PI/6);
          ctx.fillText(text, 0, 0);
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // ===== Find state/cache
    let _pdfDoc=null;
    const _pageMetas = []; // {pageNo, viewportScale, pageW, pageH, wrapper, hlLayer, textItems}
    let _hits = []; // {pageNo, rect:{x,y,w,h}, idx}
    let _hitIndex = -1;
    const _textCache = new Map(); // pageNo -> items

    async function openSimplePreviewById(docId, fileId, fileName){
      try{
        const lower=String(fileName||'').toLowerCase();
        if(!lower.endsWith('.pdf')){ alert('Pratinjau hanya untuk PDF.'); return; }
        const url=`${API_BASE}/sop/${docId}/files/${fileId}`;
        const r=await fetch(url,{headers:API_KEY?{'x-api-key':API_KEY}:{}, cache:'no-store'});
        if(!r.ok) throw new Error(await r.text());
        const buf=await r.arrayBuffer();
        await showPdfAll(buf, fileName||'Dokumen');
      }catch(e){ alert(e.message||'Gagal membuka pratinjau'); }
    }

    async function showPdfAll(arrayBuffer, name){
      spvTitle.textContent=name||'Pratinjau';
      spv.classList.add('show'); spvOpen=true; lockScroll(true);
      spvPages.innerHTML='';
      resetFind(); // clear find state

      const loadingTask=pdfjsLib.getDocument({data:arrayBuffer, disableCreateObjectURL:true});
      _pdfDoc=await loadingTask.promise;

      const containerWidth=Math.floor(spvPages.getBoundingClientRect().width);
      const wmUser = AUTH_USER || 'User';
      const wmTime = new Date().toLocaleString();
      const wmText = `${wmUser} • ${wmTime} • CONFIDENTIAL`;

      _pageMetas.length = 0;
      _textCache.clear();

      for(let p=1;p<=_pdfDoc.numPages;p++){
        const page=await _pdfDoc.getPage(p);
        const base=page.getViewport({scale:1});
        const scale=containerWidth/base.width;
        const viewport=page.getViewport({scale});

        // wrapper per halaman (untuk highlight layer)
        const wrap=document.createElement('div'); wrap.className='spv-page';
        const canvas=document.createElement('canvas');
        const hlLayer=document.createElement('div'); hlLayer.className='hl-layer';
        wrap.appendChild(canvas); wrap.appendChild(hlLayer);
        spvPages.appendChild(wrap);

        const ctx=canvas.getContext('2d',{alpha:false});
        const pixelRatio=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.floor(viewport.width*pixelRatio);
        canvas.height=Math.floor(viewport.height*pixelRatio);
        canvas.style.width=`${Math.floor(viewport.width)}px`;
        canvas.style.height=`${Math.floor(viewport.height)}px`;
        ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);

        await page.render({canvasContext:ctx, viewport}).promise;

        // watermark di atas raster
        const logicalW = canvas.width / pixelRatio;
        const logicalH = canvas.height / pixelRatio;
        drawWatermark(ctx, logicalW, logicalH, wmText);

        _pageMetas.push({
          pageNo:p, viewportScale:scale, pageW:viewport.width, pageH:viewport.height,
          wrapper:wrap, hlLayer
        });
      }
    }

    async function ensureTextItems(pageNo){
      if(_textCache.has(pageNo)) return _textCache.get(pageNo);
      const page = await _pdfDoc.getPage(pageNo);
      const text = await page.getTextContent();
      // Map item -> absolute rect at current viewport scale (same scale we used to render)
      const meta = _pageMetas.find(m=>m.pageNo===pageNo);
      const viewport = await page.getViewport({ scale: meta.viewportScale });
      const items = text.items.map(it=>{
        // Estimate bounding box
        const tx = pdfjsLib.Util.transform(viewport.transform, it.transform);
        // tx = [a,b,c,d,e,f]; text is drawn at (e, f) with font size ~ d
        const x = tx[4];
        const yTop = tx[5];
        const w = it.width * meta.viewportScale;
        const h = Math.abs(tx[3]); // text height approx
        const y = yTop - h;
        return { str: it.str, x, y, w, h };
      });
      _textCache.set(pageNo, items);
      return items;
    }

    function resetFindUI(){
      findCount.textContent = '0 / 0';
    }
    function resetFind(highlightsOnly=false){
      _hits = [];
      _hitIndex = -1;
      if(!highlightsOnly){
        resetFindUI();
        if(findInput) findInput.value = '';
      }
      // clear highlight layers
      _pageMetas.forEach(m=>{ m.hlLayer.innerHTML=''; });
    }

    function renderHighlights(){
      // clear all
      _pageMetas.forEach(m=> m.hlLayer.innerHTML='');
      // draw
      _hits.forEach((h,i)=>{
        const m = _pageMetas.find(mm=>mm.pageNo===h.pageNo);
        if(!m) return;
        const d = document.createElement('div');
        d.className = 'hl' + (i===_hitIndex ? ' active' : '');
        d.style.left = `${h.rect.x}px`;
        d.style.top  = `${h.rect.y}px`;
        d.style.width  = `${h.rect.w}px`;
        d.style.height = `${h.rect.h}px`;
        m.hlLayer.appendChild(d);
      });
      findCount.textContent = (_hits.length ? (_hitIndex+1) : 0) + ' / ' + _hits.length;
    }

    async function findAll(q){
      const query = (q||'').trim();
      resetFind(true);
      if(!query){ renderHighlights(); return; }

      const qLow = query.toLowerCase();
      const isWord = qLow.split(/\s+/).filter(Boolean);
      for(let p=1;p<=(_pdfDoc?.numPages||0);p++){
        const items = await ensureTextItems(p);
        for(const it of items){
          const hay = it.str || '';
          if(!hay) continue;
          const low = hay.toLowerCase();
          // Simple substring match (handles multi-word within same chunk)
          let idx = 0;
          while(true){
            idx = low.indexOf(qLow, idx);
            if(idx === -1) break;

            // Approximate sub-rect for the substring portion within the chunk:
            // Split width proportionally to substring length vs total string length.
            const totalLen = Math.max(hay.length, 1);
            const charW = it.w / totalLen;
            const subX = it.x + (idx * charW);
            const subW = charW * qLow.length;

            _hits.push({ pageNo:p, rect:{ x:subX, y:it.y, w:Math.max(2, subW), h:it.h } });
            idx += Math.max(1, qLow.length);
          }

          // Extra: if text layer chunks small, try word-by-word AND logic
          if(!low.includes(qLow) && isWord.length>1){
            const ok = isWord.every(w=>low.includes(w));
            if(ok){
              _hits.push({ pageNo:p, rect:{ x:it.x, y:it.y, w:it.w, h:it.h } });
            }
          }
        }
      }
      // set first as active
      if(_hits.length){ _hitIndex = 0; scrollToActive(); }
      renderHighlights();
    }

    function scrollToActive(){
      if(_hitIndex<0 || _hitIndex>=_hits.length) return;
      const h = _hits[_hitIndex];
      const m = _pageMetas.find(mm=>mm.pageNo===h.pageNo);
      if(!m) return;
      // Ensure the page is in view and then scroll inside page a bit
      const pageRect = m.wrapper.getBoundingClientRect();
      const container = spvPages;
      container.scrollTo({ top: container.scrollTop + pageRect.top - 80, behavior:'smooth' });

      // After page visible, also center around the highlight
      setTimeout(()=>{
        const targetY = h.rect.y - 40; // padding
        container.scrollTo({ top: container.scrollTop + targetY, behavior:'smooth' });
      }, 250);
    }

    function gotoNext(){
      if(!_hits.length) return;
      _hitIndex = (_hitIndex + 1) % _hits.length;
      renderHighlights(); scrollToActive();
    }
    function gotoPrev(){
      if(!_hits.length) return;
      _hitIndex = (_hitIndex - 1 + _hits.length) % _hits.length;
      renderHighlights(); scrollToActive();
    }

    // ===== Events for find
    findInput?.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        if(e.shiftKey) gotoPrev();
        else if((findInput.value||'').trim()){
          // If query unchanged and already have hits, go next; else compute
          const label = findCount.textContent||'';
          if(label.endsWith('/ 0') || label==='0 / 0'){ findAll(findInput.value); }
          else gotoNext();
        }
        e.preventDefault();
      }
    });
    findNext?.addEventListener('click', ()=>{ if(!_hits.length){ findAll(findInput.value); } else gotoNext(); });
    findPrev?.addEventListener('click', ()=>{ if(!_hits.length){ findAll(findInput.value); } else gotoPrev(); });
    findClear?.addEventListener('click', ()=>{ resetFind(); renderHighlights(); findInput.focus(); });

    function closePreview(){
      if(!spvOpen) return;
      spv.classList.remove('show'); spvOpen=false; lockScroll(false);
      spvPages.innerHTML='';
      _pdfDoc=null; _pageMetas.length=0; _hits.length=0; _hitIndex=-1; _textCache.clear();
      resetFind();
    }
    spvBackdrop.addEventListener('click', closePreview);
    spvX.addEventListener('click', closePreview);
    window.addEventListener('keydown', e=>{ if(e.key==='Escape') closePreview(); });
    window.addEventListener('orientationchange', ()=>{ if(spvOpen) closePreview(); });
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden && spvOpen) closePreview(); }, true);
    window.addEventListener('contextmenu', e=>e.preventDefault(), true);

    // ====== Render cards
    function render(){
      const cards=$('#cards'); cards.innerHTML='';
      const total=state.view.length;
      const pages=Math.max(1,Math.ceil(total/state.pageSize));
      if(state.page>pages) state.page=pages;
      const start=(state.page-1)*state.pageSize, end=Math.min(start+state.pageSize,total);

      if(!total){
        cards.innerHTML=`<div class="col"><div class="cardx text-center p-4">
          <div class="mb-2">📄</div><div><b>Tidak ada data</b><br><small class="text-secondary">Coba ubah pencarian/fitur filter.</small></div>
        </div></div>`;
      }else{
        state.view.slice(start,end).forEach(s=>{
          const tg=(s.tags||[]).map(t=>chip(t,'ghost')).join('');
          const cat=(s.categories||[]).map(c=>chip(c)).join('');
          const own=s.owner?chip('By '+s.owner,'owner'):'';
          const filesArr=Array.isArray(s.files)?s.files:[];
          const filesHtml=filesArr.map(f=>{
            const safe=(f.fileName||'file')
              .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
            const sz=f.size?(f.size>=1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(1)+' KB'):'';
            return `<div class="file"><span>${safe}</span> <span class="size">• ${sz}</span></div>`;
          }).join('') || '<div class="meta">Tidak ada file</div>';

          const firstPdf=filesArr.find(ff=>/\.pdf$/i.test(ff?.fileName||''));
          const previewDisabled = firstPdf ? '' : 'disabled';

          const col=document.createElement('div');
          col.className='col';
          col.innerHTML=`
            <article class="cardx">
              <div class="top">
                <h3 class="flex-grow-1">${s.title||'-'}</h3>
                <span class="badgex ${s.status||'Draft'}">${(s.status||'Draft')}</span>
              </div>
              <div class="meta">${s.code||'-'} • v${s.version||'1.0'}</div>
              <div class="chips">${own} ${cat} ${tg}</div>
              <hr class="hr">
              ${filesHtml}
              <div class="d-flex gap-2 mt-2">
                <button class="btnx" ${previewDisabled}
                  onclick="openSimplePreviewById(${s.id}, ${firstPdf? firstPdf.id : 'null'}, '${(firstPdf? (firstPdf.fileName||'').replace(/['\"<>&]/g,ss=>({'\'':'&#39;','\"':'&quot;','<':'&lt;','&':'&amp;','>':'&gt;'}[ss])) : '')}')">
                  Preview
                </button>
              </div>
              <div class="meta mt-2">Berlaku: ${fmtDate(s.effective)}</div>
            </article>`;
          cards.appendChild(col);
        });
      }

      $('#pgInfo').textContent = total ? `${start+1}–${end} dari ${total}` : '0–0 dari 0';
      $('#pgPage').textContent = `${state.page} / ${pages}`;
      $('#pgPrev').disabled = state.page<=1;
      $('#pgNext').disabled = state.page>=pages;
    }

    // ====== Populate & Load
    function populateFilters(){
      const owners=uniq(state.all.map(x=>x.owner));
      const tags=uniq(state.all.flatMap(x=>Array.isArray(x.tags)?x.tags:[]));
      const fOwner=$('#fOwner'), fTag=$('#fTag');
      fOwner.length=1; fTag.length=1;
      owners.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; fOwner.appendChild(op); });
      tags.forEach(t=>{ const op=document.createElement('option'); op.value=t; op.textContent=t; fTag.appendChild(op); });
      if(!owners.includes(state.owner)) state.owner='', fOwner.value='';
      if(!tags.includes(state.tag)) state.tag='', fTag.value='';
    }
    async function load(){
      try{
        const qs=new URLSearchParams(); if(state.q)qs.set('query',state.q);
        const data=await j(`${API_BASE}/sop?${qs.toString()}`);
        state.all=Array.isArray(data.items)?data.items:[];
      }catch(e){ console.warn('API error:',e); state.all=[]; }
      populateFilters(); state.page=1; applyFilter(); render();
    }

    // ====== Events
    let t=null;
    $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=(e.target.value||'').trim(); load(); },180); });
    $('#fOwner').addEventListener('change',e=>{ state.owner=e.target.value||''; applyFilter(); state.page=1; render(); });
    $('#fTag').addEventListener('change',e=>{ state.tag=e.target.value||''; applyFilter(); state.page=1; render(); });
    $('#fSort').addEventListener('change',e=>{ state.sort=e.target.value; applyFilter(); state.page=1; render(); });
    $('#pgPrev').onclick=()=>{ if(state.page>1){ state.page--; render(); } };
    $('#pgNext').onclick=()=>{ const pages=Math.max(1,Math.ceil(state.view.length/state.pageSize)); if(state.page<pages){ state.page++; render(); } };
    $('#pgSize').onchange=e=>{ state.pageSize=parseInt(e.target.value,10)||10; state.page=1; render(); };

    window.addEventListener('keydown', e=>{
      const k=e.key.toLowerCase();
      if((e.ctrlKey||e.metaKey)&&(k==='p'||k==='s')){ e.preventDefault(); e.stopPropagation(); }
      if(e.key==='Escape') closePreview();
    }, true);

    // === Mobile switcher: set tab aktif sesuai path (seperti gambar 2)
    (function setActiveMobileTab(){
      try{
        const tabs = document.querySelectorAll('#mobTabs .segbtn');
        const norm = (p)=>{
          if(!p) return '/web/home';
          const n = p.replace(/\/+$/,'');
          return (n==='/web'||n==='/web/') ? '/web/home' : n;
        };
        const current = norm(location.pathname);

        let found=false;
        tabs.forEach(a=>{
          const r = norm(a.getAttribute('data-route')||a.getAttribute('href')||'');
          const isActive = current.startsWith(r);
          a.classList.toggle('active', isActive);
          a.setAttribute('aria-selected', isActive ? 'true' : 'false');
          if(isActive) found=true;
        });
        if(!found){
          const home = document.querySelector('#mobTabs .segbtn[data-route="/web/home"]');
          if(home){ home.classList.add('active'); home.setAttribute('aria-selected','true'); }
        }
      }catch(_){}
    })();

    // load awal
    load();
</script>
</body>
</html>
