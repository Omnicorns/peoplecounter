<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SARINAH — Digital Catalogue</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --paper: #faf8f3;
      --ink: #1a1a1a;
      --accent: #e63946;
      --accent-light: #ff6b7a;
      --muted: #6b6b6b;
      --border: #d4d4d4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      height:100%;
      overflow:hidden;
    }

    body{
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      position: relative;
      font-size: 13px;
      letter-spacing: -0.01em;
    }

    /* Brutalist grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 19px, var(--border) 19px, var(--border) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, var(--border) 19px, var(--border) 20px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    /* Noise texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: multiply;
    }

    #viewer{
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    @supports(height:100svh){
      #viewer{
        height: 100svh;
      }
    }

    /* Header with editorial style */
    #top{
      position: relative;
      width: 100%;
      height: auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      padding: 24px 32px 16px;
      z-index: 50;
      background: var(--paper);
      border-bottom: 3px solid var(--ink);
      gap: 20px;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 42px;
      font-weight: 600;
      font-style: italic;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 0.9;
      position: relative;
      width: fit-content;
    }

    .logo::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      animation: underlineGrow 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      animation-delay: 0.3s;
    }

    @keyframes underlineGrow {
      to { transform: scaleX(1); }
    }

    .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      font-weight: 600;
      margin-top: 6px;
    }

    .center-info {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 8px;
    }

    .page-display {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .page-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .iconbtn{
      height: 44px;
      min-width: 44px;
      padding: 0 16px;
      background: var(--ink);
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--paper);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 18px;
      font-family: inherit;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
      font-size: 11px;
    }

    .iconbtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .iconbtn span {
      position: relative;
      z-index: 1;
    }

    .iconbtn:hover::before {
      transform: translateY(0);
    }

    .iconbtn:active {
      transform: scale(0.97);
    }

    .popover{
      position: absolute;
      top: calc(100px + var(--safe-top));
      right: 32px;
      width: 240px;
      z-index: 60;
      display: none;
      background: var(--paper);
      border: 3px solid var(--ink);
      padding: 0;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
      animation: popDrop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popDrop {
      from {
        opacity: 0;
        transform: translateY(-20px) rotate(-2deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
    }

    .popover.show{display: block;}

    .popitem{
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.1s ease;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .popitem:last-child {
      border-bottom: 0;
    }

    .popitem:hover{
      background: var(--ink);
      color: var(--paper);
    }

    .popitem[aria-disabled="true"]{
      opacity: 0.3;
      pointer-events: none;
    }

    .sep{
      height: 3px;
      background: var(--ink);
      margin: 0;
      border: 0;
    }

    /* Main stage */
    #stage{
      position: relative;
      flex: 1;
      background:
        linear-gradient(180deg, transparent 0%, rgba(230, 57, 70, 0.02) 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .deck{
      position: absolute;
      inset: 40px 20px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .layer{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transition: opacity 0.3s ease;
    }

    .pageWrap{
      position: relative;
      will-change: transform;
      touch-action: none;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    canvas{
      max-width: 100%;
      max-height: 100%;
      background: #fff;
      border: 4px solid var(--ink);
      box-shadow:
        12px 12px 0 rgba(0, 0, 0, 0.1),
        0 0 0 12px var(--paper);
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .linkLayer{
      position: absolute;
      inset: 4px;
      pointer-events: none;
    }

    .linkLayer .pdf-link{
      position: absolute;
      display: block;
      pointer-events: auto;
      text-decoration: none;
      transition: all 0.1s ease;
      border: 2px solid transparent;
    }

    .linkLayer .pdf-link:hover{
      border-color: var(--accent);
      background: rgba(230, 57, 70, 0.1);
      cursor: pointer;
    }

    /* Read mode */
    #read{
      flex: 1;
      overflow: auto;
      background: var(--paper);
      display: none;
      padding: 40px 20px;
    }

    #read::-webkit-scrollbar {
      width: 12px;
    }

    #read::-webkit-scrollbar-track {
      background: var(--border);
    }

    #read::-webkit-scrollbar-thumb {
      background: var(--ink);
      border: 2px solid var(--paper);
    }

    #read::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    #doc{
      margin: 0 auto;
      padding: 0;
      width: min(100%, 1100px);
    }

    #doc canvas.page{
      margin: 0 auto 40px;
      border: 4px solid var(--ink);
      box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.1);
      background: #ffffff;
      display: block;
      animation: slideInPage 0.4s ease backwards;
    }

    @keyframes slideInPage {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Navigation buttons */
    .nav{
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: var(--ink);
      border: 0;
      color: var(--paper);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 24px;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
    }

    .nav:hover {
      background: var(--accent);
      transform: translateY(-50%) scale(1.05);
    }

    .nav:active{
      transform: translateY(-50%) scale(0.95);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
    }

    .nav:disabled{
      opacity: 0.2;
      pointer-events: none;
    }

    #prev{left: 20px;}
    #next{right: 20px;}

    /* Footer */
    #footer{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 32px;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 3px solid var(--ink);
      background: var(--paper);
      font-size: 12px;
      font-weight: 600;
    }

    #indicator{
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      min-width: 140px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bar{
      --p: 0%;
      position: relative;
      height: 20px;
      background: transparent;
      border: 3px solid var(--ink);
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .bar>i{
      position: absolute;
      inset: 0 calc(100% - var(--p)) 0 0;
      background: var(--accent);
      transition: inset 0.2s ease;
      position: relative;
    }

    .bar>i::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: var(--ink);
      animation: progressPulse 1s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .bar:hover>i {
      background: var(--accent-light);
    }

    /* Zoom indicator */
    .zoom-indicator {
      position: absolute;
      top: 120px;
      left: 32px;
      background: var(--ink);
      color: var(--paper);
      padding: 12px 24px;
      font-size: 24px;
      font-weight: 700;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: 0;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .zoom-indicator::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid var(--accent);
      transform: scale(1.05);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .zoom-indicator.show {
      opacity: 1;
    }

    .zoom-indicator.show::after {
      opacity: 1;
      transform: scale(1);
    }

    /* Loading spinner */
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border: 6px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.6s linear infinite;
      z-index: 100;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      #top {
        grid-template-columns: 1fr;
        padding: 16px 20px;
        gap: 12px;
      }

      .logo {
        font-size: 32px;
      }

      .center-info {
        order: -1;
      }

      .controls {
        justify-content: flex-start;
        width: 100%;
      }

      .iconbtn {
        flex: 1;
        min-width: 0;
      }

      .nav {
        width: 50px;
        height: 50px;
      }

      #prev { left: 12px; }
      #next { right: 12px; }

      .zoom-indicator {
        left: 50%;
        transform: translateX(-50%);
      }

      .zoom-indicator.show {
        transform: translateX(-50%);
      }
    }

    /* Stamp decoration */
    .stamp {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 120px;
      height: 120px;
      border: 4px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      transform: rotate(-15deg);
      opacity: 0.15;
      pointer-events: none;
      z-index: 5;
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
      font-size: 16px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .stamp::before {
      content: 'Sarinah';
      position: absolute;
    }

    .stamp::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 2px solid var(--accent);
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .stamp {
        width: 80px;
        height: 80px;
        bottom: 20px;
        right: 20px;
        font-size: 11px;
      }

      .stamp::after {
        inset: 8px;
      }
    }
  </style>
</head>
<body>

<div class="stamp"></div>

<div id="viewer" aria-label="Sarinah Digital Catalogue">
  <div id="top">
    <div class="logo-area">
      <div class="logo">SARINAH</div>
      <div class="subtitle">Digital Catalogue</div>
    </div>

    <div class="center-info">
      <div class="page-display" id="pageDisplay">01</div>
      <div class="page-label">Current Page</div>
    </div>

    <div class="controls">
      <button id="kebabBtn" class="iconbtn"><span>MENU</span></button>
    </div>

    <div id="pop" class="popover" role="menu" aria-label="Menu">
      <button class="popitem" id="miFullscreen"><span>⤢</span> Fullscreen</button>
      <button class="popitem" id="miMode"><span>📖</span> Read Mode</button>
      <hr class="sep">
      <button class="popitem" id="miZoomIn"><span>＋</span> Zoom In</button>
      <button class="popitem" id="miZoomOut"><span>－</span> Zoom Out</button>
      <button class="popitem" id="miZoomReset"><span>⤾</span> Reset</button>
      <button class="popitem" id="miFitWidth"><span>⇔</span> Fit Width</button>
      <hr class="sep">
      <button class="popitem" id="miPlay"><span>▶</span> Autoplay</button>
    </div>
  </div>

  <div id="stage" aria-live="polite">
    <button class="nav" id="prev" aria-label="Previous">‹</button>
    <div class="deck">
      <div id="L1" class="layer">
        <div class="pageWrap" id="wrap1">
          <canvas id="c1"></canvas>
          <div class="linkLayer" id="links1"></div>
        </div>
      </div>
      <div id="L2" class="layer">
        <div class="pageWrap" id="wrap2">
          <canvas id="c2"></canvas>
          <div class="linkLayer" id="links2"></div>
        </div>
      </div>
    </div>
    <button class="nav" id="next" aria-label="Next">›</button>
  </div>

  <div id="read" aria-label="Read Mode"><div id="doc"></div></div>

  <div id="footer">
    <div id="indicator">Page 1 / 1</div>
    <div class="bar" id="progress" aria-label="Progress"><i id="prog"></i></div>
  </div>
</div>

<div class="zoom-indicator" id="zoomIndicator">100%</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.DEFAULT_PDF = /*[[ ${pdfUrl} != null ? @{${pdfUrl}} : @{/file.pdf} ]]*/ 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/examples/learning/helloworld.pdf';
  /*]]>*/
</script>

<script type="module">
  import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.worker.mjs";

  if ("disableCreateObjectURL" in pdfjsLib) pdfjsLib.disableCreateObjectURL = true;

  const params = new URLSearchParams(location.search);
  let PDF_URL = params.get('pdf') || window.DEFAULT_PDF;

  const isMobile = /Android|webOS|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);

  let pdfDoc=null, pageNum=1, numPages=0;
  let active=1, animating=false, fitMode='page', zoomPct=100, readZoomPct=100;
  const ZMIN=25, ZMAX=600, ZSTEP=15;

  const MAX_DPR_SLIDE = isMobile ? 3.0 : 4.0;
  const MAX_DPR_READ  = isMobile ? 3.0 : 4.0;

  let viewMode='slide';
  let auto=false, timer=null, SLIDE_MS=5000;

  const viewer=document.getElementById('viewer');
  const stage =document.getElementById('stage');
  const read  =document.getElementById('read');
  const docEl =document.getElementById('doc');
  const L1=document.getElementById('L1'), L2=document.getElementById('L2');
  const c1=document.getElementById('c1'), c2=document.getElementById('c2');
  const ctx1=c1.getContext('2d',{alpha:false,desynchronized:true});
  const ctx2=c2.getContext('2d',{alpha:false,desynchronized:true});
  const wrap1=document.getElementById('wrap1'), wrap2=document.getElementById('wrap2');
  const links1=document.getElementById('links1'), links2=document.getElementById('links2');

  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const indicator=document.getElementById('indicator');
  const pageDisplay=document.getElementById('pageDisplay');
  const progressBar=document.getElementById('progress'), prog=document.getElementById('prog');
  const zoomIndicator=document.getElementById('zoomIndicator');

  const kebab=document.getElementById('kebabBtn');
  const pop=document.getElementById('pop');
  const A=(id)=>document.getElementById(id);
  const closePop=()=>pop.classList.remove('show');
  const stopThen=(fn)=>(e)=>{e.stopPropagation(); fn(); closePop();};

  const wrapOf = ()=> (active===1?wrap1:wrap2);
  const canvasOf = ()=> (active===1?c1:c2);
  const linksOf  = ()=> (active===1?links1:links2);

  kebab.addEventListener('click',(e)=>{e.stopPropagation();pop.classList.toggle('show')});
  document.addEventListener('click',closePop);

  A('miFullscreen').addEventListener('click', stopThen(()=>{
      (document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.());
  }));
  A('miFitWidth').addEventListener('click', stopThen(()=>{
      fitMode='width';
      if(viewMode==='slide') show(pageNum);
  }));

  let zoomTimeout = null;
  function showZoomIndicator(pct) {
    zoomIndicator.textContent = Math.round(pct) + '%';
    zoomIndicator.classList.add('show');
    clearTimeout(zoomTimeout);
    zoomTimeout = setTimeout(() => {
      zoomIndicator.classList.remove('show');
    }, 1000);
  }

  A('miZoomIn').addEventListener('click', stopThen(()=> {
    setZoom(zoomPct+ZSTEP);
    showZoomIndicator(zoomPct);
  }));
  A('miZoomOut').addEventListener('click', stopThen(()=> {
    setZoom(zoomPct-ZSTEP);
    showZoomIndicator(zoomPct);
  }));
  A('miZoomReset').addEventListener('click', stopThen(()=> {
    resetZoomToFit();
    showZoomIndicator(100);
  }));

  function setPlayEnabled(on){ A('miPlay').setAttribute('aria-disabled', on? 'false':'true'); }
  function updateModeLabel(){
    A('miMode').innerHTML = (viewMode==='slide') ? '<span>📖</span> Read Mode' : '<span>🖼</span> Slide Mode';
    setPlayEnabled(viewMode==='slide');
  }
  function updatePlayLabel(){
    A('miPlay').innerHTML = auto ? '<span>⏸</span> Pause' : '<span>▶</span> Autoplay';
  }

  function startAuto(){
    if(viewMode!=='slide' || auto || !numPages) return;
    auto=true; updatePlayLabel();
    timer=setInterval(()=>{
      const nxt=(pageNum<numPages)?pageNum+1:1;
      show(nxt);
    }, SLIDE_MS);
  }
  function stopAuto(){
    if(timer){clearInterval(timer); timer=null;}
    if(auto){auto=false; updatePlayLabel();}
  }
  const stopAutoOnInteraction = ()=>{ if(auto) stopAuto(); };
  A('miPlay').addEventListener('click', stopThen(()=>{
    if(viewMode!=='slide') return;
    auto?stopAuto():startAuto();
  }));
  A('miMode').addEventListener('click', stopThen(()=>{
    viewMode==='slide' ? enterReadMode() : exitReadMode();
  }));

  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

  const renderIntentFor = (pct, dpr) => {
    if (pct >= 120 || dpr >= 2.5) return 'print';
    return 'display';
  };

  function updateIndicator(){
    const padded = String(pageNum).padStart(2, '0');
    pageDisplay.textContent = padded;
    indicator.textContent=`Page ${pageNum} / ${numPages}`;
    const pct=Math.round(((pageNum-1)/(numPages-1||1))*100);
    progressBar.style.setProperty('--p', pct+'%');
    prog.style.inset=`0 ${100-pct}% 0 0`;
  }

  async function calcViewportSlide(page){
    const base = page.getViewport({scale:1});
    const W = Math.max(1, stage.clientWidth - 80);
    const H = Math.max(1, stage.clientHeight - 80);

    const fitScale = (fitMode === 'width')
      ? (W / base.width)
      : Math.min(W / base.width, H / base.height);

    const dprBase = Math.min(MAX_DPR_SLIDE, Math.max(1, devicePixelRatio || 1));

    const effectiveZoom = zoomPct / 100;
    const rasterScale = fitScale * dprBase * effectiveZoom;
    const cssScale = fitScale;

    return {
      viewport: page.getViewport({scale:rasterScale}),
      cssScale,
      dpr: dprBase,
      fitScale
    };
  }

  async function calcViewportRead(page){
    const base=page.getViewport({scale:1});
    const cw=docEl.clientWidth-2;
    const dpr=Math.min(MAX_DPR_READ,Math.max(1,devicePixelRatio||1));
    const fitScale=(cw/base.width);
    const rasterScale = fitScale * dpr * (readZoomPct/100);
    const cssScale = fitScale * (readZoomPct/100);
    return { viewport: page.getViewport({scale:rasterScale}), cssScale, dpr };
  }

  async function buildLinks(page, viewport, layer, dpr){
    if (!layer) return;
    layer.innerHTML = '';

    const annotations = await page.getAnnotations();
    const factor = 1 / (dpr * (zoomPct / 100));

    for (const ann of annotations){
      if (ann.subtype !== 'Link' || !ann.url) continue;

      const rect = viewport.convertToViewportRectangle(ann.rect);
      const x1 = Math.min(rect[0], rect[2]);
      const x2 = Math.max(rect[0], rect[2]);
      const y1 = Math.min(rect[1], rect[3]);
      const y2 = Math.max(rect[1], rect[3]);

      const left   = x1 * factor;
      const top    = y1 * factor;
      const width  = (x2 - x1) * factor;
      const height = (y2 - y1) * factor;

      const a = document.createElement('a');
      a.className = 'pdf-link';
      a.href      = ann.url;
      a.target    = '_blank';
      a.rel       = 'noopener noreferrer';
      a.style.left   = left + 'px';
      a.style.top    = top  + 'px';
      a.style.width  = width + 'px';
      a.style.height = height + 'px';

      layer.appendChild(a);
    }
  }

  let renderToken = 0;
  async function renderFit(p,canvas,ctx,linkLayer){
    const token = ++renderToken;
    if(!pdfDoc) return;
    const page=await pdfDoc.getPage(p);
    const {viewport, dpr}=await calcViewportSlide(page);
    if (token !== renderToken) return;

    const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
    canvas.width=w; canvas.height=h;
    canvas.style.width=Math.floor(w/dpr/(zoomPct/100))+'px';
    canvas.style.height=Math.floor(h/dpr/(zoomPct/100))+'px';

    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,w,h);

    await page.render({
      canvasContext:ctx,
      viewport,
      intent:renderIntentFor(zoomPct,devicePixelRatio||1)
    }).promise;

    await buildLinks(page, viewport, linkLayer, dpr);
  }

  const gesture = {
    pointers: new Map(),
    mode: 'idle',
    startDist: 0,
    startZoom: 100,
    startTx: 0,
    startTy: 0,
    pinchCenter: {x: 0, y: 0},
    panStart: {x: 0, y: 0},
    lastTap: {t: 0, x: 0, y: 0}
  };

  function getMidpoint(){
    const arr = [...gesture.pointers.values()];
    return {
      x: (arr[0].x + arr[1].x) / 2,
      y: (arr[0].y + arr[1].y) / 2
    };
  }

  function getDistance(){
    const arr = [...gesture.pointers.values()];
    const dx = arr[0].x - arr[1].x;
    const dy = arr[0].y - arr[1].y;
    return Math.hypot(dx, dy);
  }

  function setTransform(){
    const w = wrapOf();
    w.style.transform = `translate(${gesture.startTx}px, ${gesture.startTy}px) scale(${zoomPct/100})`;
  }

  function clampPan(limit=120){
    const cnv = canvasOf();
    const w = cnv.clientWidth;
    const h = cnv.clientHeight;
    const scale = zoomPct / 100;
    const maxX = (w * scale - w) / 2 + limit;
    const maxY = (h * scale - h) / 2 + limit;
    gesture.startTx = clamp(gesture.startTx, -maxX, maxX);
    gesture.startTy = clamp(gesture.startTy, -maxY, maxY);
  }

  async function resetZoomToFit() {
    zoomPct = 100;
    gesture.startTx = 0;
    gesture.startTy = 0;
    fitMode = 'page';
    setTransform();
    await renderFit(pageNum, canvasOf(), (active===1?ctx1:ctx2), linksOf());
  }

  async function show(p){
    if(viewMode!=='slide' || animating || !pdfDoc) return;
    animating=true; prevBtn.disabled=nextBtn.disabled=true;

    const nxtL=(active===1)?L2:L1;
    const currL=(active===1)?L1:L2;
    const nxtC=(active===1)?c2:c1, nxtCtx=(active===1)?ctx2:ctx1;
    const nxtLinks=(active===1)?links2:links1;

    nxtL.style.display='none';
    await renderFit(p,nxtC,nxtCtx,nxtLinks);

    currL.style.opacity = '1';
    nxtL.style.display='grid';
    nxtL.style.opacity = '0';

    requestAnimationFrame(() => {
      currL.style.opacity = '0';
      nxtL.style.opacity = '1';

      setTimeout(() => {
        currL.style.display='none';
        currL.style.opacity = '1';
        active=(active===1)?2:1;
        pageNum=p;
        updateIndicator();
        gesture.startTx = 0;
        gesture.startTy = 0;
        setTransform();
        prevBtn.disabled=nextBtn.disabled=false;
        animating=false;
      }, 300);
    });
  }

  prevBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum>1) show(pageNum-1); };
  nextBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum<numPages) show(pageNum+1); };

  progressBar.addEventListener('click',(e)=>{
    if(zoomPct>100) return;
    const r=progressBar.getBoundingClientRect();
    const pct=clamp((e.clientX-r.left)/r.width,0,1);
    const target=Math.max(1,Math.round(1+pct*(numPages-1)));
    if(target!==pageNum){ stopAutoOnInteraction(); show(target); }
  });

  const LIVE_DEBOUNCE = isMobile ? 160 : 80;
  let zoomTimer=null;

  function setZoom(pct){
    if(viewMode==='read'){
      readZoomPct=clamp(pct,ZMIN,ZMAX);
      buildReadPages();
      return;
    }
    zoomPct=clamp(pct,ZMIN,ZMAX);
    clearTimeout(zoomTimer);
    clampPan(); setTransform();
    zoomTimer=setTimeout(()=>{
      renderFit(pageNum, canvasOf(), (active===1?ctx1:ctx2), linksOf());
    },80);
  }

  const live = { target: 100, rendering:false, scheduled:false };

  function requestLiveRender(pct){
    live.target = clamp(Math.round(pct), ZMIN, ZMAX);
    showZoomIndicator(live.target);
    if(live.scheduled || live.rendering) return;
    live.scheduled = true;
    setTimeout(async ()=>{
      live.scheduled = false;
      if(live.rendering) return;
      live.rendering = true;
      zoomPct = live.target;
      clampPan(); setTransform();
      await renderFit(pageNum, canvasOf(), (active===1?ctx1:ctx2), linksOf());
      live.rendering = false;
    }, LIVE_DEBOUNCE);
  }

  function onPointerDown(e){
    if (e.target.closest('.pdf-link')) return;
    if(viewMode!=='slide') return;
    stopAutoOnInteraction();

    const w = wrapOf();
    w.setPointerCapture?.(e.pointerId);
    gesture.pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

    if(gesture.pointers.size === 2){
      gesture.mode = 'pinch';
      gesture.startDist = getDistance();
      gesture.startZoom = zoomPct;
      gesture.pinchCenter = getMidpoint();
      const currentTransform = wrapOf().style.transform;
      const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
      if(match){
        gesture.startTx = parseFloat(match[1]) || 0;
        gesture.startTy = parseFloat(match[2]) || 0;
      }
    } else if(gesture.pointers.size === 1 && zoomPct > 100){
      gesture.mode = 'pan';
      gesture.panStart = {x: e.clientX, y: e.clientY};
      const currentTransform = wrapOf().style.transform;
      const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
      if(match){
        gesture.startTx = parseFloat(match[1]) || 0;
        gesture.startTy = parseFloat(match[2]) || 0;
      }
    }
  }

  function onPointerMove(e){
    if(!gesture.pointers.has(e.pointerId)) return;
    gesture.pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

    if(gesture.mode === 'pinch' && gesture.pointers.size === 2){
      const currentDist = getDistance();
      const scale = currentDist / gesture.startDist;
      const newZoom = clamp(gesture.startZoom * scale, ZMIN, ZMAX);

      const oldZoom = zoomPct;
      zoomPct = newZoom;

      const currentCenter = getMidpoint();
      const w = wrapOf();
      const rect = w.getBoundingClientRect();

      const offsetX = currentCenter.x - (rect.left + rect.width / 2);
      const offsetY = currentCenter.y - (rect.top + rect.height / 2);

      const zoomRatio = newZoom / oldZoom;
      const centerShiftX = offsetX * (1 - zoomRatio);
      const centerShiftY = offsetY * (1 - zoomRatio);

      gesture.startTx += centerShiftX;
      gesture.startTy += centerShiftY;

      clampPan();
      setTransform();
      requestLiveRender(newZoom);
      return;
    }

    if(gesture.mode === 'pan' && gesture.pointers.size === 1){
      const pointer = [...gesture.pointers.values()][0];
      const dx = pointer.x - gesture.panStart.x;
      const dy = pointer.y - gesture.panStart.y;

      const w = wrapOf();
      const currentTransform = w.style.transform;
      const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);

      let baseTx = gesture.startTx;
      let baseTy = gesture.startTy;

      gesture.startTx = baseTx + dx;
      gesture.startTy = baseTy + dy;

      gesture.panStart = {x: pointer.x, y: pointer.y};

      clampPan();
      setTransform();
    }
  }

  function onPointerUp(e){
    gesture.pointers.delete(e.pointerId);

    if(gesture.mode === 'pinch' && gesture.pointers.size < 2){
      gesture.mode = 'idle';
      requestLiveRender(zoomPct);
    } else if(gesture.mode === 'pan' && gesture.pointers.size === 0){
      gesture.mode = 'idle';
    }
  }

  [wrap1, wrap2].forEach(w => {
    w.addEventListener('pointerdown', onPointerDown, {passive: false});
    w.addEventListener('pointermove', onPointerMove, {passive: false});
    w.addEventListener('pointerup', onPointerUp);
    w.addEventListener('pointercancel', onPointerUp);
  });

  stage.addEventListener('wheel', (e) => {
    if (viewMode !== 'slide' || !pdfDoc) return;

    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      stopAutoOnInteraction();
      const delta = e.deltaY;
      const step = (Math.abs(delta) > 40 ? 10 : 5);
      const dir = delta > 0 ? -step : step;
      requestLiveRender(zoomPct + dir);
      return;
    }

    if (zoomPct <= 100) {
      const dy = e.deltaY || 0;
      if (Math.abs(dy) < 1) return;
      stopAutoOnInteraction();
      if (dy > 0 && pageNum < numPages) { e.preventDefault(); show(pageNum + 1); }
      else if (dy < 0 && pageNum > 1)    { e.preventDefault(); show(pageNum - 1); }
      return;
    }
    e.preventDefault();
    stopAutoOnInteraction();
    gesture.startTx += -e.deltaX;
    gesture.startTy += -e.deltaY;
    clampPan();
    setTransform();
  }, { passive: false });

  let swipeX=null;
  stage.addEventListener('pointerdown', (e)=>{
    if (e.target.closest('.pdf-link')) return;
    if(viewMode==='slide' && zoomPct<=100){ swipeX=e.clientX; }
  });
  stage.addEventListener('pointerup', (e)=>{
    if (e.target.closest('.pdf-link')) { swipeX=null; return; }
    if(viewMode!=='slide' || swipeX===null) return;
    const dx=e.clientX-swipeX;
    if(Math.abs(dx)>60 && zoomPct<=100){
      stopAutoOnInteraction();
      if(dx<0 && pageNum<numPages) show(pageNum+1);
      if(dx>0 && pageNum>1)        show(pageNum-1);
    }
    swipeX=null;
  });

  stage.addEventListener('pointerup', (e)=>{
    if (e.target.closest('.pdf-link')) return;
    if(viewMode!=='slide' || gesture.mode !== 'idle') return;

    const now = Date.now();
    const pos = {x: e.clientX, y: e.clientY};
    const gap = now - gesture.lastTap.t;
    const moved = Math.hypot(pos.x - gesture.lastTap.x, pos.y - gesture.lastTap.y);

    if(gap < 280 && moved < 20){
      stopAutoOnInteraction();
      const targetZoom = zoomPct <= 100 ? 200 : 100;
      requestLiveRender(targetZoom);
    }

    gesture.lastTap = {t: now, x: pos.x, y: pos.y};
  });

  let io=null;
  const ensureObserver=()=> io ?? (io=new IntersectionObserver(async (ents)=>{
    for(const ent of ents){
      if(!ent.isIntersecting) continue;
      const cnv=ent.target; if(cnv.dataset.rendered) continue;
      const i=+cnv.dataset.page;
      cnv.style.animationDelay = (i * 0.05) + 's';
      const page=await pdfDoc.getPage(i);
      const {viewport,dpr}=await calcViewportRead(page);
      const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
      cnv.width=w; cnv.height=h;
      cnv.style.width=Math.floor(w/dpr)+'px'; cnv.style.height=Math.floor(h/dpr)+'px';
      const cctx=cnv.getContext('2d',{alpha:false});
      cctx.imageSmoothingEnabled=true;
      cctx.imageSmoothingQuality='high';
      cctx.fillStyle='#fff';
      cctx.fillRect(0,0,w,h);
      await page.render({
        canvasContext:cctx,
        viewport,
        intent:renderIntentFor(readZoomPct,devicePixelRatio||1)
      }).promise;
      cnv.dataset.rendered='1';
    }
  },{root:read,rootMargin:'200px 0px',threshold:0.01}));

  function buildReadPages(){
    const obs=ensureObserver();
    docEl.innerHTML='';
    for(let i=1;i<=numPages;i++){
      const cnv=document.createElement('canvas');
      cnv.className='page';
      cnv.dataset.page=i;
      cnv.height=200;
      cnv.style.width='100%';
      docEl.appendChild(cnv);
      obs.observe(cnv);
    }
    read.scrollTop=0;
  }
  function destroyReadPages(){ if(io){ io.disconnect(); io=null; } docEl.innerHTML=''; }

  function enterReadMode(){
    if(viewMode==='read') return;
    stopAuto();
    viewMode='read'; updateModeLabel();
    stage.style.display='none';
    read.style.display='block';
    buildReadPages();
  }
  function exitReadMode(){
    if(viewMode==='slide') return;
    stopAuto();
    viewMode='slide'; updateModeLabel();
    destroyReadPages();
    read.style.display='none';
    stage.style.display='grid';
    fitMode='page';
    gesture.startTx = 0;
    gesture.startTy = 0;
    setTransform();
    show(pageNum);
  }

  document.addEventListener('keydown',(e)=>{
    if(e.key==='0'){ stopAutoOnInteraction(); e.preventDefault(); resetZoomToFit(); showZoomIndicator(100); }
    if(e.key==='+'||e.key==='='){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct+ZSTEP); showZoomIndicator(zoomPct); }
    if(e.key==='-'||e.key==='_'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct-ZSTEP); showZoomIndicator(zoomPct); }
    if(e.key===' '){ e.preventDefault(); auto?stopAuto():startAuto(); }
    if(e.key==='ArrowRight' && pageNum<numPages){ stopAutoOnInteraction(); show(pageNum+1); }
    if(e.key==='ArrowLeft'  && pageNum>1){ stopAutoOnInteraction(); show(pageNum-1); }
  });

  (async function(){
    const startedAt = performance.now();

    const resp = await fetch(PDF_URL);
    if (!resp.ok) {
      console.error('Failed to fetch PDF', resp.status, resp.statusText);
      return;
    }
    const pdfBytes = await resp.arrayBuffer();
    console.log('PDF fetched:', pdfBytes.byteLength, 'bytes in', Math.round(performance.now() - startedAt), 'ms');

    const task = pdfjsLib.getDocument({
      data: pdfBytes,
      cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/cmaps/",
      cMapPacked: true,
      standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/standard_fonts/",
      useSystemFonts: true,
      disableAutoFetch: false,
      disableStream: true,
      isEvalSupported: true,
      enableXfa: false,
    });

    pdfDoc = await task.promise;
    numPages = pdfDoc.numPages;
    pageNum = 1;
    updateIndicator();
    await renderFit(pageNum,c1,ctx1,links1);
    L1.style.display='grid'; L2.style.display='none';
    updatePlayLabel(); updateModeLabel();
    setTransform();
  })();
</script>

</body>
</html>
