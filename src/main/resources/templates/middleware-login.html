<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Middleware — Masuk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
          --primary:#2DB36D; --primary-600:#26a160; --primary-700:#1e8b52;
          --text:#0f172a; --muted:#64748b; --card:#ffffff; --bg:#f7f8fb;
          --ring:#e5e7eb; --ring-strong:#cbd5e1; --error:#ef4444; --ok:#16a34a;
          --shadow: 0 10px 30px rgba(2,6,23,.08);
          --radius:16px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body{
          margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
          color:var(--text); background: radial-gradient(1200px 800px at 100% -10%, #e9f7ef 0%, transparent 40%),
                             radial-gradient(1000px 800px at -20% 110%, #eaf2ff 0%, transparent 40%),
                             var(--bg);
        }

        .wrap { min-height: 100%; display:grid; place-items:center; padding: 24px; }

        .card{
          width: 100%; max-width: 420px; background:var(--card); border:1px solid var(--ring);
          border-radius: var(--radius); box-shadow: var(--shadow);
          overflow: clip;
        }
        .brand{ display:flex; align-items:center; gap:12px; padding: 24px; border-bottom:1px solid var(--ring);
          background: linear-gradient(180deg, #fff, #fafcff);
        }
        .brand-logo{ width: 40px; height: 40px; border-radius:10px; display:grid; place-items:center; background: #e8fff2; border:1px solid #d6f5e2; font-weight:700; color:var(--primary-700); }
        .brand-title{ margin:0; font-size: 16px; font-weight: 700; letter-spacing:.2px; }
        .brand-sub{ margin:0; font-size:12px; color:var(--muted); }

        .body{ padding: 24px; }

        .section-title{ margin:0 0 14px; font-size:14px; font-weight:600; color:#111827; }

        form { display:grid; gap:14px; }

        .field{ display:grid; gap:8px; }
        label{ font-size: 12px; color: #334155; font-weight:600; }

        .input-wrap{ position:relative; }
        input[type="text"], input[type="password"]{
          width:100%; appearance:none; border:1px solid var(--ring-strong); border-radius:12px; padding:12px 44px 12px 12px; font-size:14px;
          outline:none; background:#fff; transition: box-shadow .15s, border-color .15s, background .15s;
        }
        input::placeholder{ color:#94a3b8; }
        input:focus{ border-color: var(--primary); box-shadow:0 0 0 4px rgba(45,179,109,.15); }

        .toggle-btn{ position:absolute; right:8px; top:50%; translate:0 -50%; border:1px solid var(--ring-strong); background:#fff; border-radius:10px; height:32px; padding:0 10px; cursor:pointer; font-size:12px; color:#334155; }
        .toggle-btn:focus{ outline: none; box-shadow:0 0 0 3px rgba(45,179,109,.2); }

        .btn-primary{
          appearance:none; border:0; background:var(--primary); color:white; font-weight:700; border-radius:12px;
          padding:12px 14px; cursor:pointer; font-size:14px; letter-spacing:.2px; transition: background .12s, transform .03s ease;
        }
        .btn-primary:hover{ background:var(--primary-600); }
        .btn-primary:active{ transform: translateY(1px); background:var(--primary-700); }
        .btn-primary[disabled]{ opacity:.6; cursor:not-allowed; }

        .help{ font-size:12px; color:var(--muted); margin-top:4px; }

        .error{
          display:none; align-items:flex-start; gap:10px; border:1px solid #fecaca; background:#fff1f2; color:#991b1b; border-radius:12px; padding:12px; font-size:13px;
        }
        .error.show{ display:flex; }
        .error b{ color:#b91c1c; }

        .foot{ padding: 16px 24px 24px; color:var(--muted); font-size:11.5px; text-align:center; }

        /* Prefers reduced motion */
        @media (prefers-reduced-motion:no-preference){
          .card{ animation:pop .18s ease-out both; }
          @keyframes pop{ from{ transform: translateY(6px); opacity:0 } to{ transform:none; opacity:1 } }
        }
    </style>
</head>
<body>
<main class="wrap" role="main" aria-labelledby="title">
    <section class="card" aria-live="polite">
        <!-- Header / Brand -->
        <header class="brand">
            <div class="brand-logo" aria-hidden="true">MW</div>
            <div>
                <p id="title" class="brand-title">Middleware Login</p>
                <p class="brand-sub">Masuk untuk mengelola layanan</p>
            </div>
        </header>

        <div class="body">
            <!-- Error block from server -->
            <div class="error" th:classappend="${error} != null ? ' show' : ''" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <path d="M12 9v4m0 4h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div><b>Login gagal.</b> <span th:text="${error}">Username/Email atau password salah.</span></div>
            </div>

            <h2 class="section-title">Masuk ke akun Anda</h2>

            <form th:action="@{/middleware/login}" method="post" novalidate>
                <div class="field">
                    <label for="usernameOrEmail">Username atau Email</label>
                    <div class="input-wrap">
                        <input id="usernameOrEmail" name="usernameOrEmail" type="text" inputmode="email" autocomplete="username"
                               placeholder="namauser atau email@domain.com" required autofocus />
                    </div>
                </div>

                <div class="field">
                    <label for="password">Kata Sandi</label>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" autocomplete="current-password"
                               placeholder="••••••••" required />
                        <button type="button" class="toggle-btn" aria-label="Tampilkan/sembunyikan password" onclick="togglePassword()">Tampil</button>
                    </div>
                </div>

                <!-- CSRF (Spring Security) -->
                <input type="hidden" th:if="${_csrf} != null" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button class="btn-primary" type="submit" aria-label="Masuk ke dashboard">Masuk</button>

                <p class="help">Hanya <b>username/email</b> & <b>password</b>. Tanpa SSO, tanpa "ingat saya", tanpa menu lupa password — sesuai permintaan.</p>
            </form>
        </div>

        <footer class="foot">
            © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Middleware • Keamanan diutamakan
        </footer>
    </section>
</main>

<script>
    function togglePassword(){
      const i = document.getElementById('password');
      const b = event.currentTarget;
      const showing = i.type === 'text';
      i.type = showing ? 'password' : 'text';
      b.textContent = showing ? 'Tampil' : 'Sembunyi';
    }
    // Optional: submit disabled while empty
    (function(){
      const form = document.querySelector('form');
      const btn = form.querySelector('.btn-primary');
      const u = form.querySelector('#usernameOrEmail');
      const p = form.querySelector('#password');
      const sync = () => btn.disabled = !(u.value.trim() && p.value);
      u.addEventListener('input', sync); p.addEventListener('input', sync); sync();
    })();
</script>
</body>
</html>
