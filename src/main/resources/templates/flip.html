<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarinah Catalogue — Fast PDF Viewer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <style>
        :root{
          --bg:#07080b; --ring:#2a2f3a; --acc:#2db36d; --acc2:#42c18b; --text:#eaf0ff; --sub:#9aa3b2;
          --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;overflow:hidden}

        #viewer{
          width:min(100vw,1400px);
          height:min(100vh,900px);
          margin:auto; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; position:relative; z-index:1;
          background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
          border:1px solid #161a22; box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
          backdrop-filter:blur(2px)
        }
        @supports(height:100svh){#viewer{width:min(100svw,1400px);height:min(calc(100svh - var(--safe-top) - var(--safe-bottom)),900px)}}

        /* Top bar & kebab */
        #top{position:absolute; inset:0 0 auto 0; height:56px; display:flex; align-items:center; justify-content:flex-end;
             padding:calc(8px + var(--safe-top)) 10px 8px; z-index:50;
             background:rgba(16,18,24,.6); backdrop-filter:blur(10px); border-bottom:1px solid var(--ring)}
        .iconbtn{height:36px; width:36px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
                 display:grid; place-items:center; color:#eaf0ff; cursor:pointer}
        .iconbtn:hover{background:rgba(255,255,255,.12)}
        .kebab{font:700 18px/0 system-ui; letter-spacing:2px}
        .popover{position:absolute; top:calc(48px + var(--safe-top)); right:10px; width:220px; background:#0f1218;
                 border:1px solid #232a39; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.45); padding:6px; z-index:60; display:none}
        .popover.show{display:block}
        .popitem{width:100%; text-align:left; background:transparent; border:0; color:#cfd7e6; cursor:pointer;
                 display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px}
        .popitem:hover{background:#1a1f28}
        .sep{height:1px; background:#232a39; margin:6px 0; border:0}

        #stage{position:relative; flex:1; background:radial-gradient(ellipse at 50% 35%,#0e1118,#090c12 70%); overflow:hidden; display:grid; place-items:center}
        .deck{position:absolute; inset:12px; display:grid; place-items:center; isolation:isolate}
        .layer{position:absolute; inset:0; display:grid; place-items:center}
        .pageWrap{position:relative; will-change:transform; touch-action:none;}
        canvas{
          max-width:100%; max-height:100%; background:#fff; border-radius:14px; box-shadow:0 28px 60px rgba(0,0,0,.6); display:block;
          image-rendering: crisp-edges; image-rendering:-webkit-optimize-contrast; image-rendering:pixelated;
        }

        .nav{
          position:absolute; top:50%; transform:translateY(-50%);
          z-index:20; width:44px; height:44px; display:grid; place-items:center; border-radius:999px;
          background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
          backdrop-filter:blur(8px); color:#cfd7e6; box-shadow:0 2px 12px rgba(0,0,0,.35);
        }
        .nav:active{transform:translateY(-50%) scale(.97)}
        .nav:disabled{opacity:.35; pointer-events:none}
        #prev{left:14px} #next{right:14px}

        #footer{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; border-top:1px solid var(--ring);
                background:rgba(16,18,24,.7); padding-bottom:calc(8px + var(--safe-bottom))}
        #indicator{font-variant-numeric:tabular-nums; color:#9aa3b2}
        .bar{--p:0%; position:relative; height:8px; border-radius:999px; background:#11151d; flex:1; overflow:hidden; border:1px solid #232a39; cursor:pointer}
        .bar>i{position:absolute; inset:0 calc(100% - var(--p)) 0 0; background:linear-gradient(90deg, var(--acc), var(--acc2)); transition:inset .18s linear}
    </style>
</head>
<body>
<div id="viewer" aria-label="PDF Pro Viewer">
    <!-- TOP -->
    <div id="top">
        <button id="kebabBtn" class="iconbtn kebab" aria-label="Menu">⋮</button>
        <div id="pop" class="popover" role="menu" aria-label="Menu">
            <button class="popitem" id="miDownload">⬇️ Download</button>
            <button class="popitem" id="miFullscreen">⤢ Fullscreen</button>
            <button class="popitem" id="miMode">📖 Mode Baca</button>
            <hr class="sep">
            <button class="popitem" id="miZoomIn">＋ Zoom In</button>
            <button class="popitem" id="miZoomOut">－ Zoom Out</button>
            <button class="popitem" id="miZoomReset">⤾ Reset 100%</button>
            <button class="popitem" id="miFitWidth">⇔ Fit Width</button>
            <hr class="sep">
            <button class="popitem" id="miPlay">▶️ Play</button>
        </div>
    </div>

    <!-- SLIDE -->
    <div id="stage" aria-live="polite">
        <button class="nav" id="prev" aria-label="Sebelumnya">❮</button>
        <div class="deck">
            <div id="L1" class="layer"><div class="pageWrap" id="wrap1"><canvas id="c1"></canvas></div></div>
            <div id="L2" class="layer"><div class="pageWrap" id="wrap2"><canvas id="c2"></canvas></div></div>
        </div>
        <button class="nav" id="next" aria-label="Berikutnya">❯</button>
    </div>

    <!-- READ -->
    <div id="read" aria-label="Read Mode" style="display:none"><div id="doc" style="margin:0 auto;padding:16px;width:min(100%,1100px)"></div></div>

    <div id="footer">
        <div id="indicator">Page 1 / 1</div>
        <div class="bar" id="progress" aria-label="Progress"><i id="prog"></i></div>
    </div>
</div>

<!-- sumber PDF versi kamu -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const DEFAULT_PDF = /*[[ ${pdfUrl} != null ? @{${pdfUrl}} : @{/file.pdf} ]]*/ '/file.pdf';
    /*]]>*/
</script>

<script>
    // ===== PDF.js =====
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    pdfjsLib.disableCreateObjectURL = true;

    // ===== State =====
    const params = new URLSearchParams(location.search);
    let PDF_URL = params.get('pdf') || (typeof DEFAULT_PDF!=='undefined'?DEFAULT_PDF:'/file.pdf');

    let pdfDoc=null, pageNum=1, numPages=0;
    let active=1, animating=false, fitMode='page', zoomPct=100, readZoomPct=100;
    const ZMIN=25, ZMAX=600, ZSTEP=12;
    const MAX_DPR_SLIDE=3, MAX_DPR_READ=3;
    let inReadMode=false;

    // autoplay state
    let auto=false, timer=null, SLIDE_MS=8000;

    const viewer=document.getElementById('viewer');
    const stage =document.getElementById('stage');
    const read  =document.getElementById('read');
    const docEl =document.getElementById('doc');
    const L1=document.getElementById('L1'), L2=document.getElementById('L2');
    const c1=document.getElementById('c1'), c2=document.getElementById('c2');
    const ctx1=c1.getContext('2d',{alpha:false,desynchronized:true});
    const ctx2=c2.getContext('2d',{alpha:false,desynchronized:true});
    const wrap1=document.getElementById('wrap1'), wrap2=document.getElementById('wrap2');

    const prevBtn=document.getElementById('prev');
    const nextBtn=document.getElementById('next');
    const indicator=document.getElementById('indicator');
    const progressBar=document.getElementById('progress'), prog=document.getElementById('prog');

    // ===== Menu kebab =====
    const kebab=document.getElementById('kebabBtn');
    const pop=document.getElementById('pop');
    kebab.addEventListener('click',(e)=>{e.stopPropagation();pop.classList.toggle('show')});
    document.addEventListener('click',()=>pop.classList.remove('show'));
    const A=(id)=>document.getElementById(id);
    A('miDownload').onclick = ()=>{ const a=document.createElement('a'); a.href=PDF_URL; a.download='file.pdf'; a.click(); pop.classList.remove('show'); };
    A('miFullscreen').onclick = ()=>{ (document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.()); pop.classList.remove('show'); };
    A('miFitWidth').onclick = ()=>{ stopAuto(); fitMode='width'; show(pageNum,true); pop.classList.remove('show'); };
    A('miZoomIn').onclick = ()=>{ stopAuto(); setZoom(zoomPct+ZSTEP); pop.classList.remove('show'); };
    A('miZoomOut').onclick = ()=>{ stopAuto(); setZoom(zoomPct-ZSTEP); pop.classList.remove('show'); };
    A('miZoomReset').onclick = ()=>{ stopAuto(); setZoom(100); pop.classList.remove('show'); };

    // ===== Play/Pause logic =====
    function updatePlayLabel(){
      A('miPlay').textContent = auto ? '⏸️ Pause' : '▶️ Play';
    }
    function startAuto(){
      if(inReadMode || auto || numPages<=1) return;
      auto=true; updatePlayLabel();
      timer=setInterval(()=>{
        const next = (pageNum < numPages) ? pageNum+1 : 1;
        show(next,true);
      }, SLIDE_MS);
    }
    function stopAuto(){
      if(timer){ clearInterval(timer); timer=null; }
      if(auto){ auto=false; updatePlayLabel(); }
    }
    A('miPlay').onclick=()=>{ auto ? stopAuto() : startAuto(); pop.classList.remove('show'); };

    // stop autoplay pada interaksi manual
    function stopAutoOnInteraction(){ if(auto) stopAuto(); }

    // ===== Helpers =====
    function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
    function updateIndicator(){ indicator.textContent=`Page ${pageNum} / ${numPages}`; const pct=Math.round(((pageNum-1)/(numPages-1||1))*100); progressBar.style.setProperty('--p', pct+'%'); prog.style.inset=`0 ${100-pct}% 0 0`; }
    function renderIntentFor(pct,dpr){ return (pct>=150||dpr>=2.5)?'print':'display'; }

    async function calcViewport(page,dprCap,mode){
      const base=page.getViewport({scale:1});
      let W,H,scalePct=(mode==='read')?readZoomPct:zoomPct;
      if(mode==='slide'){ W=Math.max(1,stage.clientWidth-24); H=Math.max(1,stage.clientHeight-24); }
      else { const cw=docEl.clientWidth-2; W=cw; H=Infinity; }
      const dpr=Math.min(dprCap,Math.max(1,devicePixelRatio||1));
      const fitScale=(fitMode==='width'||mode==='read')?(W/base.width):Math.min(W/base.width,H/base.height);
      const scale=Math.max(0.1,fitScale*(scalePct/100)*dpr);
      return {viewport:page.getViewport({scale}), cssScale:scale/dpr, dpr};
    }

    async function renderFit(p,canvas,ctx){
      const page=await pdfDoc.getPage(p);
      const {viewport,dpr}=await calcViewport(page,MAX_DPR_SLIDE,'slide');
      const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
      canvas.width=w; canvas.height=h;
      canvas.style.width=Math.floor(w/dpr)+'px';
      canvas.style.height=Math.floor(h/dpr)+'px';
      ctx.imageSmoothingEnabled=false; ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      await page.render({canvasContext:ctx,viewport,intent:renderIntentFor(zoomPct,devicePixelRatio||1)}).promise;
    }

    async function show(p,forward=true){
      if(inReadMode||animating) return;
      animating=true; prevBtn.disabled=nextBtn.disabled=true;
      const curL=(active===1)?L1:L2, nxtL=(active===1)?L2:L1;
      const nxtC=(active===1)?c2:c1, nxtCtx=(active===1)?ctx2:ctx1, nxtW=(active===1)?wrap2:wrap1;
      nxtL.style.display='none';
      await renderFit(p,nxtC,nxtCtx);
      curL.style.display='none'; nxtL.style.display='grid';
      nxtW.style.transform='translate(0px,0px) scale(1)'; // reset transform
      active=(active===1)?2:1; pageNum=p; updateIndicator();
      prevBtn.disabled=nextBtn.disabled=false; animating=false;
    }

    // Next/Prev selalu aktif; hentikan autoplay saat dipakai
    prevBtn.onclick=()=>{ if(pageNum>1){ stopAutoOnInteraction(); show(pageNum-1,false); } };
    nextBtn.onclick=()=>{ if(pageNum<numPages){ stopAutoOnInteraction(); show(pageNum+1,true);  } };

    progressBar.addEventListener('click',(e)=>{
      const r=progressBar.getBoundingClientRect();
      const pct=clamp((e.clientX-r.left)/r.width,0,1);
      const target=Math.max(1,Math.round(1+pct*(numPages-1)));
      if(target!==pageNum){ stopAutoOnInteraction(); show(target,target>pageNum); }
    });

    // ===== Zoom (keyboard/menu) + debounce =====
    let zoomTimer=null;
    function setZoom(pct){
      if(inReadMode){ readZoomPct=clamp(pct,ZMIN,ZMAX); buildReadPages(); return; }
      zoomPct=clamp(pct,ZMIN,ZMAX);
      clearTimeout(zoomTimer);
      zoomTimer=setTimeout(()=>show(pageNum,true),60);
    }

    document.addEventListener('keydown',(e)=>{
      if(e.key==='0'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(100); }
      if(e.key==='+'||e.key==='='){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct+ZSTEP); }
      if(e.key==='-'||e.key==='_'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct-ZSTEP); }
      if(e.key===' '){ e.preventDefault(); auto?stopAuto():startAuto(); } // spasi = toggle
      if(e.key==='ArrowRight' && pageNum<numPages){ stopAutoOnInteraction(); show(pageNum+1,true); }
      if(e.key==='ArrowLeft'  && pageNum>1){        stopAutoOnInteraction(); show(pageNum-1,false); }
    });

    // ===== Gesture: pinch (2 jari) & pan (1 jari saat zoom>100) =====
    const gesture = {
      pointers:new Map(), mode:'idle', dist0:1, scaleTmp:1,
      tx:0, ty:0, startTx:0, startTy:0, mid0:{x:0,y:0}
    };
    const wrapOf=()=> (active===1?wrap1:wrap2);

    function getMid(){ const v=[...gesture.pointers.values()]; return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; }
    function dist(){ const v=[...gesture.pointers.values()]; const dx=v[0].x-v[1].x, dy=v[0].y-v[1].y; return Math.hypot(dx,dy); }

    function setTransform(){ const w=wrapOf(); w.style.transform=`translate(${gesture.tx}px, ${gesture.ty}px) scale(${gesture.scaleTmp})`; }
    function clampPan(limit=120){
      const cnv=(active===1?c1:c2);
      const w=cnv.clientWidth, h=cnv.clientHeight;
      const maxX=(w*(gesture.scaleTmp)-w)/2 + limit;
      const maxY=(h*(gesture.scaleTmp)-h)/2 + limit;
      gesture.tx = clamp(gesture.tx,-maxX,maxX);
      gesture.ty = clamp(gesture.ty,-maxY,maxY);
    }

    function onPointerDown(e){
      stopAutoOnInteraction();
      const w=wrapOf();
      w.setPointerCapture?.(e.pointerId);
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.pointers.size===2){
        gesture.mode='pinch';
        gesture.dist0=dist(); gesture.scaleTmp=1;
        gesture.mid0=getMid();
        gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
      }else if(gesture.pointers.size===1 && zoomPct>100){
        gesture.mode='pan';
        gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
      }
    }
    function onPointerMove(e){
      if(!gesture.pointers.has(e.pointerId)) return;
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.mode==='pinch'){
        const s=clamp(dist()/gesture.dist0,0.5,3);
        gesture.scaleTmp=s;
        const mid=getMid();
        gesture.tx = gesture.startTx + (mid.x-gesture.mid0.x);
        gesture.ty = gesture.startTy + (mid.y-gesture.mid0.y);
        clampPan(); setTransform();
      }else if(gesture.mode==='pan'){
        const p=[...gesture.pointers.values()][0];
        if(!gesture._anchor){ gesture._anchor={x:p.x,y:p.y}; }
        gesture.tx = gesture.startTx + (p.x-gesture._anchor.x);
        gesture.ty = gesture.startTy + (p.y-gesture._anchor.y);
        clampPan(); setTransform();
      }
    }
    function onPointerUp(e){
      const w=wrapOf();
      if(gesture.pointers.has(e.pointerId)) gesture.pointers.delete(e.pointerId);
      if(gesture.mode==='pinch' && gesture.pointers.size<2){
        const newPct = clamp(zoomPct * gesture.scaleTmp, ZMIN, ZMAX);
        gesture.mode='idle'; gesture.scaleTmp=1; gesture.tx=0; gesture.ty=0; gesture._anchor=null;
        w.style.transform='translate(0,0) scale(1)';
        setZoom(Math.round(newPct));
        return;
      }
      if(gesture.mode==='pan' && gesture.pointers.size===0){ gesture.mode='idle'; gesture._anchor=null; }
    }
    ;[wrap1,wrap2].forEach(w=>{
      w.addEventListener('pointerdown',onPointerDown);
      w.addEventListener('pointermove',onPointerMove);
      w.addEventListener('pointerup',onPointerUp);
      w.addEventListener('pointercancel',onPointerUp);
    });

    // Swipe ganti halaman — hanya saat zoom=100
    let swipeX=null;
    stage.addEventListener('pointerdown', (e)=>{ if(zoomPct===100){ swipeX=e.clientX; }});
    stage.addEventListener('pointerup', (e)=>{
      if(zoomPct!==100 || swipeX===null) return;
      const dx=e.clientX-swipeX;
      if(Math.abs(dx)>60){
        stopAutoOnInteraction();
        if(dx<0 && pageNum<numPages) show(pageNum+1,true);
        if(dx>0 && pageNum>1)        show(pageNum-1,false);
      }
      swipeX=null;
    });

    // ===== Read mode (lazy) =====
    const io=new IntersectionObserver(async (entries)=>{
      for(const ent of entries){
        if(!ent.isIntersecting) continue;
        const cnv=ent.target; if(cnv.dataset.rendered) continue;
        const i=+cnv.dataset.page;
        const page=await pdfDoc.getPage(i);
        const {viewport,dpr}=await calcViewport(page,MAX_DPR_READ,'read');
        const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
        cnv.width=w; cnv.height=h; cnv.style.width=Math.floor(w/dpr)+'px'; cnv.style.height=Math.floor(h/dpr)+'px';
        const cctx=cnv.getContext('2d',{alpha:false}); cctx.fillStyle='#fff'; cctx.fillRect(0,0,w,h);
        await page.render({canvasContext:cctx,viewport,intent:renderIntentFor(readZoomPct,devicePixelRatio||1)}).promise;
        cnv.dataset.rendered='1';
      }
    },{root:read,rootMargin:'200px 0px',threshold:0.01});

    function buildReadPages(){
      docEl.innerHTML='';
      for(let i=1;i<=numPages;i++){
        const cnv=document.createElement('canvas'); cnv.className='page'; cnv.dataset.page=i; cnv.height=200; cnv.style.width='100%';
        docEl.appendChild(cnv); io.observe(cnv);
      }
    }
    function enterReadMode(){ stopAuto(); inReadMode=true; stage.style.display='none'; read.style.display='block'; buildReadPages(); A('miMode').textContent='🖼️ Mode Slide'; }
    function exitReadMode(){ inReadMode=false; read.style.display='none'; stage.style.display='grid'; show(pageNum,true); A('miMode').textContent='📖 Mode Baca'; }
    A('miMode').onclick=()=> (inReadMode?exitReadMode():enterReadMode());

    // ===== Load PDF =====
    (async function(){
      const task=pdfjsLib.getDocument({
        url:PDF_URL,
        cMapUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/", cMapPacked:true,
        standardFontDataUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/standard_fonts/",
        useSystemFonts:true, disableAutoFetch:true, disableStream:false, rangeChunkSize:524288,
        isEvalSupported:true, enableXfa:false
      });
      pdfDoc=await task.promise;
      numPages=pdfDoc.numPages; pageNum=1; updateIndicator();
      await renderFit(pageNum,c1,ctx1);
      L1.style.display='grid'; L2.style.display='none';
      updatePlayLabel(); // set label awal
    })();
</script>
</body>
</html>
