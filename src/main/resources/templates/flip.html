<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarinah Catalogue</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <style>
        :root{
          --bg:#07080b; --ring:#2a2f3a; --acc:#2db36d; --acc2:#42c18b; --text:#eaf0ff; --sub:#9aa3b2;
          --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;overflow:hidden}

        #viewer{
          width:min(100vw,1400px);
          height:min(100vh,900px);
          margin:auto; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; position:relative; z-index:1;
          background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
          border:1px solid #161a22; box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
          /* FIX: hilangkan glass/blur di card viewer supaya aman dari artefak */
          backdrop-filter:none;
        }
        @supports(height:100svh){#viewer{width:min(100svw,1400px);height:min(calc(100svh - var(--safe-top) - var(--safe-bottom)),900px)}}

        /* ===== Header super transparan (tanpa blur) ===== */
        #top{
          position:absolute; inset:0 0 auto 0; height:56px; display:flex; align-items:center; justify-content:flex-end;
          padding:calc(8px + var(--safe-top)) 10px 8px; z-index:50;

          /* FIX: matikan total efek blur agar PDF di bawahnya tidak ikut blur */
          background:transparent;
          border-bottom:0; box-shadow:none;
          backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
        }
        .iconbtn{
          height:36px; width:36px; border-radius:12px;
          background:rgba(255,255,255,0.02);
          border:1px solid rgba(255,255,255,0.08);
          display:grid; place-items:center; color:#eaf0ff; cursor:pointer;
          box-shadow:none;
          text-shadow:0 1px 6px rgba(0,0,0,.35);
        }
        .iconbtn:hover{
          background:rgba(255,255,255,0.06);
          border-color:rgba(255,255,255,0.14);
        }
        .kebab{font:700 18px/0 system-ui; letter-spacing:2px}
        .popover{
          position:absolute; top:calc(48px + var(--safe-top)); right:10px; width:220px; z-index:60; display:none;
          background:#0f1218; border:1px solid #232a39; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.45); padding:6px;
        }
        .popover.show{display:block}
        .popitem{width:100%; text-align:left; background:transparent; border:0; color:#cfd7e6; cursor:pointer;
                 display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px}
        .popitem:hover{background:#1a1f28}
        .popitem[aria-disabled="true"]{opacity:.45; pointer-events:none}
        .sep{height:1px; background:#232a39; margin:6px 0; border:0}

        #stage{position:relative; flex:1; background:radial-gradient(ellipse at 50% 35%,#0e1118,#090c12 70%); overflow:hidden; display:grid; place-items:center}
        .deck{position:absolute; inset:12px; display:grid; place-items:center; isolation:isolate}
        .layer{position:absolute; inset:0; display:grid; place-items:center}
        .pageWrap{position:relative; will-change:transform; touch-action:none;}
        canvas{
          max-width:100%; max-height:100%; background:#fff; border-radius:14px; box-shadow:0 28px 60px rgba(0,0,0,.6); display:block;
          image-rendering: crisp-edges; image-rendering:-webkit-optimize-contrast; image-rendering:pixelated;
        }

        #read{flex:1; overflow:auto; background:#0b0f15; display:none}
        #doc{margin:0 auto; padding:16px; width:min(100%,1100px)}

        .nav{
          position:absolute; top:50%; transform:translateY(-50%);
          z-index:20; width:44px; height:44px; display:grid; place-items:center; border-radius:999px;
          background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
          /* sedikit blur ke background card (bukan ke kanvas), aman */
          backdrop-filter:blur(8px); color:#cfd7e6; box-shadow:0 2px 12px rgba(0,0,0,.35);
        }
        .nav:active{transform:translateY(-50%) scale(.97)}
        .nav:disabled{opacity:.35; pointer-events:none}
        #prev{left:14px} #next{right:14px}

        #footer{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; border-top:1px solid var(--ring);
                background:rgba(16,18,24,.7); padding-bottom:calc(8px + var(--safe-bottom))}
        #indicator{font-variant-numeric:tabular-nums; color:#9aa3b2}
        .bar{--p:0%; position:relative; height:8px; border-radius:999px; background:#11151d; flex:1; overflow:hidden; border:1px solid #232a39; cursor:pointer}
        .bar>i{position:absolute; inset:0 calc(100% - var(--p)) 0 0; background:linear-gradient(90deg, var(--acc), var(--acc2)); transition:inset .18s linear}

        /* HAPUS blok @supports lama yang menambahkan blur di #top */
    </style>
</head>
<body>
<div id="viewer" aria-label="PDF Pro Viewer">
    <!-- TOP -->
    <div id="top">
        <button id="kebabBtn" class="iconbtn kebab" aria-label="Menu">⋮</button>
        <div id="pop" class="popover" role="menu" aria-label="Menu">
            <button class="popitem" id="miDownload">⬇️ Download</button>
            <button class="popitem" id="miFullscreen">⤢ Fullscreen</button>
            <button class="popitem" id="miMode">📖 Mode Read</button>
            <hr class="sep">
            <button class="popitem" id="miZoomIn">＋ Zoom In</button>
            <button class="popitem" id="miZoomOut">－ Zoom Out</button>
            <button class="popitem" id="miZoomReset">⤾ Reset 100%</button>
            <button class="popitem" id="miFitWidth">⇔ Fit Width</button>
            <hr class="sep">
            <button class="popitem" id="miPlay">▶️ Play</button>
        </div>
    </div>

    <!-- SLIDE -->
    <div id="stage" aria-live="polite">
        <button class="nav" id="prev" aria-label="Sebelumnya">❮</button>
        <div class="deck">
            <div id="L1" class="layer"><div class="pageWrap" id="wrap1"><canvas id="c1"></canvas></div></div>
            <div id="L2" class="layer"><div class="pageWrap" id="wrap2"><canvas id="c2"></canvas></div></div>
        </div>
        <button class="nav" id="next" aria-label="Berikutnya">❯</button>
    </div>

    <!-- READ -->
    <div id="read" aria-label="Read Mode"><div id="doc"></div></div>

    <div id="footer">
        <div id="indicator">Page 1 / 1</div>
        <div class="bar" id="progress" aria-label="Progress"><i id="prog"></i></div>
    </div>
</div>

<!-- DEFAULT_PDF -->
<script th:inline="javascript">
    /*<![CDATA[*/ const DEFAULT_PDF = /*[[ ${pdfUrl} != null ? @{${pdfUrl}} : @{/file.pdf} ]]*/ '/file.pdf'; /*]]>*/
</script>

<script>
    /* ===== PDF.js ===== */
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    pdfjsLib.disableCreateObjectURL = true;

    /* ===== State ===== */
    const params = new URLSearchParams(location.search);
    let PDF_URL = params.get('pdf') || DEFAULT_PDF;

    let pdfDoc=null, pageNum=1, numPages=0;
    let active=1, animating=false, fitMode='page', zoomPct=100, readZoomPct=100;
    const ZMIN=25, ZMAX=600, ZSTEP=12;
    const MAX_DPR_SLIDE=3, MAX_DPR_READ=3;
    let viewMode='slide';
    let auto=false, timer=null, SLIDE_MS=8000;

    const viewer=document.getElementById('viewer');
    const stage =document.getElementById('stage');
    const read  =document.getElementById('read');
    const docEl =document.getElementById('doc');
    const L1=document.getElementById('L1'), L2=document.getElementById('L2');
    const c1=document.getElementById('c1'), c2=document.getElementById('c2');
    const ctx1=c1.getContext('2d',{alpha:false,desynchronized:true});
    const ctx2=c2.getContext('2d',{alpha:false,desynchronized:true});
    const wrap1=document.getElementById('wrap1'), wrap2=document.getElementById('wrap2');

    const prevBtn=document.getElementById('prev');
    const nextBtn=document.getElementById('next');
    const indicator=document.getElementById('indicator');
    const progressBar=document.getElementById('progress'), prog=document.getElementById('prog');

    /* ===== Menu ===== */
    const kebab=document.getElementById('kebabBtn');
    const pop=document.getElementById('pop');
    const A=(id)=>document.getElementById(id);
    const closePop=()=>pop.classList.remove('show');
    const stopThen=(fn)=>(e)=>{e.stopPropagation(); fn(); closePop();};

    kebab.addEventListener('click',(e)=>{e.stopPropagation();pop.classList.toggle('show')});
    document.addEventListener('click',closePop);

    A('miDownload').addEventListener('click', stopThen(()=>{ const a=document.createElement('a'); a.href=PDF_URL; a.download='file.pdf'; a.click(); }));
    A('miFullscreen').addEventListener('click', stopThen(()=>{ (document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.()); }));
    A('miFitWidth').addEventListener('click', stopThen(()=>{ fitMode='width'; if(viewMode==='slide') show(pageNum); }));

    A('miZoomIn').addEventListener('click', stopThen(()=> setZoom(zoomPct+ZSTEP)));
    A('miZoomOut').addEventListener('click', stopThen(()=> setZoom(zoomPct-ZSTEP)));
    A('miZoomReset').addEventListener('click', stopThen(()=> setZoom(100)));

    function setPlayEnabled(on){ A('miPlay').setAttribute('aria-disabled', on? 'false':'true'); }
    function updateModeLabel(){ A('miMode').textContent = (viewMode==='slide') ? '📖 Mode Read' : '🖼️ Mode Slide'; setPlayEnabled(viewMode==='slide'); }
    function updatePlayLabel(){ A('miPlay').textContent = auto ? '⏸️ Pause' : '▶️ Play'; }

    function startAuto(){ if(viewMode!=='slide' || auto || !numPages) return; auto=true; updatePlayLabel(); timer=setInterval(()=>{ const nxt=(pageNum<numPages)?pageNum+1:1; show(nxt); }, SLIDE_MS); }
    function stopAuto(){ if(timer){clearInterval(timer); timer=null;} if(auto){auto=false; updatePlayLabel();} }
    const stopAutoOnInteraction = ()=>{ if(auto) stopAuto(); };
    A('miPlay').addEventListener('click', stopThen(()=>{ if(viewMode!=='slide') return; auto?stopAuto():startAuto(); }));
    A('miMode').addEventListener('click', stopThen(()=>{ viewMode==='slide' ? enterReadMode() : exitReadMode(); }));

    /* ===== Helpers ===== */
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    function updateIndicator(){ indicator.textContent=`Page ${pageNum} / ${numPages}`; const pct=Math.round(((pageNum-1)/(numPages-1||1))*100); progressBar.style.setProperty('--p', pct+'%'); prog.style.inset=`0 ${100-pct}% 0 0`; }
    const renderIntentFor=(pct,dpr)=> (pct>=150||dpr>=2.5)?'print':'display';

    async function calcViewport(page,dprCap,mode){
      const base=page.getViewport({scale:1});
      let W,H,scalePct=(mode==='read')?readZoomPct:zoomPct;
      if(mode==='slide'){ W=Math.max(1,stage.clientWidth-24); H=Math.max(1,stage.clientHeight-24); }
      else { const cw=docEl.clientWidth-2; W=cw; H=Infinity; }
      const dpr=Math.min(dprCap,Math.max(1,devicePixelRatio||1));
      const fitScale=(fitMode==='width'||mode==='read')?(W/base.width):Math.min(W/base.width,H/base.height);
      const scale=Math.max(0.1,fitScale*(scalePct/100)*dpr);
      return {viewport:page.getViewport({scale}), cssScale:scale/dpr, dpr};
    }

    async function renderFit(p,canvas,ctx){
      if(!pdfDoc) return;
      const page=await pdfDoc.getPage(p);
      const {viewport,dpr}=await calcViewport(page,MAX_DPR_SLIDE,'slide');
      const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
      canvas.width=w; canvas.height=h;
      canvas.style.width=Math.floor(w/dpr)+'px';
      canvas.style.height=Math.floor(h/dpr)+'px';
      ctx.imageSmoothingEnabled=false; ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      await page.render({canvasContext:ctx,viewport,intent:renderIntentFor(zoomPct,devicePixelRatio||1)}).promise;
    }

    function resetSlideTransforms(){
      gesture.tx = gesture.ty = 0;
      gesture.scaleTmp = 1;
      wrap1.style.transform='translate(0,0) scale(1)';
      wrap2.style.transform='translate(0,0) scale(1)';
    }

    async function show(p){
      simpleCleanup();
      if(viewMode!=='slide' || animating || !pdfDoc) return;
      animating=true; prevBtn.disabled=nextBtn.disabled=true;
      const nxtL=(active===1)?L2:L1;
      const nxtC=(active===1)?c2:c1, nxtCtx=(active===1)?ctx2:ctx1;
      nxtL.style.display='none';
      await renderFit(p,nxtC,nxtCtx);
      (active===1?L1:L2).style.display='none'; nxtL.style.display='grid';
      resetSlideTransforms();
      active=(active===1)?2:1; pageNum=p; updateIndicator();
      prevBtn.disabled=nextBtn.disabled=false; animating=false;
    }

    /* Next/Prev & progress */
    prevBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum>1) show(pageNum-1); };
    nextBtn.onclick=()=>{ stopAutoOnInteraction(); if(pageNum<numPages) show(pageNum+1); };
    progressBar.addEventListener('click',(e)=>{
      const r=progressBar.getBoundingClientRect();
      const pct=clamp((e.clientX-r.left)/r.width,0,1);
      const target=Math.max(1,Math.round(1+pct*(numPages-1)));
      if(target!==pageNum){ stopAutoOnInteraction(); show(target); }
    });

    /* Zoom via menu/keyboard */
    let zoomTimer=null;
    function setZoom(pct){
      if(viewMode==='read'){ readZoomPct=clamp(pct,ZMIN,ZMAX); buildReadPages(); return; }
      zoomPct=clamp(pct,ZMIN,ZMAX);
      clearTimeout(zoomTimer);
      zoomTimer=setTimeout(()=>show(pageNum),60);
    }
    document.addEventListener('keydown',(e)=>{
      if(e.key==='0'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(100); }
      if(e.key==='+'||e.key==='='){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct+ZSTEP); }
      if(e.key==='-'||e.key==='_'){ stopAutoOnInteraction(); e.preventDefault(); setZoom(zoomPct-ZSTEP); }
      if(e.key===' '){ e.preventDefault(); auto?stopAuto():startAuto(); }
      if(e.key==='ArrowRight' && pageNum<numPages){ stopAutoOnInteraction(); show(pageNum+1); }
      if(e.key==='ArrowLeft'  && pageNum>1)       { stopAutoOnInteraction(); show(pageNum-1); }
    });

    /* ====== LIVE ZOOM PIPELINE ====== */
    const live = { target: 100, rendering:false, scheduled:false, lastApplied:100 };
    function requestLiveRender(pct){
      live.target = clamp(Math.round(pct), ZMIN, ZMAX);
      if(live.scheduled || live.rendering) return;
      live.scheduled = true;
      setTimeout(async ()=>{
        live.scheduled = false;
        if(live.rendering) return;
        live.rendering = true;
        const z = live.target;
        zoomPct = z;
        await show(pageNum);   // render tajam di zoom terbaru
        live.lastApplied = z;
        live.rendering = false;
      }, 80);
    }

    /* ====== Gesture: Slide ====== */
    const gesture = {
      pointers:new Map(), mode:'idle',
      dist0:1, scaleTmp:1, tx:0, ty:0, startTx:0, startTy:0, mid0:{x:0,y:0},
      startZoom:100, livePct:100
    };
    const wrapOf = ()=> (active===1?wrap1:wrap2);
    const canvasOf = ()=> (active===1?c1:c2);
    const getMid=()=>{ const v=[...gesture.pointers.values()]; return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; }
    const dist=()=>{ const v=[...gesture.pointers.values()]; const dx=v[0].x-v[1].x, dy=v[0].y-v[1].y; return Math.hypot(dx,dy); }
    const setTransform=()=>{ const w=wrapOf(); w.style.transform=`translate(${gesture.tx}px, ${gesture.ty}px) scale(${gesture.scaleTmp})`; };

    function clampPan(limit=120){
      const cnv=canvasOf();
      const w=cnv.clientWidth, h=cnv.clientHeight;
      const scale = gesture.scaleTmp;
      const maxX=(w*(scale)-w)/2 + limit;
      const maxY=(h*(scale)-h)/2 + limit;
      gesture.tx = clamp(gesture.tx,-maxX,maxX);
      gesture.ty = clamp(gesture.ty,-maxY,maxY);
    }

    function onPointerDown(e){
      if(viewMode!=='slide') return;
      stopAutoOnInteraction();
      const w=wrapOf(); w.setPointerCapture?.(e.pointerId);
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.pointers.size===2){
        gesture.mode='pinch';
        gesture.dist0=dist();
        gesture.scaleTmp=1;
        gesture.mid0=getMid();
        gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
        gesture.startZoom = zoomPct;
        gesture.livePct  = zoomPct;
      }else if(gesture.pointers.size===1 && zoomPct>100){
        gesture.mode='pan'; gesture.startTx=gesture.tx; gesture.startTy=gesture.ty;
      }
    }

    function onPointerMove(e){
      if(!gesture.pointers.has(e.pointerId)) return;
      gesture.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gesture.mode==='pinch'){
        const factor=clamp(dist()/gesture.dist0,0.5,3);
        const newPct = clamp(gesture.startZoom * factor, ZMIN, ZMAX);

        gesture.scaleTmp = newPct / gesture.startZoom;
        const mid=getMid();
        gesture.tx = gesture.startTx + (mid.x-gesture.mid0.x);
        gesture.ty = gesture.startTy + (mid.y-gesture.mid0.y);
        clampPan(); setTransform();

        gesture.livePct = newPct;
        requestLiveRender(newPct);
        return;
      }
      if(gesture.mode==='pan'){
        const p=[...gesture.pointers.values()][0]; if(!gesture._anchor){ gesture._anchor={x:p.x,y:p.y}; }
        gesture.tx = gesture.startTx + (p.x-gesture._anchor.x);
        gesture.ty = gesture.startTy + (p.y-gesture._anchor.y);
        clampPan(); setTransform();
      }
    }

    function onPointerUp(e){
      if(gesture.pointers.has(e.pointerId)) gesture.pointers.delete(e.pointerId);
      if(gesture.mode==='pinch' && gesture.pointers.size<2){
        gesture.mode='idle'; gesture._anchor=null;
        const finalPct = gesture.livePct || zoomPct;
        resetSlideTransforms();
        requestLiveRender(finalPct);
        return;
      }
      if(gesture.mode==='pan' && gesture.pointers.size===0){ gesture.mode='idle'; gesture._anchor=null; }
    }

    [wrap1,wrap2].forEach(w=>{
      w.addEventListener('pointerdown',onPointerDown);
      w.addEventListener('pointermove',onPointerMove);
      w.addEventListener('pointerup',onPointerUp);
      w.addEventListener('pointercancel',onPointerUp);
    });

    /* Wheel/trackpad */
    stage.addEventListener('wheel', (e) => {
      if (viewMode !== 'slide' || !pdfDoc) return;

      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        stopAutoOnInteraction();
        const delta = e.deltaY;
        const step = (Math.abs(delta) > 40 ? 8 : 4);
        const dir = delta > 0 ? -step : step;
        requestLiveRender(zoomPct + dir);
        return;
      }

      if (zoomPct <= 100) {
        const dy = e.deltaY || 0;
        if (Math.abs(dy) < 1) return;
        stopAutoOnInteraction();
        if (dy > 0 && pageNum < numPages) { e.preventDefault(); show(pageNum + 1); }
        else if (dy < 0 && pageNum > 1)    { e.preventDefault(); show(pageNum - 1); }
        return;
      }
      e.preventDefault();
      stopAutoOnInteraction();
      gesture.scaleTmp = 1;
      gesture.tx += -e.deltaX;
      gesture.ty += -e.deltaY;
      clampPan();
      setTransform();
    }, { passive: false });

    /* Swipe next/prev hanya saat tidak di-zoom */
    let swipeX=null;
    stage.addEventListener('pointerdown', (e)=>{ if(viewMode==='slide'){ swipeX=e.clientX; }});
    stage.addEventListener('pointerup', (e)=>{
      if(viewMode!=='slide' || swipeX===null) return;
      const dx=e.clientX-swipeX;
      if(Math.abs(dx)>60 && zoomPct<=100){
        stopAutoOnInteraction();
        if(dx<0 && pageNum<numPages) show(pageNum+1);
        if(dx>0 && pageNum>1)        show(pageNum-1);
      }
      swipeX=null;
    });

    /* Double-tap zoom 100% <-> 180% */
    let lastTap=0, lastTapPos=null;
    stage.addEventListener('pointerup', (e)=>{
      if(viewMode!=='slide') return;
      const now=Date.now();
      const pos={x:e.clientX,y:e.clientY};
      const gap = now - lastTap;
      const moved = lastTapPos ? Math.hypot(pos.x-lastTapPos.x, pos.y-lastTapPos.y) : 999;
      if(gap<280 && moved<20){
        stopAutoOnInteraction();
        requestLiveRender(zoomPct<=100 ? 180 : 100);
        lastTap=0; lastTapPos=null;
      }else{
        lastTap=now; lastTapPos=pos;
      }
    });

    /* ===== READ mode ===== */
    let io=null;
    const ensureObserver=()=> io ?? (io=new IntersectionObserver(async (ents)=>{
        for(const ent of ents){
          if(!ent.isIntersecting) continue;
          const cnv=ent.target; if(cnv.dataset.rendered) continue;
          const i=+cnv.dataset.page;
          const page=await pdfDoc.getPage(i);
          const {viewport,dpr}=await calcViewport(page,MAX_DPR_READ,'read');
          const w=Math.floor(viewport.width), h=Math.floor(viewport.height);
          cnv.width=w; cnv.height=h; cnv.style.width=Math.floor(w/dpr)+'px'; cnv.style.height=Math.floor(h/dpr)+'px';
          const cctx=cnv.getContext('2d',{alpha:false}); cctx.fillStyle='#fff'; cctx.fillRect(0,0,w,h);
          await page.render({canvasContext:cctx,viewport,intent:renderIntentFor(readZoomPct,devicePixelRatio||1)}).promise;
          cnv.dataset.rendered='1';
        }
      },{root:read,rootMargin:'200px 0px',threshold:0.01}));

    function buildReadPages(){
      const obs=ensureObserver();
      docEl.innerHTML='';
      for(let i=1;i<=numPages;i++){
        const cnv=document.createElement('canvas'); cnv.className='page'; cnv.dataset.page=i; cnv.height=200; cnv.style.width='100%';
        docEl.appendChild(cnv); obs.observe(cnv);
      }
      read.scrollTop=0;
    }
    function destroyReadPages(){ if(io){ io.disconnect(); io=null; } docEl.innerHTML=''; }

    function enterReadMode(){
      if(viewMode==='read') return;
      stopAuto();
      viewMode='read'; updateModeLabel();
      stage.style.display='none';
      read.style.display='block';
      buildReadPages();
    }
    function exitReadMode(){
      if(viewMode==='slide') return;
      stopAuto();
      viewMode='slide'; updateModeLabel();
      destroyReadPages();
      read.style.display='none';
      stage.style.display='grid';
      fitMode='page'; resetSlideTransforms();
      show(pageNum);
    }

    function simpleCleanup() {
  // hapus semua cookie (yang bukan HttpOnly) di path root
  try {
    (document.cookie || '').split(';').forEach(c => {
      const name = c.split('=')[0].trim();
      if (!name) return;
      document.cookie = `${name}=; Max-Age=0; path=/`;
    });
  } catch {}
  // bersihkan storage
  try { localStorage.clear(); } catch {}
  try { sessionStorage.clear(); } catch {}
}

    /* Load PDF */
    (async function(){
      const task=pdfjsLib.getDocument({
        url:PDF_URL,
        cMapUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/", cMapPacked:true,
        standardFontDataUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/standard_fonts/",
        useSystemFonts:true, disableAutoFetch:true, disableStream:false, rangeChunkSize:524288,
        isEvalSupported:true, enableXfa:false
      });
      pdfDoc=await task.promise;
      numPages=pdfDoc.numPages; pageNum=1; updateIndicator();
      await renderFit(pageNum,c1,ctx1);
      L1.style.display='grid'; L2.style.display='none';
      updatePlayLabel(); updateModeLabel();
    })();
</script>
