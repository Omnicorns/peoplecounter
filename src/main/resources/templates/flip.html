<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarinah Catalogue - Premium Book</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root{
          --midnight: #0a0e27;
          --navy: #1a1f3a;
          --cream: #fdfbf7;
          --gold: #d4af37;
          --gold-dark: #b8941f;
          --leather: #3d2817;
          --text: #2c2416;
          --shadow: rgba(0,0,0,0.3);
          --glow: rgba(212, 175, 55, 0.2);
          --safe-top: env(safe-area-inset-top, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
        }

        html,body{
          height:100%;
          overflow:hidden;
        }

        body{
          background: radial-gradient(circle at 50% 0%, var(--navy) 0%, var(--midnight) 100%);
          color:var(--text);
          font-family: 'Lato', -apple-system, sans-serif;
          display:flex;
          align-items:center;
          justify-content:center;
          position: relative;
        }

        /* Ambient light effect */
        body::before {
          content: '';
          position: fixed;
          top: -50%;
          left: 50%;
          transform: translateX(-50%);
          width: 150%;
          height: 150%;
          background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
          opacity: 0.3;
          pointer-events: none;
          z-index: 0;
        }

        /* Loading overlay - Premium */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--midnight) 0%, var(--navy) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-overlay.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loading-logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 48px;
            font-weight: 600;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 40px;
            text-shadow: 0 0 20px var(--glow);
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { opacity: 1; text-shadow: 0 0 20px var(--glow); }
            50% { opacity: 0.8; text-shadow: 0 0 40px var(--glow); }
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: elegantSpin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes elegantSpin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 30px;
            color: var(--gold);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .loading-progress {
            margin-top: 12px;
            color: var(--gold);
            font-size: 24px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px var(--glow);
        }

        #viewer{
          position:relative;
          width:min(96vw, 1400px);
          height:min(92vh, 900px);
          perspective: 2500px;
          z-index: 1;
        }

        /* Book Container */
        .book-container {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .book {
          position: relative;
          width: 92%;
          height: 88%;
          transform-style: preserve-3d;
          box-shadow:
            0 40px 100px rgba(0,0,0,0.6),
            0 20px 60px rgba(0,0,0,0.4),
            0 0 0 1px rgba(212,175,55,0.1);
          border-radius: 4px;
          transition: transform 0.3s ease;
        }

        .book:hover {
          transform: translateY(-4px);
        }

        /* Book Pages Container */
        .book-pages {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          background: var(--cream);
          border-radius: 4px;
          overflow: hidden;
        }

        /* Cover Page Mode */
        .book.cover-mode .page-left {
          width: 100%;
          border-right: none;
        }

        .book.cover-mode .page-right {
          display: none;
        }

        .book.cover-mode .book-spine {
          display: none;
        }

        /* Left and Right Page */
        .page-left, .page-right {
          position: absolute;
          width: 50%;
          height: 100%;
          background: var(--cream);
          padding: 50px 40px;
          box-shadow: inset 0 0 40px rgba(0,0,0,0.03);
          transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
          overflow: hidden;
        }

        .page-left {
          left: 0;
          border-right: 1px solid rgba(212,175,55,0.15);
        }

        .page-right {
          right: 0;
          border-left: 1px solid rgba(212,175,55,0.15);
        }

        /* Page texture */
        .page-left::before,
        .page-right::before {
          content: '';
          position: absolute;
          inset: 0;
          background:
            repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 3px);
          pointer-events: none;
          opacity: 0.3;
        }

        /* Canvas container */
        .canvas-container {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        canvas {
          max-width: 100%;
          max-height: 100%;
          display: block;
          filter: contrast(1.03) brightness(1.01);
          image-rendering: -webkit-optimize-contrast;
          image-rendering: crisp-edges;
          -ms-interpolation-mode: nearest-neighbor;
        }

        /* Book Spine - Premium */
        .book-spine {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          width: 50px;
          height: 100%;
          background:
            linear-gradient(90deg,
              rgba(61,40,23,0.3) 0%,
              rgba(61,40,23,0.9) 20%,
              var(--leather) 50%,
              rgba(61,40,23,0.9) 80%,
              rgba(61,40,23,0.3) 100%);
          box-shadow:
            inset 0 0 30px rgba(0,0,0,0.6),
            inset 2px 0 2px rgba(0,0,0,0.3),
            inset -2px 0 2px rgba(0,0,0,0.3),
            -3px 0 15px rgba(0,0,0,0.4),
            3px 0 15px rgba(0,0,0,0.4);
          z-index: 10;
          transition: opacity 0.3s ease;
        }

        /* Flipping Page - Enhanced */
        .flip-page {
          position: absolute;
          right: 0;
          width: 50%;
          height: 100%;
          background: var(--cream);
          transform-origin: left center;
          transform-style: preserve-3d;
          transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          z-index: 15;
          display: none;
        }

        .flip-page.active {
          display: block;
        }

        .flip-page.flipping {
          transform: rotateY(-180deg);
        }

        .flip-page-front, .flip-page-back {
          position: absolute;
          width: 100%;
          height: 100%;
          backface-visibility: hidden;
          padding: 50px 40px;
          background: var(--cream);
          box-shadow: 0 0 30px rgba(0,0,0,0.15);
          overflow: hidden;
        }

        .flip-page-front {
          transform: rotateY(0deg);
        }

        .flip-page-back {
          transform: rotateY(180deg);
          box-shadow: -8px 0 30px rgba(0,0,0,0.4);
        }

        /* Page curl effect */
        .flip-page::before {
          content: '';
          position: absolute;
          right: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(to left,
            rgba(0,0,0,0.2) 0%,
            rgba(0,0,0,0.05) 10%,
            transparent 30%);
          pointer-events: none;
          opacity: 0;
          transition: opacity 0.6s ease;
          z-index: 1;
        }

        .flip-page.flipping::before {
          opacity: 1;
        }

        /* Shadow during flip */
        .flip-page::after {
          content: '';
          position: absolute;
          left: 0;
          top: 0;
          width: 40px;
          height: 100%;
          background: linear-gradient(to right,
            rgba(0,0,0,0.5) 0%,
            rgba(0,0,0,0.2) 50%,
            transparent 100%);
          opacity: 0;
          transition: opacity 0.6s ease;
          z-index: -1;
        }

        .flip-page.flipping::after {
          opacity: 1;
        }

        /* Cover flip */
        .flip-page.cover-flip {
          right: auto;
          left: 0;
          transform-origin: right center;
          width: 100%;
        }

        .flip-page.cover-flip.flipping {
          transform: rotateY(180deg);
        }

        /* Menu Button - Premium */
        .menu-btn {
          position: absolute;
          top: 30px;
          left: 30px;
          z-index: 100;
          background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
          color: var(--midnight);
          border: none;
          padding: 14px 28px;
          border-radius: 30px;
          cursor: pointer;
          font-family: inherit;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 1px;
          transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
          box-shadow:
            0 8px 24px rgba(212, 175, 55, 0.3),
            0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .menu-btn:hover {
          transform: translateY(-3px);
          box-shadow:
            0 12px 32px rgba(212, 175, 55, 0.4),
            0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .menu-btn:active {
          transform: translateY(-1px);
        }

        /* Popover - Premium */
        .popover {
          position: absolute;
          top: 90px;
          left: 30px;
          width: 260px;
          background: rgba(26, 31, 58, 0.98);
          border: 1px solid rgba(212, 175, 55, 0.3);
          border-radius: 16px;
          padding: 12px;
          box-shadow:
            0 20px 60px rgba(0,0,0,0.6),
            0 0 0 1px rgba(212, 175, 55, 0.1);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          display: none;
          z-index: 101;
          animation: menuFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes menuFadeIn {
          from {
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
          }
          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }

        .popover.show {
          display: block;
        }

        .popitem {
          width: 100%;
          background: transparent;
          border: none;
          color: var(--cream);
          text-align: left;
          padding: 14px 18px;
          border-radius: 10px;
          cursor: pointer;
          font-family: inherit;
          font-size: 14px;
          font-weight: 400;
          transition: all 0.2s ease;
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 3px 0;
        }

        .popitem:hover {
          background: rgba(212, 175, 55, 0.15);
          color: var(--gold);
          transform: translateX(4px);
        }

        .sep {
          height: 1px;
          background: rgba(212, 175, 55, 0.2);
          margin: 8px 12px;
          border: 0;
        }

        /* Navigation Arrows - Premium */
        .nav-arrow {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 60px;
          height: 60px;
          background: linear-gradient(135deg, rgba(212, 175, 55, 0.9) 0%, rgba(184, 148, 31, 0.9) 100%);
          border: 2px solid rgba(255, 255, 255, 0.2);
          border-radius: 50%;
          display: grid;
          place-items: center;
          cursor: pointer;
          font-size: 28px;
          color: var(--midnight);
          transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
          z-index: 50;
          box-shadow:
            0 10px 30px rgba(212, 175, 55, 0.3),
            0 0 0 1px rgba(212, 175, 55, 0.1);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
        }

        .nav-arrow:hover {
          transform: translateY(-50%) scale(1.15);
          box-shadow:
            0 15px 40px rgba(212, 175, 55, 0.5),
            0 0 0 1px rgba(212, 175, 55, 0.3);
        }

        .nav-arrow:active {
          transform: translateY(-50%) scale(1.05);
        }

        .nav-arrow:disabled {
          opacity: 0.2;
          cursor: not-allowed;
          transform: translateY(-50%) scale(1);
        }

        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        /* Page Info - Premium */
        #page-info {
          position: absolute;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          background: linear-gradient(135deg, rgba(212, 175, 55, 0.95) 0%, rgba(184, 148, 31, 0.95) 100%);
          color: var(--midnight);
          padding: 12px 32px;
          border-radius: 30px;
          font-size: 15px;
          font-weight: 700;
          font-variant-numeric: tabular-nums;
          box-shadow:
            0 10px 30px rgba(212, 175, 55, 0.3),
            0 0 0 1px rgba(255, 255, 255, 0.2);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          z-index: 100;
          letter-spacing: 0.5px;
        }

        /* Page Numbers */
        .page-number {
          position: absolute;
          bottom: 30px;
          font-size: 13px;
          color: rgba(44,36,22,0.4);
          font-style: italic;
          font-family: 'Playfair Display', Georgia, serif;
        }

        .page-left .page-number {
          left: 40px;
        }

        .page-right .page-number {
          right: 40px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
          .book {
            width: 94%;
            height: 86%;
          }

          .page-left, .page-right, .flip-page-front, .flip-page-back {
            padding: 35px 25px;
          }

          .book-spine {
            width: 35px;
          }
        }

        @media (max-width: 768px) {
          #viewer {
            width: 98vw;
            height: 95vh;
          }

          .book {
            width: 96%;
            height: 84%;
          }

          .page-left, .page-right, .flip-page-front, .flip-page-back {
            padding: 25px 18px;
          }

          .book-spine {
            width: 25px;
          }

          .nav-arrow {
            width: 50px;
            height: 50px;
            font-size: 24px;
          }

          #prev-btn { left: 15px; }
          #next-btn { right: 15px; }

          .menu-btn {
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            font-size: 14px;
          }

          .popover {
            top: 75px;
            left: 20px;
            width: 240px;
          }

          #page-info {
            bottom: 20px;
            font-size: 14px;
            padding: 10px 28px;
          }

          .loading-logo {
            font-size: 36px;
          }
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-logo">Sarinah</div>
    <div class="spinner"></div>
    <div class="loading-text">Loading Catalogue</div>
    <div class="loading-progress" id="loadingProgress">0%</div>
</div>

<div id="viewer">
    <!-- Menu Button -->
    <button class="menu-btn" id="menuBtn">☰ Menu</button>

    <!-- Popover Menu -->
    <div class="popover" id="menuPopover">
        <button class="popitem" id="downloadBtn">⬇️ Download PDF</button>
        <button class="popitem" id="fullscreenBtn">⤢ Fullscreen</button>
        <hr class="sep">
        <button class="popitem" id="zoomInBtn">🔍+ Zoom In</button>
        <button class="popitem" id="zoomOutBtn">🔍- Zoom Out</button>
        <button class="popitem" id="zoomResetBtn">⟲ Reset Zoom</button>
        <hr class="sep">
        <button class="popitem" id="firstPageBtn">⏮️ First Page</button>
        <button class="popitem" id="lastPageBtn">⏭️ Last Page</button>
        <hr class="sep">
        <button class="popitem" id="autoPlayBtn">▶️ Auto Play</button>
    </div>

    <!-- Book Container -->
    <div class="book-container">
        <div class="book">
            <!-- Book Spine -->
            <div class="book-spine"></div>

            <!-- Book Pages -->
            <div class="book-pages">
                <!-- Left Page -->
                <div class="page-left">
                    <div class="canvas-container">
                        <canvas id="canvasLeft"></canvas>
                    </div>
                    <div class="page-number" id="pageNumLeft"></div>
                </div>

                <!-- Right Page -->
                <div class="page-right">
                    <div class="canvas-container">
                        <canvas id="canvasRight"></canvas>
                    </div>
                    <div class="page-number" id="pageNumRight"></div>
                </div>

                <!-- Flipping Page -->
                <div class="flip-page" id="flipPage">
                    <div class="flip-page-front">
                        <div class="canvas-container">
                            <canvas id="canvasFlipFront"></canvas>
                        </div>
                    </div>
                    <div class="flip-page-back">
                        <div class="canvas-container">
                            <canvas id="canvasFlipBack"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Arrows -->
        <button class="nav-arrow" id="prev-btn">‹</button>
        <button class="nav-arrow" id="next-btn">›</button>
    </div>

    <!-- Page Info -->
    <div id="page-info">Page <span id="currentPage">1</span> / <span id="totalPages">1</span></div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.DEFAULT_PDF = /*[[ ${pdfUrl} != null ? @{${pdfUrl}} : @{/file.pdf} ]]*/ '/file.pdf';
    /*]]>*/
</script>

<script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/build/pdf.worker.mjs";

    const params = new URLSearchParams(location.search);
    let PDF_URL = params.get('pdf') || window.DEFAULT_PDF;

    // State
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let isFlipping = false;
    let autoPlay = false;
    let autoPlayTimer = null;
    const AUTO_PLAY_DELAY = 3000;
    let isCoverPage = true;
    let zoomLevel = 1.0;

    // Render cache for instant page flips
    const renderCache = new Map();
    const MAX_CACHE_SIZE = 8;

    // Elements
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingProgress = document.getElementById('loadingProgress');
    const canvasLeft = document.getElementById('canvasLeft');
    const canvasRight = document.getElementById('canvasRight');
    const canvasFlipFront = document.getElementById('canvasFlipFront');
    const canvasFlipBack = document.getElementById('canvasFlipBack');
    const flipPage = document.getElementById('flipPage');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentPageEl = document.getElementById('currentPage');
    const totalPagesEl = document.getElementById('totalPages');
    const pageNumLeft = document.getElementById('pageNumLeft');
    const pageNumRight = document.getElementById('pageNumRight');
    const menuBtn = document.getElementById('menuBtn');
    const menuPopover = document.getElementById('menuPopover');
    const downloadBtn = document.getElementById('downloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const firstPageBtn = document.getElementById('firstPageBtn');
    const lastPageBtn = document.getElementById('lastPageBtn');
    const autoPlayBtn = document.getElementById('autoPlayBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');

    // Menu toggle
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuPopover.classList.toggle('show');
    });
    document.addEventListener('click', () => {
      menuPopover.classList.remove('show');
    });

    // Menu actions
    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = PDF_URL.split('?')[0];
      a.download = 'catalogue.pdf';
      a.click();
      menuPopover.classList.remove('show');
    });

    fullscreenBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen?.();
      }
      menuPopover.classList.remove('show');
    });

    firstPageBtn.addEventListener('click', () => {
      goToPage(1);
      menuPopover.classList.remove('show');
    });

    lastPageBtn.addEventListener('click', () => {
      const maxPage = Math.ceil((totalPages - 1) / 2) + 1;
      goToPage(maxPage);
      menuPopover.classList.remove('show');
    });

    autoPlayBtn.addEventListener('click', () => {
      toggleAutoPlay();
      menuPopover.classList.remove('show');
    });

    zoomInBtn.addEventListener('click', async () => {
      zoomLevel = Math.min(zoomLevel + 0.2, 3.0);
      renderCache.clear();
      await displaySpread();
      menuPopover.classList.remove('show');
    });

    zoomOutBtn.addEventListener('click', async () => {
      zoomLevel = Math.max(zoomLevel - 0.2, 0.5);
      renderCache.clear();
      await displaySpread();
      menuPopover.classList.remove('show');
    });

    zoomResetBtn.addEventListener('click', async () => {
      zoomLevel = 1.0;
      renderCache.clear();
      await displaySpread();
      menuPopover.classList.remove('show');
    });

    // Optimized render with caching
    async function renderPage(pageNum, canvas, useCache = true) {
      if (!pdfDoc || pageNum < 1 || pageNum > totalPages) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fdfbf7';
        ctx.fillRect(0, 0, canvas.width || 800, canvas.height || 600);
        return;
      }

      const cacheKey = `${pageNum}-${zoomLevel.toFixed(2)}`;

      // Check cache
      if (useCache && renderCache.has(cacheKey)) {
        const cached = renderCache.get(cacheKey);
        canvas.width = cached.width;
        canvas.height = cached.height;
        canvas.style.width = cached.cssWidth;
        canvas.style.height = cached.cssHeight;
        const ctx = canvas.getContext('2d');
        ctx.putImageData(cached.imageData, 0, 0);
        return;
      }

      try {
        const page = await pdfDoc.getPage(pageNum);
        const container = canvas.parentElement;
        const containerWidth = container.clientWidth - 80;
        const containerHeight = container.clientHeight - 100;

        const baseViewport = page.getViewport({ scale: 1 });
        const scaleToFit = Math.min(
          containerWidth / baseViewport.width,
          containerHeight / baseViewport.height
        );

        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const renderScale = scaleToFit * dpr * 1.3 * zoomLevel;

        const viewport = page.getViewport({ scale: renderScale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = Math.floor(viewport.width / dpr / 1.3) + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr / 1.3) + 'px';

        const ctx = canvas.getContext('2d', {
          alpha: false,
          desynchronized: true,
          willReadFrequently: true
        });

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        await page.render({
          canvasContext: ctx,
          viewport: viewport,
          intent: 'print'
        }).promise;

        // Cache the result
        if (useCache && renderCache.size < MAX_CACHE_SIZE) {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          renderCache.set(cacheKey, {
            imageData,
            width: canvas.width,
            height: canvas.height,
            cssWidth: canvas.style.width,
            cssHeight: canvas.style.height
          });
        }

      } catch (error) {
        console.error(`Error rendering page ${pageNum}:`, error);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fdfbf7';
        ctx.fillRect(0, 0, canvas.width || 800, canvas.height || 600);
      }
    }

    // Preload adjacent pages for instant flips
    async function preloadAdjacentPages() {
      const pagesToPreload = [];

      if (currentPage === 1) {
        // Preload pages 2-3 (next spread)
        pagesToPreload.push(2, 3);
      } else {
        const leftPageNum = (currentPage - 1) * 2;
        const rightPageNum = (currentPage - 1) * 2 + 1;

        // Preload next spread
        pagesToPreload.push(rightPageNum + 1, rightPageNum + 2);

        // Preload previous spread
        if (leftPageNum > 2) {
          pagesToPreload.push(leftPageNum - 2, leftPageNum - 1);
        }
      }

      // Render to cache in background
      const tempCanvas = document.createElement('canvas');
      for (const pageNum of pagesToPreload) {
        if (pageNum > 0 && pageNum <= totalPages) {
          await renderPage(pageNum, tempCanvas, true);
        }
      }
    }

    // Display current spread
    async function displaySpread() {
      const book = document.querySelector('.book');

      if (currentPage === 1) {
        isCoverPage = true;
        book.classList.add('cover-mode');
        await renderPage(1, canvasLeft);
        document.querySelector('.page-right').style.display = 'none';
        pageNumLeft.textContent = '1';
        pageNumRight.textContent = '';
        currentPageEl.textContent = '1';
      } else {
        isCoverPage = false;
        book.classList.remove('cover-mode');
        document.querySelector('.page-right').style.display = 'block';

        const leftPageNum = (currentPage - 1) * 2;
        const rightPageNum = (currentPage - 1) * 2 + 1;

        await Promise.all([
          renderPage(leftPageNum, canvasLeft),
          renderPage(rightPageNum, canvasRight)
        ]);

        pageNumLeft.textContent = leftPageNum <= totalPages ? leftPageNum : '';
        pageNumRight.textContent = rightPageNum <= totalPages ? rightPageNum : '';
        currentPageEl.textContent = `${leftPageNum}${rightPageNum <= totalPages ? '-' + rightPageNum : ''}`;
      }

      updateNavButtons();

      // Preload adjacent pages in background
      setTimeout(() => preloadAdjacentPages(), 100);
    }

    function updateNavButtons() {
      prevBtn.disabled = currentPage <= 1;
      const maxPage = Math.ceil((totalPages - 1) / 2) + 1;
      nextBtn.disabled = currentPage >= maxPage;
    }

    // Next page with flip animation
    async function nextPage() {
      const maxPage = Math.ceil((totalPages - 1) / 2) + 1;
      if (isFlipping || currentPage >= maxPage) return;

      isFlipping = true;
      stopAutoPlay();

      const nextPageNum = currentPage + 1;

      if (currentPage === 1) {
        flipPage.classList.add('cover-flip', 'active');
        await Promise.all([
          renderPage(1, canvasFlipFront),
          renderPage(2, canvasFlipBack)
        ]);
        await new Promise(resolve => requestAnimationFrame(() => {
          flipPage.classList.add('flipping');
          setTimeout(resolve, 50);
        }));
        await new Promise(resolve => setTimeout(resolve, 1200));
        currentPage = nextPageNum;
        await displaySpread();
        flipPage.classList.remove('flipping', 'active', 'cover-flip');
      } else {
        const flipFrontNum = (currentPage - 1) * 2 + 1;
        const flipBackNum = (nextPageNum - 1) * 2;

        flipPage.classList.remove('cover-flip');
        flipPage.classList.add('active');

        await Promise.all([
          renderPage(flipFrontNum, canvasFlipFront),
          renderPage(flipBackNum, canvasFlipBack)
        ]);

        await new Promise(resolve => requestAnimationFrame(() => {
          flipPage.classList.add('flipping');
          setTimeout(resolve, 50);
        }));
        await new Promise(resolve => setTimeout(resolve, 1200));
        currentPage = nextPageNum;
        await displaySpread();
        flipPage.classList.remove('flipping', 'active');
      }

      isFlipping = false;
    }

    async function prevPage() {
      if (isFlipping || currentPage <= 1) return;
      isFlipping = true;
      stopAutoPlay();
      currentPage--;
      await displaySpread();
      isFlipping = false;
    }

    async function goToPage(page) {
      const maxPage = Math.ceil((totalPages - 1) / 2) + 1;
      if (isFlipping || page < 1 || page > maxPage) return;
      stopAutoPlay();
      currentPage = page;
      await displaySpread();
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
      }
      if (autoPlay) {
        autoPlay = false;
        autoPlayBtn.textContent = '▶️ Auto Play';
      }
    }

    function toggleAutoPlay() {
      autoPlay = !autoPlay;
      autoPlayBtn.textContent = autoPlay ? '⏸️ Pause' : '▶️ Auto Play';

      if (autoPlay) {
        autoPlayTimer = setInterval(async () => {
          const maxPage = Math.ceil((totalPages - 1) / 2) + 1;
          if (currentPage >= maxPage) {
            currentPage = 0;
          }
          await nextPage();
        }, AUTO_PLAY_DELAY);
      } else {
        stopAutoPlay();
      }
    }

    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === ' ') { e.preventDefault(); toggleAutoPlay(); }
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });
    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    });

    // Fast PDF Loading
    (async function() {
      try {
        console.log('⚡ Fast loading PDF:', PDF_URL);
        loadingProgress.textContent = '0%';

        const resp = await fetch(PDF_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const reader = resp.body.getReader();
        const contentLength = +resp.headers.get('content-length') || 0;
        let receivedLength = 0;
        const chunks = [];

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          chunks.push(value);
          receivedLength += value.length;

          if (contentLength > 0) {
            const pct = Math.round((receivedLength / contentLength) * 100);
            loadingProgress.textContent = pct + '%';
          }
        }

        const pdfBytes = new Uint8Array(receivedLength);
        let position = 0;
        for (const chunk of chunks) {
          pdfBytes.set(chunk, position);
          position += chunk.length;
        }

        loadingProgress.textContent = 'Processing...';

        pdfDoc = await pdfjsLib.getDocument({
          data: pdfBytes,
          cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.394/cmaps/",
          cMapPacked: true,
          useSystemFonts: true,
          disableAutoFetch: false,
          disableStream: false
        }).promise;

        totalPages = pdfDoc.numPages;
        totalPagesEl.textContent = totalPages;

        loadingProgress.textContent = 'Rendering...';
        await displaySpread();

        setTimeout(() => {
          loadingOverlay.classList.add('hide');
          console.log('✨ Ready!');
        }, 400);

      } catch (error) {
        console.error('❌ Load error:', error);
        loadingProgress.textContent = 'Error: ' + error.message;
        loadingProgress.style.color = '#ef4444';
      }
    })();
</script>

</body>
</html>
